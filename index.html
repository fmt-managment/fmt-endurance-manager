<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FMT Endurance</title>

<style>
:root {
    --bg: #0b0d10;
    --panel: #12161b;
    --panel2: #181d23;
    --border: #272e36;
    --text: #f2f4f7;
    --muted: #8f99a5;
    --accent: #9cff00;
    --danger: #ff4d5a;
    --warning: #ffc857;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
}

.container {
    max-width: 950px;
    margin: auto;
    padding: 25px 18px 50px;
}

header {
    text-align: center;
    margin-bottom: 35px;
}

.logo {
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 3px;
}

.logo span {
    color: var(--accent);
}

.subtitle {
    color: var(--muted);
    margin-top: 8px;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 12px 18px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: translateY(-1px);
}

.btn-primary {
    background: var(--accent);
    color: #000;
}

.btn-secondary {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
}

.btn-danger {
    background: var(--danger);
    color: white;
}

.panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px;
    margin-bottom: 20px;
}

h1, h2, h3 {
    margin-top: 0;
}

label {
    display: block;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 7px;
}

input,
select {
    width: 100%;
    padding: 12px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    font-size: 15px;
}

.form-group {
    margin-bottom: 18px;
}

.actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.event-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 15px;
    cursor: pointer;
    transition: 0.2s;
}

.event-card:hover {
    border-color: var(--accent);
}

.event-card h3 {
    margin-bottom: 8px;
}

.next-race {
    color: var(--accent);
    font-weight: bold;
    margin-top: 12px;
}

.departure {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 15px;
}

.departure-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

.departure-date {
    font-size: 18px;
    font-weight: bold;
}

.countdown {
    color: var(--accent);
    font-weight: bold;
    font-size: 15px;
}

.pilot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: #101419;
    border-radius: 7px;
    margin-top: 8px;
    flex-wrap: wrap;
}

.pilot-name {
    font-weight: bold;
}

.pilot-info {
    color: var(--muted);
    font-size: 14px;
}

.badge {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 5px;
    font-size: 12px;
    font-weight: bold;
    background: #252c33;
}

.empty {
    color: var(--muted);
    text-align: center;
    padding: 30px 10px;
}

.hidden {
    display: none;
}

.back {
    margin-bottom: 20px;
}

.departure-form {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 12px;
}

.departure-form-title {
    font-weight: bold;
    margin-bottom: 15px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.remove-departure {
    margin-top: 10px;
    color: var(--danger);
    background: transparent;
    padding: 5px;
}

.info {
    background: #161c21;
    border-left: 3px solid var(--accent);
    padding: 12px;
    margin-bottom: 20px;
    color: var(--muted);
    font-size: 14px;
}

@media (max-width: 650px) {
    .logo {
        font-size: 32px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .departure-header {
        align-items: flex-start;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <div class="logo">FMT <span>ENDURANCE</span></div>
    <div class="subtitle">Gestion simple des courses d'endurance</div>
</header>

<!-- PAGE ACCUEIL -->
<div id="homePage">

    <div class="actions" style="margin-bottom: 20px;">
        <button class="btn-primary" onclick="showCreateEvent()">
            + CRÉER UN ÉVÉNEMENT
        </button>
    </div>

    <div id="eventsList"></div>

</div>


<!-- PAGE CREATION -->
<div id="createPage" class="hidden">

    <button class="btn-secondary back" onclick="showHome()">
        ← Retour
    </button>

    <div class="panel">

        <h2>Créer un événement</h2>

        <div class="form-group">
            <label>Nom de l'événement</label>
            <input
                type="text"
                id="eventName"
                placeholder="Ex : Spa-Francorchamps"
            >
        </div>

        <h3>Départs</h3>

        <div id="departuresForm"></div>

        <button class="btn-secondary" onclick="addDepartureForm()">
            + Ajouter un départ
        </button>

        <div style="margin-top:20px;" class="actions">
            <button class="btn-primary" onclick="createEvent()">
                CRÉER L'ÉVÉNEMENT
            </button>

            <button class="btn-secondary" onclick="showHome()">
                Annuler
            </button>
        </div>

    </div>

</div>


<!-- PAGE EVENEMENT -->
<div id="eventPage" class="hidden">

    <button class="btn-secondary back" onclick="showHome()">
        ← Retour aux événements
    </button>

    <div id="eventContent"></div>

</div>


<!-- FORMULAIRE DISPONIBILITES -->
<div id="availabilityPage" class="hidden">

    <button class="btn-secondary back" onclick="showEvent(currentEventId)">
        ← Retour à l'événement
    </button>

    <div class="panel">

        <h2>Mes disponibilités</h2>

        <div class="info">
            Indique ton pseudo puis choisis ta catégorie de voiture et ta disponibilité pour chaque départ.
        </div>

        <div class="form-group">
            <label>Ton pseudo</label>
            <input
                type="text"
                id="pilotName"
                placeholder="Ex : McFly"
            >
        </div>

        <div id="availabilityForm"></div>

        <div class="actions">
            <button class="btn-primary" onclick="saveAvailability()">
                ENREGISTRER MES DISPONIBILITÉS
            </button>

            <button class="btn-secondary" onclick="showEvent(currentEventId)">
                Annuler
            </button>
        </div>

    </div>

</div>

</div>


<script>

/* =========================================================
   DONNÉES
========================================================= */

let events = JSON.parse(localStorage.getItem("fmtEvents")) || [];

let currentEventId = null;
let departureFormCount = 0;


/* =========================================================
   SAUVEGARDE
========================================================= */

function saveEvents() {
    localStorage.setItem("fmtEvents", JSON.stringify(events));
}


/* =========================================================
   OUTILS
========================================================= */

function generateId() {
    return Date.now().toString(36) + Math.random().toString(36).substring(2, 7);
}

function escapeHTML(text) {
    const div = document.createElement("div");
    div.textContent = text || "";
    return div.innerHTML;
}

function formatDate(date, time) {

    const d = new Date(`${date}T${time}`);

    return d.toLocaleDateString("fr-FR", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
    }) + " à " + time;
}

function getDepartureDate(departure) {
    return new Date(`${departure.date}T${departure.time}`);
}

function getNextDeparture(event) {

    const now = new Date();

    const upcoming = event.departures
        .filter(d => getDepartureDate(d) > now)
        .sort((a, b) => getDepartureDate(a) - getDepartureDate(b));

    return upcoming.length ? upcoming[0] : null;
}

function countdownText(departure) {

    const target = getDepartureDate(departure);
    const now = new Date();

    let diff = target - now;

    if (diff <= 0) {
        return "🏁 Course commencée";
    }

    const days = Math.floor(diff / 86400000);
    diff %= 86400000;

    const hours = Math.floor(diff / 3600000);
    diff %= 3600000;

    const minutes = Math.floor(diff / 60000);
    diff %= 60000;

    const seconds = Math.floor(diff / 1000);

    let result = "";

    if (days > 0) result += days + "j ";
    if (hours > 0 || days > 0) result += hours + "h ";
    if (minutes > 0 || hours > 0 || days > 0) result += minutes + "m ";

    result += seconds + "s";

    return result;
}


/* =========================================================
   NAVIGATION
========================================================= */

function hideAllPages() {

    document.getElementById("homePage").classList.add("hidden");
    document.getElementById("createPage").classList.add("hidden");
    document.getElementById("eventPage").classList.add("hidden");
    document.getElementById("availabilityPage").classList.add("hidden");
}

function showHome() {

    hideAllPages();

    document.getElementById("homePage").classList.remove("hidden");

    renderEvents();
}

function showCreateEvent() {

    hideAllPages();

    document.getElementById("createPage").classList.remove("hidden");

    document.getElementById("eventName").value = "";

    document.getElementById("departuresForm").innerHTML = "";

    departureFormCount = 0;

    addDepartureForm();
}

function showEvent(id) {

    currentEventId = id;

    hideAllPages();

    document.getElementById("eventPage").classList.remove("hidden");

    renderEvent(id);
}


/* =========================================================
   PAGE ACCUEIL
========================================================= */

function renderEvents() {

    const container = document.getElementById("eventsList");

    if (events.length === 0) {

        container.innerHTML = `
            <div class="panel empty">
                Aucun événement pour le moment.<br>
                Crée ton premier événement !
            </div>
        `;

        return;
    }

    container.innerHTML = events.map(event => {

        const next = getNextDeparture(event);

        return `
            <div class="event-card" onclick="showEvent('${event.id}')">

                <h3>${escapeHTML(event.name)}</h3>

                <div class="pilot-info">
                    ${event.departures.length}
                    départ${event.departures.length > 1 ? "s" : ""}
                </div>

                ${
                    next
                    ?
                    `
                    <div class="next-race">
                        ⏳ Prochain départ : ${formatDate(next.date, next.time)}
                        <br>
                        <span class="countdown"
                              data-countdown="${event.id}">
                            ${countdownText(next)}
                        </span>
                    </div>
                    `
                    :
                    `
                    <div class="next-race">
                        🏁 Événement terminé
                    </div>
                    `
                }

            </div>
        `;

    }).join("");
}


/* =========================================================
   CREATION DES DEPARTS
========================================================= */

function addDepartureForm() {

    departureFormCount++;

    const id = departureFormCount;

    const container = document.getElementById("departuresForm");

    const div = document.createElement("div");

    div.className = "departure-form";

    div.id = "departureForm_" + id;

    div.innerHTML = `

        <div class="departure-form-title">
            Départ ${id}
        </div>

        <div class="form-grid">

            <div>
                <label>Date</label>
                <input type="date" class="departure-date-input">
            </div>

            <div>
                <label>Heure</label>
                <input type="time" class="departure-time-input">
            </div>

        </div>

        ${
            id > 1
            ?
            `
            <button
                type="button"
                class="remove-departure"
                onclick="removeDeparture(${id})">
                ✕ Supprimer ce départ
            </button>
            `
            :
            ""
        }

    `;

    container.appendChild(div);
}


function removeDeparture(id) {

    const element = document.getElementById("departureForm_" + id);

    if (element) {
        element.remove();
    }
}


/* =========================================================
   CREER EVENEMENT
========================================================= */

function createEvent() {

    const name = document.getElementById("eventName").value.trim();

    if (!name) {
        alert("Merci de donner un nom à l'événement.");
        return;
    }

    const dateInputs =
        document.querySelectorAll(".departure-date-input");

    const timeInputs =
        document.querySelectorAll(".departure-time-input");

    const departures = [];

    for (let i = 0; i < dateInputs.length; i++) {

        if (!dateInputs[i].value || !timeInputs[i].value) {

            alert("Merci de compléter la date et l'heure de chaque départ.");

            return;
        }

        departures.push({
            id: generateId(),
            date: dateInputs[i].value,
            time: timeInputs[i].value,
            availability: []
        });
    }

    departures.sort(
        (a, b) => getDepartureDate(a) - getDepartureDate(b)
    );

    const event = {

        id: generateId(),

        name: name,

        departures: departures
    };

    events.push(event);

    saveEvents();

    showEvent(event.id);
}


/* =========================================================
   AFFICHAGE EVENEMENT
========================================================= */

function renderEvent(id) {

    const event = events.find(e => e.id === id);

    if (!event) {
        showHome();
        return;
    }

    const next = getNextDeparture(event);

    const container = document.getElementById("eventContent");

    let html = `

        <div class="panel">

            <h1>${escapeHTML(event.name)}</h1>

            ${
                next
                ?
                `
                <div class="next-race">
                    ⏳ Prochain départ
                    <br>
                    ${formatDate(next.date, next.time)}
                    <br>
                    <span class="countdown"
                          data-event-countdown="${event.id}">
                        ${countdownText(next)}
                    </span>
                </div>
                `
                :
                `
                <div class="next-race">
                    🏁 Tous les départs sont terminés
                </div>
                `
            }

            <div style="margin-top:20px;">
                <button
                    class="btn-primary"
                    onclick="showAvailabilityForm('${event.id}')">
                    + AJOUTER / MODIFIER MES DISPONIBILITÉS
                </button>
            </div>

        </div>

    `;


    html += event.departures.map((departure, index) => {

        const date = getDepartureDate(departure);

        const pilots = departure.availability || [];

        return `

            <div class="departure">

                <div class="departure-header">

                    <div>

                        <div class="departure-date">
                            Départ ${index + 1}
                        </div>

                        <div class="pilot-info">
                            ${formatDate(
                                departure.date,
                                departure.time
                            )}
                        </div>

                    </div>

                    <div class="countdown">
                        ${
                            date > new Date()
                            ? countdownText(departure)
                            : "🏁 Départ passé"
                        }
                    </div>

                </div>


                ${
                    pilots.length === 0
                    ?
                    `
                    <div class="empty">
                        Aucun pilote inscrit pour ce départ.
                    </div>
                    `
                    :
                    pilots.map(pilot => `

                        <div class="pilot">

                            <div class="pilot-name">
                                👤 ${escapeHTML(pilot.name)}
                            </div>

                            <div>

                                ${
                                    pilot.category
                                    ?
                                    `<span class="badge">
                                        ${escapeHTML(pilot.category)}
                                    </span>`
                                    :
                                    ""
                                }

                                <span class="badge">
                                    ${availabilityLabel(pilot.status)}
                                </span>

                            </div>

                        </div>

                    `).join("")
                }

            </div>

        `;

    }).join("");


    container.innerHTML = html;
}


/* =========================================================
   FORMULAIRE DISPONIBILITES
========================================================= */

function showAvailabilityForm(id) {

    currentEventId = id;

    const event = events.find(e => e.id === id);

    if (!event) return;

    hideAllPages();

    document
        .getElementById("availabilityPage")
        .classList.remove("hidden");


    /*
       Si un pilote existe déjà, on lui permet
       de retrouver ses choix.
    */

    document.getElementById("pilotName").value = "";


    const container =
        document.getElementById("availabilityForm");


    container.innerHTML = event.departures.map(
        (departure, index) => {

            return `

                <div class="departure-form">

                    <div class="departure-form-title">

                        Départ ${index + 1}

                        <div class="pilot-info">
                            ${formatDate(
                                departure.date,
                                departure.time
                            )}
                        </div>

                    </div>


                    <div class="form-grid">

                        <div>

                            <label>
                                Catégorie
                            </label>

                            <select
                                class="category-select"
                                data-departure="${departure.id}">

                                <option value="">
                                    -- Choisir --
                                </option>

                                <option value="Hypercar">
                                    Hypercar
                                </option>

                                <option value="LMP2">
                                    LMP2
                                </option>

                                <option value="LMP3">
                                    LMP3
                                </option>

                                <option value="GT3">
                                    GT3
                                </option>

                            </select>

                        </div>


                        <div>

                            <label>
                                Disponibilité
                            </label>

                            <select
                                class="status-select"
                                data-departure="${departure.id}">

                                <option value="unavailable">
                                    Indisponible
                                </option>

                                <option value="beginning">
                                    Début de course
                                </option>

                                <option value="middle">
                                    Milieu de course
                                </option>

                                <option value="end">
                                    Fin de course
                                </option>

                                <option value="whole">
                                    Toute la course
                                </option>

                            </select>

                        </div>

                    </div>

                </div>

            `;

        }
    ).join("");
}


/* =========================================================
   ENREGISTRER DISPONIBILITES
========================================================= */

function saveAvailability() {

    const event = events.find(e => e.id === currentEventId);

    if (!event) return;

    const name =
        document.getElementById("pilotName").value.trim();


    if (!name) {

        alert("Merci d'indiquer ton pseudo.");

        return;
    }


    const categories =
        document.querySelectorAll(".category-select");

    const statuses =
        document.querySelectorAll(".status-select");


    for (let i = 0; i < categories.length; i++) {

        const departureId =
            categories[i].dataset.departure;

        const category =
            categories[i].value;

        const status =
            statuses[i].value;


        const departure =
            event.departures.find(
                d => d.id === departureId
            );


        if (!departure) continue;


        if (!departure.availability) {
            departure.availability = [];
        }


        /*
           Si le pilote existe déjà,
           on modifie son choix.
        */

        const existing =
            departure.availability.find(
                p =>
                    p.name.toLowerCase() ===
                    name.toLowerCase()
            );


        if (existing) {

            existing.status = status;

            existing.category =
                status === "unavailable"
                ? ""
                : category;

        } else {

            departure.availability.push({

                name: name,

                category:
                    status === "unavailable"
                    ? ""
                    : category,

                status: status

            });

        }

    }


    saveEvents();

    alert("Tes disponibilités ont été enregistrées !");

    showEvent(currentEventId);
}


/* =========================================================
   TEXTE DISPONIBILITE
========================================================= */

function availabilityLabel(status) {

    switch (status) {

        case "beginning":
            return "Début";

        case "middle":
            return "Milieu";

        case "end":
            return "Fin";

        case "whole":
            return "Toute la course";

        case "unavailable":
        default:
            return "Indisponible";
    }
}


/* =========================================================
   COMPTE A REBOURS
========================================================= */

setInterval(() => {

    renderEvents();

    if (
        currentEventId &&
        !document
            .getElementById("eventPage")
            .classList.contains("hidden")
    ) {
        renderEvent(currentEventId);
    }

}, 1000);


/* =========================================================
   DEMO
   On crée un exemple uniquement si aucun événement
   n'existe encore.
========================================================= */

if (events.length === 0) {

    const demoEvent = {

        id: generateId(),

        name: "Spa-Francorchamps",

        departures: [

            {
                id: generateId(),
                date: "2026-09-04",
                time: "20:00",
                availability: []
            },

            {
                id: generateId(),
                date: "2026-09-05",
                time: "14:00",
                availability: []
            },

            {
                id: generateId(),
                date: "2026-09-05",
                time: "20:00",
                availability: []
            },

            {
                id: generateId(),
                date: "2026-09-06",
                time: "15:00",
                availability: []
            }

        ]

    };

    events.push(demoEvent);

    saveEvents();
}


/* =========================================================
   DEMARRAGE
========================================================= */

showHome();

</script>

</body>
</html>
