<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FMT Endurance</title>

  <style>
    :root {
      --bg: #090a0b;
      --panel: #111315;
      --panel2: #17191c;
      --panel3: #1d2023;
      --border: #292d31;
      --text: #f2f2f2;
      --muted: #92979c;

      --blue: #2589d8;
      --green: #31b86b;
      --yellow: #e4c341;
      --red: #e34c4c;

      --accent: #7ee38f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top right, rgba(49,184,107,.07), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    /* =========================
       TOP STRIPES
    ========================= */

    .top-stripes {
      display: flex;
      height: 5px;
      width: 100%;
    }

    .top-stripes span {
      flex: 1;
    }

    .stripe-blue { background: var(--blue); }
    .stripe-green { background: var(--green); }
    .stripe-yellow { background: var(--yellow); }
    .stripe-red { background: var(--red); }

    /* =========================
       HEADER
    ========================= */

    header {
      border-bottom: 1px solid var(--border);
      background: rgba(9,10,11,.95);
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(8px);
    }

    .header-inner {
      max-width: 1050px;
      margin: auto;
      padding: 17px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 21px;
      font-weight: 950;
      letter-spacing: 2px;
      line-height: 1;
    }

    .logo span {
      color: var(--green);
    }

    .subtitle {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 2px;
      margin-top: 5px;
      font-weight: 700;
    }

    button {
      border: 0;
      cursor: pointer;
      font-family: inherit;
    }

    .header-button {
      background: var(--green);
      color: #07100a;
      padding: 10px 15px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .5px;
      border-radius: 4px;
    }

    .header-button:hover {
      filter: brightness(1.1);
    }

    /* =========================
       MAIN
    ========================= */

    main {
      max-width: 1050px;
      margin: auto;
      padding: 28px 20px 60px;
    }

    .page-title {
      margin-bottom: 22px;
    }

    .page-title h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -1px;
    }

    .page-title p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    /* =========================
       EVENT LIST
    ========================= */

    .events {
      display: grid;
      gap: 12px;
    }

    .event-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-left: 4px solid var(--green);
      border-radius: 6px;
      padding: 17px 18px;
      cursor: pointer;
      transition: .15s;
      position: relative;
      overflow: hidden;
    }

    .event-card:hover {
      background: var(--panel2);
      transform: translateX(2px);
    }

    .event-card::after {
      content: "";
      position: absolute;
      right: -30px;
      top: -30px;
      width: 100px;
      height: 100px;
      border: 1px solid rgba(255,255,255,.04);
      transform: rotate(45deg);
    }

    .event-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
    }

    .event-name {
      font-size: 18px;
      font-weight: 900;
    }

    .event-location {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .event-date {
      text-align: right;
      font-size: 11px;
      color: var(--muted);
    }

    .event-date strong {
      display: block;
      color: var(--text);
      font-size: 13px;
    }

    .event-countdown {
      margin-top: 14px;
      padding-top: 11px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--green);
      font-weight: 800;
    }

    /* =========================
       EVENT PAGE
    ========================= */

    .back-button {
      background: transparent;
      color: var(--muted);
      padding: 0;
      margin-bottom: 20px;
      font-size: 12px;
      font-weight: 700;
    }

    .back-button:hover {
      color: var(--text);
    }

    .event-header {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 20px;
      margin-bottom: 18px;
      position: relative;
      overflow: hidden;
    }

    .event-header::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: linear-gradient(
        to bottom,
        var(--blue) 0 25%,
        var(--green) 25% 50%,
        var(--yellow) 50% 75%,
        var(--red) 75% 100%
      );
    }

    .event-header h1 {
      margin: 0 0 6px;
      font-size: 27px;
    }

    .event-header p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    /* =========================
       DEPARTURES
    ========================= */

    .departures {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .departure {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 7px;
      overflow: hidden;
    }

    .departure-header {
      padding: 14px 16px;
      background: var(--panel2);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .departure-date {
      font-weight: 900;
      font-size: 13px;
      text-transform: uppercase;
    }

    .departure-time {
      color: var(--green);
      margin-left: 7px;
    }

    .departure-countdown {
      font-size: 11px;
      color: var(--muted);
      text-align: right;
      white-space: nowrap;
    }

    .departure-countdown.upcoming {
      color: var(--green);
      font-weight: 800;
    }

    .departure-countdown.finished {
      color: var(--muted);
    }

    /* =========================
       PILOT LIST
    ========================= */

    .pilot-section {
      padding: 12px 14px 4px;
    }

    .section-label {
      color: var(--muted);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .pilot-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .pilot-row {
      display: grid;
      grid-template-columns: minmax(120px, 1fr) auto 78px 30px;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 5px 7px;
      background: var(--panel2);
      border: 1px solid rgba(255,255,255,.035);
      border-radius: 4px;
    }

    .pilot-left {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .pilot-name {
      font-size: 12px;
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* =========================
       CATEGORY
    ========================= */

    .category-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 48px;
      padding: 3px 6px;
      border-radius: 3px;
      color: #101010;
      font-size: 8px;
      font-weight: 950;
      letter-spacing: .3px;
    }

    .cat-Hypercar {
      background: var(--blue);
    }

    .cat-LMP2 {
      background: var(--green);
    }

    .cat-LMP3 {
      background: var(--yellow);
    }

    .cat-GT3 {
      background: var(--red);
      color: white;
    }

    /* =========================
       AVAILABILITY BAR
    ========================= */

    .availability-bar {
      width: 76px;
      height: 9px;
      display: flex;
      gap: 2px;
      border-radius: 2px;
      overflow: hidden;
    }

    .availability-segment {
      flex: 1;
      background: #292d31;
    }

    .availability-segment.beginning.active {
      background: var(--green);
    }

    .availability-segment.middle.active {
      background: var(--yellow);
    }

    .availability-segment.end.active {
      background: var(--red);
    }

    .edit-button {
      width: 28px;
      height: 25px;
      border-radius: 3px;
      background: #25282b;
      color: var(--muted);
      font-size: 11px;
    }

    .edit-button:hover {
      background: #303438;
      color: white;
    }

    .empty {
      padding: 9px 5px 11px;
      color: #676d72;
      font-size: 11px;
      font-style: italic;
    }

    /* =========================
       FORM
    ========================= */

    .form-section {
      border-top: 1px solid var(--border);
      margin-top: 9px;
      padding: 13px 14px 15px;
    }

    .form-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 11px;
    }

    .form-title strong {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .editing-label {
      display: none;
      color: var(--green);
      font-size: 9px;
      font-weight: 900;
    }

    .form-section.editing .editing-label {
      display: block;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1.4fr 1.2fr auto;
      gap: 8px;
      align-items: end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field label {
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .6px;
    }

    input {
      width: 100%;
      height: 34px;
      padding: 0 10px;
      background: #0d0f10;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: white;
      outline: none;
      font-family: inherit;
      font-size: 12px;
    }

    input:focus {
      border-color: var(--green);
    }

    /* =========================
       AVAILABILITY BUTTONS
    ========================= */

    .availability-buttons {
      display: flex;
      gap: 3px;
      height: 34px;
    }

    .availability-button {
      flex: 1;
      border: 1px solid var(--border);
      background: #0d0f10;
      color: #777d82;
      border-radius: 3px;
      font-size: 9px;
      font-weight: 900;
      transition: .12s;
    }

    .availability-button:hover {
      background: #202428;
      color: white;
    }

    .availability-button.active.beginning {
      background: var(--green);
      border-color: var(--green);
      color: #07100a;
    }

    .availability-button.active.middle {
      background: var(--yellow);
      border-color: var(--yellow);
      color: #171200;
    }

    .availability-button.active.end {
      background: var(--red);
      border-color: var(--red);
      color: white;
    }

    .availability-button.active.whole {
      background: linear-gradient(
        90deg,
        var(--green) 0 33%,
        var(--yellow) 33% 66%,
        var(--red) 66% 100%
      );
      color: #111;
      border-color: transparent;
    }

    .availability-button.active.unavailable {
      background: #303337;
      border-color: #45494d;
      color: white;
    }

    /* =========================
       CATEGORY BUTTONS
    ========================= */

    .category-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 3px;
      height: 34px;
    }

    .category-button {
      background: #0d0f10;
      border: 1px solid var(--border);
      border-radius: 3px;
      color: #777d82;
      font-size: 8px;
      font-weight: 950;
    }

    .category-button:hover {
      color: white;
    }

    .category-button.active.hyper {
      background: var(--blue);
      border-color: var(--blue);
      color: #071017;
    }

    .category-button.active.lmp2 {
      background: var(--green);
      border-color: var(--green);
      color: #07100a;
    }

    .category-button.active.lmp3 {
      background: var(--yellow);
      border-color: var(--yellow);
      color: #151200;
    }

    .category-button.active.gt3 {
      background: var(--red);
      border-color: var(--red);
      color: white;
    }

    .save-button {
      height: 34px;
      padding: 0 14px;
      background: var(--green);
      color: #07100a;
      border-radius: 3px;
      font-size: 9px;
      font-weight: 950;
      white-space: nowrap;
    }

    .save-button:hover {
      filter: brightness(1.1);
    }

    /* =========================
       LEGEND
    ========================= */

    .legend {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      padding: 0 14px 12px;
      color: var(--muted);
      font-size: 9px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .legend-color {
      width: 12px;
      height: 6px;
      border-radius: 1px;
    }

    .legend-green { background: var(--green); }
    .legend-yellow { background: var(--yellow); }
    .legend-red { background: var(--red); }

    .legend-whole {
      width: 18px;
      height: 6px;
      background: linear-gradient(
        90deg,
        var(--green) 0 33%,
        var(--yellow) 33% 66%,
        var(--red) 66% 100%
      );
    }

    /* =========================
       CREATE EVENT
    ========================= */

    .create-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 22px;
      max-width: 700px;
      margin: auto;
    }

    .create-panel h2 {
      margin: 0 0 18px;
      font-size: 20px;
    }

    .create-grid {
      display: grid;
      gap: 12px;
    }

    .create-departure {
      display: grid;
      grid-template-columns: 1fr 150px auto;
      gap: 7px;
      align-items: end;
      padding: 10px;
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 5px;
    }

    .small-button {
      height: 34px;
      padding: 0 10px;
      border-radius: 3px;
      background: #292d31;
      color: white;
      font-size: 10px;
      font-weight: 800;
    }

    .small-button:hover {
      background: #353a3e;
    }

    .create-submit {
      width: 100%;
      height: 40px;
      margin-top: 10px;
      background: var(--green);
      color: #07100a;
      font-weight: 950;
      border-radius: 4px;
    }

    /* =========================
       NO EVENTS
    ========================= */

    .no-events {
      background: var(--panel);
      border: 1px dashed var(--border);
      padding: 35px;
      text-align: center;
      border-radius: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 760px) {

      .header-inner {
        padding: 14px;
      }

      main {
        padding: 20px 12px 40px;
      }

      .page-title h1 {
        font-size: 24px;
      }

      .departure-header {
        align-items: flex-start;
      }

      .departure-countdown {
        font-size: 9px;
      }

      .pilot-row {
        grid-template-columns: minmax(90px, 1fr) 48px 65px 28px;
        gap: 5px;
      }

      .availability-bar {
        width: 63px;
      }

      .category-badge {
        min-width: 43px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .availability-buttons,
      .category-buttons {
        height: 38px;
      }

      .save-button {
        width: 100%;
      }

      .create-departure {
        grid-template-columns: 1fr;
      }

      .legend {
        justify-content: flex-start;
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>

  <div class="top-stripes">
    <span class="stripe-blue"></span>
    <span class="stripe-green"></span>
    <span class="stripe-yellow"></span>
    <span class="stripe-red"></span>
  </div>

  <header>
    <div class="header-inner">
      <div>
        <div class="logo">FMT <span>ENDURANCE</span></div>
        <div class="subtitle">FRENCH MCFLY TEAM</div>
      </div>

      <button
        class="header-button"
        onclick="showCreateEvent()"
      >
        + NOUVEL ÉVÉNEMENT
      </button>
    </div>
  </header>

  <main id="app"></main>

  <script>

    /* =========================================================
       DATA
    ========================================================= */

    let events = JSON.parse(
      localStorage.getItem("fmt_endurance_events") || "[]"
    );

    let currentEventId = null;

    let editingPilot = null;


    /* =========================================================
       SAVE DATA
    ========================================================= */

    function saveEvents() {
      localStorage.setItem(
        "fmt_endurance_events",
        JSON.stringify(events)
      );
    }


    /* =========================================================
       HELPERS
    ========================================================= */

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function escapeJs(value) {
      return String(value)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");
    }


    function generateId() {
      return Math.random()
        .toString(36)
        .substring(2, 9);
    }


    function getCategoryClass(category) {

      if (category === "Hypercar") return "cat-Hypercar";
      if (category === "LMP2") return "cat-LMP2";
      if (category === "LMP3") return "cat-LMP3";
      if (category === "GT3") return "cat-GT3";

      return "";
    }


    function getCategoryButtonClass(category) {

      if (category === "Hypercar") return "hyper";
      if (category === "LMP2") return "lmp2";
      if (category === "LMP3") return "lmp3";
      if (category === "GT3") return "gt3";

      return "";
    }


    function formatDate(date, time) {

      const d = new Date(`${date}T${time}`);

      return d.toLocaleDateString(
        "fr-FR",
        {
          weekday: "short",
          day: "2-digit",
          month: "short"
        }
      );
    }


    function formatLongDate(date) {

      const d = new Date(`${date}T00:00`);

      return d.toLocaleDateString(
        "fr-FR",
        {
          weekday: "long",
          day: "2-digit",
          month: "long",
          year: "numeric"
        }
      );
    }


    function getDepartureTimestamp(departure) {

      return new Date(
        `${departure.date}T${departure.time}`
      ).getTime();

    }


    /* =========================================================
       COUNTDOWN
    ========================================================= */

    function formatCountdown(target) {

      const now = Date.now();

      let diff = target - now;

      if (diff <= 0) {
        return null;
      }

      const totalSeconds = Math.floor(diff / 1000);

      const days = Math.floor(totalSeconds / 86400);

      const hours = Math.floor(
        (totalSeconds % 86400) / 3600
      );

      const minutes = Math.floor(
        (totalSeconds % 3600) / 60
      );

      const seconds = totalSeconds % 60;

      if (days > 0) {
        return `${days}j ${hours}h ${minutes}m`;
      }

      if (hours > 0) {
        return `${hours}h ${minutes}m ${seconds}s`;
      }

      return `${minutes}m ${seconds}s`;
    }


    function updateCountdowns() {

      document
        .querySelectorAll("[data-countdown]")
        .forEach(element => {

          const target = Number(
            element.dataset.countdown
          );

          const countdown = formatCountdown(target);

          if (!countdown) {

            element.textContent = "🏁 Départ passé";
            element.classList.remove("upcoming");
            element.classList.add("finished");

          } else {

            element.textContent = `⏱ ${countdown}`;
            element.classList.add("upcoming");
            element.classList.remove("finished");
          }
        });


      document
        .querySelectorAll("[data-event-countdown]")
        .forEach(element => {

          const target = Number(
            element.dataset.eventCountdown
          );

          const countdown = formatCountdown(target);

          if (!countdown) {
            element.textContent = "🏁 Événement terminé";
          } else {
            element.textContent =
              `⏱ Prochain départ dans ${countdown}`;
          }
        });
    }


    /* =========================================================
       HOME
    ========================================================= */

    function renderHome() {

      currentEventId = null;
      editingPilot = null;

      let html = `
        <div class="page-title">
          <h1>ÉVÉNEMENTS</h1>
          <p>Gestion des courses d'endurance FMT</p>
        </div>
      `;


      if (events.length === 0) {

        html += `
          <div class="no-events">
            Aucun événement créé.<br><br>
            Clique sur <strong>+ NOUVEL ÉVÉNEMENT</strong> pour commencer.
          </div>
        `;

      } else {

        html += `<div class="events">`;

        events.forEach(event => {

          const upcoming = event.departures
            .map(d => ({
              departure: d,
              timestamp: getDepartureTimestamp(d)
            }))
            .filter(x => x.timestamp > Date.now())
            .sort((a,b) => a.timestamp - b.timestamp)[0];


          html += `
            <div
              class="event-card"
              onclick="openEvent('${event.id}')"
            >

              <div class="event-top">

                <div>
                  <div class="event-name">
                    ${escapeHtml(event.name)}
                  </div>

                  ${
                    event.location
                    ? `
                      <div class="event-location">
                        📍 ${escapeHtml(event.location)}
                      </div>
                    `
                    : ""
                  }
                </div>

                ${
                  upcoming
                  ? `
                    <div class="event-date">
                      <strong>
                        ${formatDate(
                          upcoming.departure.date,
                          upcoming.departure.time
                        )}
                      </strong>
                      ${upcoming.departure.time}
                    </div>
                  `
                  : ""
                }

              </div>

              <div
                class="event-countdown"
                data-event-countdown="${
                  upcoming
                    ? upcoming.timestamp
                    : 0
                }"
              >
                ${
                  upcoming
                  ? `⏱ Prochain départ dans ${formatCountdown(upcoming.timestamp)}`
                  : "🏁 Événement terminé"
                }
              </div>

            </div>
          `;
        });

        html += `</div>`;
      }

      document.getElementById("app").innerHTML = html;
    }


    /* =========================================================
       OPEN EVENT
    ========================================================= */

    function openEvent(id) {

      currentEventId = id;
      editingPilot = null;

      renderEvent();
    }


    /* =========================================================
       RENDER EVENT
    ========================================================= */

    function renderEvent() {

      const event = events.find(
        e => e.id === currentEventId
      );

      if (!event) {
        renderHome();
        return;
      }


      let html = `

        <button
          class="back-button"
          onclick="renderHome()"
        >
          ← RETOUR AUX ÉVÉNEMENTS
        </button>

        <div class="event-header">

          <h1>
            ${escapeHtml(event.name)}
          </h1>

          ${
            event.location
            ? `
              <p>
                📍 ${escapeHtml(event.location)}
              </p>
            `
            : ""
          }

        </div>

        <div class="departures">
      `;


      event.departures.forEach(
        (departure, departureIndex) => {

          html += renderDeparture(
            event,
            departure,
            departureIndex
          );

        }
      );


      html += `
        </div>
      `;


      document.getElementById("app").innerHTML = html;

      updateCountdowns();
    }


    /* =========================================================
       DEPARTURE
    ========================================================= */

    function renderDeparture(
      event,
      departure,
      departureIndex
    ) {

      const timestamp =
        getDepartureTimestamp(departure);


      const availablePilots =
        departure.availability.filter(
          pilot => pilot.status !== "unavailable"
        );


      let html = `

        <div class="departure">

          <div class="departure-header">

            <div class="departure-date">

              ${escapeHtml(
                formatLongDate(
                  departure.date
                )
              )}

              <span class="departure-time">
                ${escapeHtml(
                  departure.time
                )}
              </span>

            </div>

            <div
              class="departure-countdown"
              data-countdown="${timestamp}"
            >
              ${
                formatCountdown(timestamp)
                ? `⏱ ${formatCountdown(timestamp)}`
                : "🏁 Départ passé"
              }
            </div>

          </div>


          <div class="pilot-section">

            <div class="section-label">
              PILOTES DISPONIBLES
            </div>

      `;


      if (availablePilots.length === 0) {

        html += `
          <div class="empty">
            Aucun pilote disponible pour ce départ.
          </div>
        `;

      } else {

        html += `<div class="pilot-list">`;

        availablePilots.forEach(pilot => {

          html += renderPilotRow(
            pilot
          );

        });

        html += `</div>`;
      }


      html += `
          </div>

          ${renderForm(
            event,
            departure,
            departureIndex
          )}

          <div class="legend">

            <div class="legend-item">
              <span class="legend-color legend-green"></span>
              Début
            </div>

            <div class="legend-item">
              <span class="legend-color legend-yellow"></span>
              Milieu
            </div>

            <div class="legend-item">
              <span class="legend-color legend-red"></span>
              Fin
            </div>

            <div class="legend-item">
              <span class="legend-whole"></span>
              Toute la course
            </div>

          </div>

        </div>
      `;


      return html;
    }


    /* =========================================================
       PILOT ROW
    ========================================================= */

    function renderPilotRow(pilot) {

      const status = pilot.status || "";

      const beginning =
        status.includes("beginning") ||
        status === "whole";

      const middle =
        status.includes("middle") ||
        status === "whole";

      const end =
        status.includes("end") ||
        status === "whole";


      return `

        <div class="pilot-row">

          <div class="pilot-left">

            <div class="pilot-name">
              ${escapeHtml(pilot.name)}
            </div>

          </div>


          <span class="category-badge ${
            getCategoryClass(pilot.category)
          }">

            ${escapeHtml(
              pilot.category === "Hypercar"
                ? "HYPER"
                : pilot.category || "—"
            )}

          </span>


          <div
            class="availability-bar"
            title="${getStatusLabel(status)}"
          >

            <span
              class="availability-segment beginning ${
                beginning ? "active" : ""
              }"
            ></span>

            <span
              class="availability-segment middle ${
                middle ? "active" : ""
              }"
            ></span>

            <span
              class="availability-segment end ${
                end ? "active" : ""
              }"
            ></span>

          </div>


          <button
            class="edit-button"
            onclick="editPilot('${escapeJs(pilot.name)}')"
            title="Modifier"
          >
            ✎
          </button>

        </div>

      `;
    }


    /* =========================================================
       STATUS
    ========================================================= */

    function getStatusLabel(status) {

      if (status === "whole") {
        return "Toute la course";
      }

      const parts = [];

      if (status.includes("beginning")) {
        parts.push("Début");
      }

      if (status.includes("middle")) {
        parts.push("Milieu");
      }

      if (status.includes("end")) {
        parts.push("Fin");
      }

      return parts.join(" + ");
    }


    /* =========================================================
       FORM
    ========================================================= */

    function renderForm(
      event,
      departure,
      departureIndex
    ) {

      const existing =
        editingPilot
        ? departure.availability.find(
            p =>
              p.name.toLowerCase() ===
              editingPilot.toLowerCase()
          )
        : null;


      const nameValue =
        existing
        ? existing.name
        : "";


      const status =
        existing
        ? existing.status
        : "";


      const category =
        existing
        ? existing.category
        : "";


      const isWhole =
        status === "whole";


      const isUnavailable =
        status === "unavailable";


      const beginning =
        status.includes("beginning");


      const middle =
        status.includes("middle");


      const end =
        status.includes("end");


      return `

        <div class="form-section ${
          existing ? "editing" : ""
        }">

          <div class="form-title">

            <strong>
              ${existing
                ? "✎ Modifier ma disponibilité"
                : "+ Enregistrer ma disponibilité"
              }
            </strong>

            <span class="editing-label">
              MODIFICATION
            </span>

          </div>


          <div class="form-grid">

            <div class="field">

              <label>Nom / Pseudo</label>

              <input
                id="name-${departure.id}"
                type="text"
                value="${escapeHtml(nameValue)}"
                placeholder="Ex : McFly"
              >

            </div>


            <div class="field">

              <label>Disponibilité</label>

              <div
                class="availability-buttons"
                id="availability-${departure.id}"
              >

                <button
                  type="button"
                  class="availability-button beginning ${
                    beginning ? "active" : ""
                  }"
                  onclick="toggleAvailability(
                    '${departure.id}',
                    'beginning'
                  )"
                >
                  DÉBUT
                </button>

                <button
                  type="button"
                  class="availability-button middle ${
                    middle ? "active" : ""
                  }"
                  onclick="toggleAvailability(
                    '${departure.id}',
                    'middle'
                  )"
                >
                  MILIEU
                </button>

                <button
                  type="button"
                  class="availability-button end ${
                    end ? "active" : ""
                  }"
                  onclick="toggleAvailability(
                    '${departure.id}',
                    'end'
                  )"
                >
                  FIN
                </button>

                <button
                  type="button"
                  class="availability-button whole ${
                    isWhole ? "active" : ""
                  }"
                  onclick="setAvailability(
                    '${departure.id}',
                    'whole'
                  )"
                >
                  TOUT
                </button>

                <button
                  type="button"
                  class="availability-button unavailable ${
                    isUnavailable ? "active" : ""
                  }"
                  onclick="setAvailability(
                    '${departure.id}',
                    'unavailable'
                  )"
                >
                  ABSENT
                </button>

              </div>

            </div>


            <div class="field">

              <label>Catégorie</label>

              <div
                class="category-buttons"
                id="category-${departure.id}"
              >

                ${renderCategoryButton(
                  departure.id,
                  "Hypercar",
                  category
                )}

                ${renderCategoryButton(
                  departure.id,
                  "LMP2",
                  category
                )}

                ${renderCategoryButton(
                  departure.id,
                  "LMP3",
                  category
                )}

                ${renderCategoryButton(
                  departure.id,
                  "GT3",
                  category
                )}

              </div>

            </div>


            <button
              class="save-button"
              onclick="saveAvailability(
                '${departure.id}'
              )"
            >
              ${
                existing
                ? "MODIFIER"
                : "ENREGISTRER"
              }
            </button>

          </div>

        </div>

      `;
    }


    function renderCategoryButton(
      departureId,
      category,
      selected
    ) {

      return `

        <button
          type="button"
          class="category-button ${
            getCategoryButtonClass(category)
          } ${
            selected === category
              ? "active"
              : ""
          }"
          onclick="setCategory(
            '${departureId}',
            '${category}'
          )"
        >
          ${
            category === "Hypercar"
              ? "HYPER"
              : category
          }
        </button>

      `;
    }


    /* =========================================================
       FORM STATE
    ========================================================= */

    const formState = {};


    function ensureFormState(departureId) {

      if (!formState[departureId]) {

        formState[departureId] = {
          status: "",
          category: ""
        };

      }

      return formState[departureId];
    }


    function toggleAvailability(
      departureId,
      type
    ) {

      const state =
        ensureFormState(departureId);


      if (
        state.status === "whole" ||
        state.status === "unavailable"
      ) {
        state.status = "";
      }


      let parts =
        state.status
          ? state.status.split(",")
          : [];


      if (parts.includes(type)) {

        parts =
          parts.filter(
            p => p !== type
          );

      } else {

        parts.push(type);

      }


      const order = [
        "beginning",
        "middle",
        "end"
      ];


      parts.sort(
        (a,b) =>
          order.indexOf(a) -
          order.indexOf(b)
      );


      if (parts.length === 3) {

        state.status = "whole";

      } else {

        state.status =
          parts.join(",");

      }


      refreshDepartureForm(
        departureId
      );
    }


    function setAvailability(
      departureId,
      status
    ) {

      const state =
        ensureFormState(departureId);

      state.status = status;

      refreshDepartureForm(
        departureId
      );
    }


    function setCategory(
      departureId,
      category
    ) {

      const state =
        ensureFormState(departureId);

      state.category = category;

      refreshDepartureForm(
        departureId
      );
    }


    /* =========================================================
       REFRESH FORM ONLY
    ========================================================= */

    function refreshDepartureForm(
      departureId
    ) {

      const event =
        events.find(
          e => e.id === currentEventId
        );

      if (!event) return;


      const departureIndex =
        event.departures.findIndex(
          d => d.id === departureId
        );

      if (departureIndex === -1) {
        return;
      }


      const departure =
        event.departures[
          departureIndex
        ];


      const form =
        document.querySelector(
          `.form-section:has(#name-${departureId})`
        );


      if (!form) {

        renderEvent();
        return;
      }


      const oldName =
        document.getElementById(
          `name-${departureId}`
        )?.value || "";


      const tempState =
        ensureFormState(departureId);


      const existing =
        editingPilot
        ? departure.availability.find(
            p =>
              p.name.toLowerCase() ===
              editingPilot.toLowerCase()
          )
        : null;


      const state = {
        status:
          tempState.status ||
          existing?.status ||
          "",

        category:
          tempState.category ||
          existing?.category ||
          ""
      };


      form.outerHTML =
        renderForm(
          event,
          departure,
          departureIndex
        );


      const newInput =
        document.getElementById(
          `name-${departureId}`
        );

      if (newInput) {
        newInput.value =
          existing
          ? existing.name
          : oldName;
      }
    }


    /* =========================================================
       SAVE AVAILABILITY
    ========================================================= */

    function saveAvailability(
      departureId
    ) {

      const event =
        events.find(
          e => e.id === currentEventId
        );

      if (!event) return;


      const departure =
        event.departures.find(
          d => d.id === departureId
        );

      if (!departure) return;


      const input =
        document.getElementById(
          `name-${departureId}`
        );


      const name =
        input
          ? input.value.trim()
          : "";


      const state =
        ensureFormState(
          departureId
        );


      let status =
        state.status || "";


      let category =
        state.category || "";


      /* If editing, load existing values
         when state hasn't been changed */

      if (
        editingPilot &&
        !status
      ) {

        const existing =
          departure.availability.find(
            p =>
              p.name.toLowerCase() ===
              editingPilot.toLowerCase()
          );

        if (existing) {
          status = existing.status;
        }
      }


      if (
        editingPilot &&
        !category
      ) {

        const existing =
          departure.availability.find(
            p =>
              p.name.toLowerCase() ===
              editingPilot.toLowerCase()
          );

        if (existing) {
          category = existing.category;
        }
      }


      if (!name) {

        alert(
          "Entre ton nom ou ton pseudo."
        );

        return;
      }


      if (!status) {

        alert(
          "Choisis ta disponibilité."
        );

        return;
      }


      if (
        status !== "unavailable" &&
        !category
      ) {

        alert(
          "Choisis ta catégorie."
        );

        return;
      }


      /* =========================
         FIND EXISTING PILOT
      ========================= */

      const existingIndex =
        departure.availability.findIndex(
          p =>
            p.name.toLowerCase() ===
            name.toLowerCase()
        );


      /* =========================
         EDIT EXISTING PILOT
      ========================= */

      if (
        editingPilot &&
        existingIndex !== -1
      ) {

        departure.availability[
          existingIndex
        ] = {
          ...departure.availability[
            existingIndex
          ],
          name,
          category,
          status
        };

      }

      /* =========================
         UPDATE SAME NAME
      ========================= */

      else if (
        existingIndex !== -1
      ) {

        departure.availability[
          existingIndex
        ] = {
          ...departure.availability[
            existingIndex
          ],
          name,
          category,
          status
        };

      }

      /* =========================
         NEW PILOT
      ========================= */

      else {

        departure.availability.push({

          id: generateId(),

          name,

          category,

          status

        });

      }


      saveEvents();


      editingPilot = null;

      delete formState[
        departureId
      ];


      renderEvent();
    }


    /* =========================================================
       EDIT PILOT
    ========================================================= */

    function editPilot(name) {

      editingPilot = name;

      const event =
        events.find(
          e => e.id === currentEventId
        );

      if (!event) return;


      /*
       * Find the departure containing
       * the pilot and initialize its form.
       */

      event.departures.forEach(
        departure => {

          const pilot =
            departure.availability.find(
              p =>
                p.name.toLowerCase() ===
                name.toLowerCase()
            );

          if (pilot) {

            formState[
              departure.id
            ] = {

              status: pilot.status,

              category: pilot.category

            };

          }
        }
      );


      renderEvent();


      /*
       * Scroll to the first form
       */

      setTimeout(() => {

        const form =
          document.querySelector(
            ".form-section.editing"
          );

        if (form) {

          form.scrollIntoView({
            behavior: "smooth",
            block: "center"
          });

        }

      }, 50);
    }


    /* =========================================================
       CREATE EVENT
    ========================================================= */

    function showCreateEvent() {

      currentEventId = null;
      editingPilot = null;


      document.getElementById(
        "app"
      ).innerHTML = `

        <button
          class="back-button"
          onclick="renderHome()"
        >
          ← RETOUR
        </button>

        <div class="create-panel">

          <h2>
            NOUVEL ÉVÉNEMENT
          </h2>

          <div class="create-grid">

            <div class="field">

              <label>Nom de l'événement</label>

              <input
                id="event-name"
                type="text"
                placeholder="Ex : Spa 6H"
              >

            </div>


            <div class="field">

              <label>Circuit / lieu</label>

              <input
                id="event-location"
                type="text"
                placeholder="Ex : Spa-Francorchamps"
              >

            </div>


            <div class="field">

              <label>Départs</label>

              <div id="departure-fields"></div>

            </div>


            <button
              class="small-button"
              onclick="addDepartureField()"
            >
              + AJOUTER UN DÉPART
            </button>


            <button
              class="create-submit"
              onclick="createEvent()"
            >
              CRÉER L'ÉVÉNEMENT
            </button>

          </div>

        </div>
      `;


      addDepartureField();
    }


    let departureFieldCount = 0;


    function addDepartureField(
      date = "",
      time = ""
    ) {

      const container =
        document.getElementById(
          "departure-fields"
        );

      if (!container) return;


      const id =
        `new-departure-${departureFieldCount++}`;


      const div =
        document.createElement("div");

      div.className =
        "create-departure";


      div.innerHTML = `

        <div class="field">

          <label>Date</label>

          <input
            type="date"
            class="new-departure-date"
            value="${date}"
          >

        </div>


        <div class="field">

          <label>Heure</label>

          <input
            type="time"
            class="new-departure-time"
            value="${time}"
          >

        </div>


        <button
          class="small-button"
          type="button"
          onclick="this.parentElement.remove()"
        >
          ✕
        </button>

      `;


      container.appendChild(div);
    }


    /* =========================================================
       CREATE EVENT
    ========================================================= */

    function createEvent() {

      const name =
        document.getElementById(
          "event-name"
        ).value.trim();


      const location =
        document.getElementById(
          "event-location"
        ).value.trim();


      if (!name) {

        alert(
          "Entre un nom pour l'événement."
        );

        return;
      }


      const rows =
        document.querySelectorAll(
          ".create-departure"
        );


      const departures = [];


      rows.forEach(row => {

        const date =
          row.querySelector(
            ".new-departure-date"
          ).value;


        const time =
          row.querySelector(
            ".new-departure-time"
          ).value;


        if (date && time) {

          departures.push({

            id: generateId(),

            date,

            time,

            availability: []

          });

        }

      });


      if (departures.length === 0) {

        alert(
          "Ajoute au moins un départ."
        );

        return;
      }


      departures.sort(
        (a,b) =>
          getDepartureTimestamp(a) -
          getDepartureTimestamp(b)
      );


      const event = {

        id: generateId(),

        name,

        location,

        departures

      };


      events.push(event);

      saveEvents();


      openEvent(event.id);
    }


    /* =========================================================
       INITIAL LOAD
    ========================================================= */

    if (events.length === 0) {

      /*
       * Demo event shown on first launch.
       * It can be deleted manually from localStorage
       * if you don't want it.
       */

      events.push({

        id: generateId(),

        name: "Spa 6H",

        location: "Spa-Francorchamps",

        departures: [

          {
            id: generateId(),
            date: "2026-09-04",
            time: "20:00",
            availability: []
          },

          {
            id: generateId(),
            date: "2026-09-05",
            time: "14:00",
            availability: []
          },

          {
            id: generateId(),
            date: "2026-09-05",
            time: "20:00",
            availability: []
          },

          {
            id: generateId(),
            date: "2026-09-06",
            time: "15:00",
            availability: []
          }

        ]

      });

      saveEvents();
    }


    renderHome();


    /* =========================================================
       COUNTDOWN LOOP
       IMPORTANT:
       We update only countdown text.
       We DO NOT rerender the page every second.
       ========================================================= */

    setInterval(
      updateCountdowns,
      1000
    );

  </script>

</body>
</html>
