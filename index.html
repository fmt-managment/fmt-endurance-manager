<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FMT ENDURANCE</title>

<style>
:root {
  --bg: #090a0b;
  --panel: #111315;
  --panel2: #17191c;
  --panel3: #1d2023;
  --border: #292d31;

  --text: #f2f2f2;
  --muted: #92979c;

  --blue: #2589d8;
  --green: #31b86b;
  --yellow: #e4c341;
  --red: #e34c4c;

  --accent: #7ee38f;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

button,
input,
select {
  font-family: inherit;
}

button {
  cursor: pointer;
}

.top-stripes {
  height: 5px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
}

.top-stripes div:nth-child(1) {
  background: var(--blue);
}

.top-stripes div:nth-child(2) {
  background: var(--green);
}

.top-stripes div:nth-child(3) {
  background: var(--yellow);
}

.top-stripes div:nth-child(4) {
  background: var(--red);
}

header {
  background: #0d0f10;
  border-bottom: 1px solid var(--border);
  padding: 18px 20px;
}

.header-inner {
  max-width: 1100px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}

.logo {
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 2px;
}

.logo span {
  color: var(--green);
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 25px 18px 50px;
}

h1,
h2,
h3 {
  margin-top: 0;
}

.page-title {
  font-size: 28px;
  font-weight: 900;
  margin-bottom: 5px;
}

.page-subtitle {
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 25px;
}

.primary-button {
  border: 0;
  background: var(--green);
  color: #07100a;
  font-weight: 900;
  padding: 11px 16px;
  border-radius: 4px;
}

.primary-button:hover {
  filter: brightness(1.08);
}

.secondary-button {
  border: 1px solid var(--border);
  background: var(--panel2);
  color: var(--text);
  font-weight: 800;
  padding: 10px 15px;
  border-radius: 4px;
}

.secondary-button:hover {
  background: var(--panel3);
}

.back-button {
  margin-bottom: 20px;
}

.event-list {
  display: grid;
  gap: 12px;
}

.event-card {
  position: relative;
  overflow: hidden;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 17px 18px 17px 23px;
  cursor: pointer;
  transition: .15s;
}

.event-card:hover {
  background: var(--panel2);
  border-color: #3a4045;
  transform: translateX(2px);
}

.event-card::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 5px;
  background: var(--green);
}

.event-name {
  font-size: 17px;
  font-weight: 900;
  margin-bottom: 7px;
}

.event-info {
  color: var(--muted);
  font-size: 12px;
}

.event-countdown {
  margin-top: 10px;
  color: var(--green);
  font-size: 12px;
  font-weight: 800;
}

.event-countdown.finished {
  color: var(--muted);
}

.empty {
  background: var(--panel);
  border: 1px dashed var(--border);
  padding: 30px;
  text-align: center;
  color: var(--muted);
  border-radius: 6px;
}

.form-panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 20px;
}

.form-group {
  margin-bottom: 18px;
}

.form-label {
  display: block;
  color: var(--muted);
  font-size: 11px;
  font-weight: 900;
  text-transform: uppercase;
  margin-bottom: 8px;
  letter-spacing: .5px;
}

input {
  width: 100%;
  background: var(--panel2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 4px;
  padding: 11px;
  outline: none;
}

input:focus {
  border-color: var(--green);
}

.departure-fields {
  display: grid;
  gap: 10px;
}

.departure-field {
  display: grid;
  grid-template-columns: 1fr 140px 40px;
  gap: 8px;
  align-items: center;
}

.remove-departure {
  height: 38px;
  border: 1px solid var(--border);
  background: #211719;
  color: var(--red);
  border-radius: 4px;
  font-weight: 900;
}

.event-header {
  margin-bottom: 22px;
}

.event-title {
  font-size: 27px;
  font-weight: 900;
  margin-bottom: 5px;
}

.event-subtitle {
  color: var(--muted);
  font-size: 12px;
}

.pilot-name-panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 15px;
  margin-bottom: 18px;
}

.pilot-name-panel input {
  max-width: 450px;
}

.departures {
  display: grid;
  gap: 14px;
}

.departure {
  overflow: hidden;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 7px;
  transition: .2s;
}

.departure.finished {
  opacity: .65;
  border-color: #222528;
}

.departure.finished:hover {
  opacity: .82;
}

.departure-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  padding: 14px 16px;
  background: var(--panel2);
  border-bottom: 1px solid var(--border);
}

.departure.finished .departure-header {
  background: #101214;
  border-bottom: 0;
}

.departure-date {
  font-size: 13px;
  font-weight: 900;
  text-transform: uppercase;
}

.departure-time {
  margin-left: 7px;
  color: var(--green);
}

.departure.finished .departure-time {
  color: var(--muted);
}

.departure-countdown {
  color: var(--muted);
  font-size: 11px;
  text-align: right;
  white-space: nowrap;
}

.departure-countdown.upcoming {
  color: var(--green);
  font-weight: 800;
}

.departure-countdown.finished {
  color: var(--muted);
}

.finished-label {
  margin-left: auto;
  margin-right: 10px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 1px;
}

.departure-toggle {
  border: 1px solid var(--border);
  background: #1c1f22;
  color: var(--muted);
  padding: 6px 9px;
  border-radius: 3px;
  font-size: 10px;
  font-weight: 900;
}

.departure-toggle:hover {
  background: #25292c;
  color: var(--text);
}

.pilot-section {
  padding: 12px;
}

.pilot-section-title {
  color: var(--muted);
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 1px;
  margin-bottom: 7px;
}

.pilot-list {
  display: grid;
  gap: 4px;
}

.pilot-row {
  display: grid;
  grid-template-columns: minmax(100px, 1fr) 48px 78px 30px;
  align-items: center;
  gap: 8px;
  min-height: 34px;
  padding: 5px 7px;
  background: var(--panel2);
  border: 1px solid rgba(255,255,255,.035);
  border-radius: 4px;
}

.pilot-name {
  font-size: 12px;
  font-weight: 800;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.category-badge {
  text-align: center;
  padding: 4px 3px;
  border-radius: 3px;
  font-size: 9px;
  font-weight: 900;
  color: #fff;
}

.cat-Hypercar {
  background: var(--blue);
}

.cat-LMP2 {
  background: var(--green);
}

.cat-LMP3 {
  background: var(--yellow);
  color: #151200;
}

.cat-GT3 {
  background: var(--red);
  color: white;
}

.availability-bar {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 2px;
  height: 17px;
}

.availability-segment {
  background: #292d31;
  border-radius: 2px;
}

.availability-segment.beginning.active {
  background: var(--green);
}

.availability-segment.middle.active {
  background: var(--yellow);
}

.availability-segment.end.active {
  background: var(--red);
}

.availability-whole {
  grid-column: 1 / 4;
  background: var(--green);
  border-radius: 2px;
}

.availability-unavailable {
  grid-column: 1 / 4;
  background: #35383b;
  border-radius: 2px;
}

.edit-button {
  width: 28px;
  height: 25px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: #25282b;
  color: var(--muted);
  font-size: 11px;
}

.edit-button:hover {
  color: var(--text);
  background: #303438;
}

.no-pilots {
  color: #666b70;
  font-size: 11px;
  padding: 8px 2px;
}

.finished-history {
  padding: 12px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .6px;
}

.form-section {
  padding: 12px;
  border-top: 1px solid var(--border);
  background: #0f1112;
}

.form-section.editing {
  border-top-color: var(--green);
}

.form-title {
  font-size: 11px;
  font-weight: 900;
  margin-bottom: 10px;
  text-transform: uppercase;
  color: var(--muted);
}

.availability-buttons {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;
  margin-bottom: 10px;
}

.availability-button {
  min-height: 38px;
  border: 1px solid var(--border);
  background: var(--panel2);
  color: var(--muted);
  border-radius: 4px;
  font-size: 10px;
  font-weight: 900;
}

.availability-button:hover {
  background: var(--panel3);
  color: var(--text);
}

.availability-button.active.beginning {
  background: var(--green);
  border-color: var(--green);
  color: #07100a;
}

.availability-button.active.middle {
  background: var(--yellow);
  border-color: var(--yellow);
  color: #151200;
}

.availability-button.active.end {
  background: var(--red);
  border-color: var(--red);
  color: white;
}

.availability-button.active.whole {
  background: var(--green);
  border-color: var(--green);
  color: #07100a;
}

.availability-button.active.unavailable {
  background: #3b3e41;
  border-color: #555a5e;
  color: white;
}

.categories {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 5px;
}

.category-button {
  min-height: 58px;
  border: 1px solid var(--border);
  background: var(--panel2);
  color: var(--muted);
  border-radius: 4px;
  font-weight: 900;
  font-size: 10px;
  position: relative;
  overflow: hidden;
}

.category-button img {
  max-width: 70px;
  max-height: 34px;
  object-fit: contain;
  display: block;
  margin: 0 auto 2px;
}

.category-button.active.hyper {
  background: var(--blue);
  border-color: var(--blue);
  color: #071017;
}

.category-button.active.lmp2 {
  background: var(--green);
  border-color: var(--green);
  color: #07100a;
}

.category-button.active.lmp3 {
  background: var(--yellow);
  border-color: var(--yellow);
  color: #151200;
}

.category-button.active.gt3 {
  background: var(--red);
  border-color: var(--red);
  color: white;
}

.save-row {
  margin-top: 10px;
  display: flex;
  justify-content: flex-end;
}

.save-button {
  border: 0;
  background: var(--accent);
  color: #07100a;
  font-size: 10px;
  font-weight: 900;
  padding: 9px 14px;
  border-radius: 4px;
}

.legend {
  padding: 10px 12px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 9px;
}

.legend span {
  margin-right: 10px;
}

@media (max-width: 650px) {

  main {
    padding: 18px 10px 40px;
  }

  .departure-header {
    align-items: flex-start;
  }

  .departure-countdown {
    font-size: 9px;
  }

  .departure-field {
    grid-template-columns: 1fr 105px 38px;
  }

  .pilot-row {
    grid-template-columns: minmax(80px, 1fr) 48px 70px 28px;
  }

  .categories {
    grid-template-columns: repeat(2, 1fr);
  }

  .availability-buttons {
    grid-template-columns: 1fr;
  }

  .finished-label {
    display: none;
  }
}
</style>
</head>

<body>

<div class="top-stripes">
  <div></div>
  <div></div>
  <div></div>
  <div></div>
</div>

<header>
  <div class="header-inner">
    <div class="logo">FMT <span>ENDURANCE</span></div>
    <button class="primary-button" onclick="showCreateEvent()">+ ÉVÉNEMENT</button>
  </div>
</header>

<main id="app"></main>

<script>

/* =========================================================
   DONNÉES
========================================================= */

let events = JSON.parse(
  localStorage.getItem("fmt_endurance_events") || "[]"
);

let currentEventId = null;
let editingPilot = null;
let departureFieldCount = 0;

const formState = {};

/*
  Permet de retenir quels départs terminés sont ouverts.
  Les départs terminés sont automatiquement fermés par défaut.
*/
const collapsedDepartures = {};


/* =========================================================
   SAUVEGARDE
========================================================= */

function saveEvents() {
  localStorage.setItem(
    "fmt_endurance_events",
    JSON.stringify(events)
  );
}


/* =========================================================
   PILOTE
========================================================= */

function getPilotName() {
  return localStorage.getItem("fmt_pilot_name") || "";
}

function setPilotName(name) {
  localStorage.setItem("fmt_pilot_name", name.trim());
}


/* =========================================================
   UTILITAIRES
========================================================= */

function escapeHtml(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escapeJs(value) {
  return String(value || "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'");
}

function generateId() {
  return Math.random().toString(36).substring(2, 8);
}

function getCategoryClass(category) {
  return "cat-" + category;
}

function getCategoryButtonClass(category) {
  if (category === "Hypercar") return "hyper";
  if (category === "LMP2") return "lmp2";
  if (category === "LMP3") return "lmp3";
  if (category === "GT3") return "gt3";

  return "";
}

function formatDate(date) {
  return new Date(date).toLocaleDateString("fr-FR");
}

function formatLongDate(date) {
  return new Date(date).toLocaleDateString(
    "fr-FR",
    {
      weekday: "long",
      day: "2-digit",
      month: "long",
      year: "numeric"
    }
  );
}

function getDepartureTimestamp(departure) {
  return new Date(
    departure.date + "T" + departure.time
  ).getTime();
}

function formatCountdown(target) {

  const diff = target - Date.now();

  if (diff <= 0) {
    return null;
  }

  const totalSeconds = Math.floor(diff / 1000);

  const days = Math.floor(totalSeconds / 86400);
  const hours = Math.floor((totalSeconds % 86400) / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;

  if (days > 0) {
    return `${days}j ${hours}h ${minutes}m`;
  }

  if (hours > 0) {
    return `${hours}h ${minutes}m ${seconds}s`;
  }

  if (minutes > 0) {
    return `${minutes}m ${seconds}s`;
  }

  return `${seconds}s`;
}


/* =========================================================
   COMPTEURS
========================================================= */

function updateCountdowns() {

  let refreshEvent = false;

  document.querySelectorAll("[data-countdown]").forEach(element => {

    const target = Number(element.dataset.countdown);
    const countdown = formatCountdown(target);

    const wasFinished =
      element.classList.contains("finished");

    if (!countdown) {

      element.textContent = "🏁 Départ passé";

      element.classList.remove("upcoming");
      element.classList.add("finished");

      if (!wasFinished && currentEventId) {
        refreshEvent = true;
      }

    } else {

      element.textContent = "⏱ " + countdown;

      element.classList.remove("finished");
      element.classList.add("upcoming");
    }

  });


  document.querySelectorAll("[data-event-countdown]").forEach(element => {

    const target = Number(element.dataset.eventCountdown);
    const countdown = formatCountdown(target);

    if (!countdown) {

      element.textContent = "🏁 Événement terminé";
      element.classList.add("finished");

    } else {

      element.textContent =
        "⏱ Prochain départ dans " + countdown;

      element.classList.remove("finished");
    }

  });


  /*
    Lorsqu'un départ vient juste de passer,
    on reconstruit l'événement pour le réduire automatiquement.
  */
  if (refreshEvent && currentEventId) {
    renderEvent();
  }
}


/* =========================================================
   ACCUEIL
========================================================= */

function renderHome() {

  currentEventId = null;
  editingPilot = null;

  let html = `
    <div class="page-title">ÉVÉNEMENTS</div>
    <div class="page-subtitle">
      Gestion des courses d'endurance FMT
    </div>
  `;

  if (!events.length) {

    html += `
      <div class="empty">
        Aucun événement créé.
      </div>
    `;

  } else {

    html += `<div class="event-list">`;

    events.forEach(event => {

      const futureDepartures = event.departures
        .filter(d => getDepartureTimestamp(d) > Date.now())
        .sort(
          (a, b) =>
            getDepartureTimestamp(a) -
            getDepartureTimestamp(b)
        );

      const nextDeparture = futureDepartures[0];

      html += `
        <div
          class="event-card"
          onclick="openEvent('${escapeJs(event.id)}')"
        >

          <div class="event-name">
            ${escapeHtml(event.name)}
          </div>

          <div class="event-info">
            ${event.departures.length}
            départ${event.departures.length > 1 ? "s" : ""}
          </div>

          <div
            class="event-countdown ${!nextDeparture ? "finished" : ""}"
            data-event-countdown="${
              nextDeparture
                ? getDepartureTimestamp(nextDeparture)
                : 0
            }"
          >
            ${
              nextDeparture
                ? "⏱ Prochain départ dans " +
                  (formatCountdown(
                    getDepartureTimestamp(nextDeparture)
                  ) || "...")
                : "🏁 Événement terminé"
            }
          </div>

        </div>
      `;

    });

    html += `</div>`;
  }

  document.getElementById("app").innerHTML = html;
}


/* =========================================================
   OUVRIR UN ÉVÉNEMENT
========================================================= */

function openEvent(id) {

  currentEventId = id;
  editingPilot = null;

  Object.keys(formState).forEach(
    key => delete formState[key]
  );

  renderEvent();
}


/* =========================================================
   AFFICHER UN ÉVÉNEMENT
========================================================= */

function renderEvent() {

  const event = events.find(
    e => e.id === currentEventId
  );

  if (!event) {
    renderHome();
    return;
  }

  let html = `

    <button
      class="secondary-button back-button"
      onclick="renderHome()"
    >
      ← Retour aux événements
    </button>

    <div class="event-header">

      <div class="event-title">
        ${escapeHtml(event.name)}
      </div>

      <div class="event-subtitle">
        ${event.departures.length}
        départ${event.departures.length > 1 ? "s" : ""}
      </div>

    </div>

    <div class="pilot-name-panel">

      <label class="form-label">
        Ton pseudo pilote
      </label>

      <input
        id="globalPilotName"
        type="text"
        maxlength="30"
        placeholder="Ex : McFly"
        value="${escapeHtml(getPilotName())}"
        oninput="setPilotName(this.value)"
      >

    </div>

    <div class="departures">
  `;

  event.departures.forEach(
    (departure, index) => {

      html += renderDeparture(
        event,
        departure,
        index
      );

    }
  );

  html += `</div>`;

  document.getElementById("app").innerHTML = html;

  updateCountdowns();
}


/* =========================================================
   DÉPART
========================================================= */

function renderDeparture(
  event,
  departure,
  departureIndex
) {

  const timestamp =
    getDepartureTimestamp(departure);

  const finished =
    timestamp <= Date.now();

  /*
    Un départ terminé est automatiquement fermé
    s'il n'a jamais été ouvert auparavant.
  */
  if (
    finished &&
    collapsedDepartures[departure.id] === undefined
  ) {
    collapsedDepartures[departure.id] = true;
  }

  const collapsed =
    finished &&
    collapsedDepartures[departure.id];

  const availablePilots =
    departure.availability.filter(
      pilot => pilot.status !== "unavailable"
    );

  let html = `

    <div class="departure ${finished ? "finished" : ""}">

      <div class="departure-header">

        <div class="departure-date">

          ${escapeHtml(
            formatLongDate(departure.date)
          )}

          <span class="departure-time">
            ${escapeHtml(departure.time)}
          </span>

        </div>

        ${
          finished
            ? `
              <div class="finished-label">
                TERMINÉ
              </div>

              <button
                class="departure-toggle"
                onclick="toggleDeparture('${escapeJs(
                  departure.id
                )}')"
              >
                ${collapsed ? "AFFICHER" : "MASQUER"}
              </button>
            `
            : `
              <div
                class="departure-countdown upcoming"
                data-countdown="${timestamp}"
              >
                ⏱ ${
                  formatCountdown(timestamp) ||
                  "Départ passé"
                }
              </div>
            `
        }

      </div>
  `;


  /*
    Départ terminé et réduit :
    on n'affiche que l'en-tête.
  */

  if (finished && collapsed) {

    html += `</div>`;

    return html;
  }


  /*
    Liste des pilotes
  */

  html += `

    <div class="pilot-section">

      <div class="pilot-section-title">
        ${finished ? "HISTORIQUE DES PILOTES" : "PILOTES INSCRITS"}
      </div>

      <div class="pilot-list">
  `;

  if (!availablePilots.length) {

    html += `
      <div class="no-pilots">
        Aucun pilote inscrit.
      </div>
    `;

  } else {

    availablePilots.forEach(pilot => {

      html += renderPilotRow(
        pilot,
        finished
      );

    });

  }

  html += `
      </div>
    </div>
  `;


  /*
    Si le départ est terminé,
    surtout pas de formulaire.
  */

  if (finished) {

    html += `
      <div class="finished-history">
        🏁 Départ terminé — inscriptions verrouillées
      </div>
    `;

  } else {

    html += renderForm(
      event,
      departure,
      departureIndex
    );

    html += `
      <div class="legend">
        <span>🟢 Début</span>
        <span>🟡 Milieu</span>
        <span>🔴 Fin</span>
        <span>🟢 Toute la course</span>
      </div>
    `;
  }

  html += `</div>`;

  return html;
}


/* =========================================================
   LIGNE PILOTE
========================================================= */

function renderPilotRow(
  pilot,
  finished = false
) {

  let availabilityHtml = "";

  if (pilot.status === "whole") {

    availabilityHtml = `
      <div class="availability-bar">
        <div class="availability-whole"></div>
      </div>
    `;

  } else if (
    pilot.status === "unavailable"
  ) {

    availabilityHtml = `
      <div class="availability-bar">
        <div class="availability-unavailable"></div>
      </div>
    `;

  } else {

    const parts =
      pilot.status.split(",");

    availabilityHtml = `
      <div class="availability-bar">

        <div class="availability-segment beginning ${
          parts.includes("beginning")
            ? "active"
            : ""
        }"></div>

        <div class="availability-segment middle ${
          parts.includes("middle")
            ? "active"
            : ""
        }"></div>

        <div class="availability-segment end ${
          parts.includes("end")
            ? "active"
            : ""
        }"></div>

      </div>
    `;
  }


  /*
    Sur un départ terminé,
    aucun bouton de modification.
  */

  const actionHtml = finished
    ? `<span></span>`
    : `
      <button
        class="edit-button"
        onclick="editPilot('${escapeJs(pilot.name)}')"
        title="Modifier"
      >
        ✎
      </button>
    `;

  return `

    <div class="pilot-row">

      <div class="pilot-name">
        ${escapeHtml(pilot.name)}
      </div>

      <div class="category-badge ${
        getCategoryClass(pilot.category)
      }">
        ${escapeHtml(pilot.category)}
      </div>

      ${availabilityHtml}

      ${actionHtml}

    </div>
  `;
}


/* =========================================================
   FORMULAIRE
========================================================= */

function getStatusLabel(status) {

  if (!status) return "";

  if (status === "whole") {
    return "Toute la course";
  }

  if (status === "unavailable") {
    return "Indisponible";
  }

  return status;
}


function renderForm(
  event,
  departure,
  departureIndex
) {

  ensureFormState(departure.id);

  const state =
    formState[departure.id];

  const editing =
    editingPilot !== null;

  return `

    <div class="form-section ${
      editing ? "editing" : ""
    }">

      <div class="form-title">
        ${
          editing
            ? "Modifier mon inscription"
            : "Ma disponibilité"
        }
      </div>

      <div class="availability-buttons">

        <button
          class="availability-button beginning ${
            state.beginning
              ? "active"
              : ""
          }"
          onclick="toggleAvailability(
            '${escapeJs(departure.id)}',
            'beginning'
          )"
        >
          DÉBUT
        </button>

        <button
          class="availability-button middle ${
            state.middle
              ? "active"
              : ""
          }"
          onclick="toggleAvailability(
            '${escapeJs(departure.id)}',
            'middle'
          )"
        >
          MILIEU
        </button>

        <button
          class="availability-button end ${
            state.end
              ? "active"
              : ""
          }"
          onclick="toggleAvailability(
            '${escapeJs(departure.id)}',
            'end'
          )"
        >
          FIN
        </button>

        <button
          class="availability-button whole ${
            state.whole
              ? "active"
              : ""
          }"
          onclick="setAvailability(
            '${escapeJs(departure.id)}',
            'whole'
          )"
        >
          TOUTE LA COURSE
        </button>

        <button
          class="availability-button unavailable ${
            state.unavailable
              ? "active"
              : ""
          }"
          onclick="setAvailability(
            '${escapeJs(departure.id)}',
            'unavailable'
          )"
        >
          INDISPONIBLE
        </button>

      </div>


      <div class="form-title">
        Catégorie
      </div>

      <div class="categories">

        ${renderCategoryButton(
          departure.id,
          "Hypercar",
          state.category === "Hypercar"
        )}

        ${renderCategoryButton(
          departure.id,
          "LMP2",
          state.category === "LMP2"
        )}

        ${renderCategoryButton(
          departure.id,
          "LMP3",
          state.category === "LMP3"
        )}

        ${renderCategoryButton(
          departure.id,
          "GT3",
          state.category === "GT3"
        )}

      </div>


      <div class="save-row">

        <button
          class="save-button"
          onclick="saveAvailability(
            '${escapeJs(departure.id)}'
          )"
        >
          ${editing ? "MODIFIER" : "S'INSCRIRE"}
        </button>

      </div>

    </div>
  `;
}


/* =========================================================
   BOUTONS CATÉGORIES
========================================================= */

function renderCategoryButton(
  departureId,
  category,
  selected
) {

  const imageMap = {
    Hypercar: "images/HC.png",
    LMP2: "images/LMP2.png",
    LMP3: "images/P3.png",
    GT3: "images/GT3.png"
  };

  return `

    <button
      class="category-button ${
        getCategoryButtonClass(category)
      } ${selected ? "active" : ""}"
      onclick="setCategory(
        '${escapeJs(departureId)}',
        '${escapeJs(category)}'
      )"
    >

      ${
        imageMap[category]
          ? `
            <img
              src="${imageMap[category]}"
              alt="${escapeHtml(category)}"
              onerror="this.style.display='none'"
            >
          `
          : ""
      }

      ${escapeHtml(category)}

    </button>
  `;
}


/* =========================================================
   ÉTAT DU FORMULAIRE
========================================================= */

function ensureFormState(departureId) {

  if (!formState[departureId]) {

    formState[departureId] = {

      beginning: false,
      middle: false,
      end: false,
      whole: false,
      unavailable: false,
      category: ""
    };
  }
}


/* =========================================================
   DISPONIBILITÉ
========================================================= */

function toggleAvailability(
  departureId,
  type
) {

  const event =
    events.find(
      e => e.id === currentEventId
    );

  const departure =
    event?.departures.find(
      d => d.id === departureId
    );

  /*
    Sécurité :
    impossible de modifier un départ terminé.
  */

  if (
    !departure ||
    getDepartureTimestamp(departure) <= Date.now()
  ) {
    return;
  }

  ensureFormState(departureId);

  const state =
    formState[departureId];

  /*
    Si on clique sur une disponibilité,
    on désactive whole + unavailable.
  */

  state.whole = false;
  state.unavailable = false;

  state[type] = !state[type];


  /*
    Si les trois segments sont sélectionnés,
    on passe automatiquement à toute la course.
  */

  if (
    state.beginning &&
    state.middle &&
    state.end
  ) {

    state.beginning = false;
    state.middle = false;
    state.end = false;

    state.whole = true;
  }

  refreshDepartureForm(departureId);
}


function setAvailability(
  departureId,
  type
) {

  const event =
    events.find(
      e => e.id === currentEventId
    );

  const departure =
    event?.departures.find(
      d => d.id === departureId
    );

  if (
    !departure ||
    getDepartureTimestamp(departure) <= Date.now()
  ) {
    return;
  }

  ensureFormState(departureId);

  const state =
    formState[departureId];

  state.beginning = false;
  state.middle = false;
  state.end = false;
  state.whole = false;
  state.unavailable = false;

  state[type] = true;

  refreshDepartureForm(departureId);
}


/* =========================================================
   CATÉGORIE
========================================================= */

function setCategory(
  departureId,
  category
) {

  const event =
    events.find(
      e => e.id === currentEventId
    );

  const departure =
    event?.departures.find(
      d => d.id === departureId
    );

  if (
    !departure ||
    getDepartureTimestamp(departure) <= Date.now()
  ) {
    return;
  }

  ensureFormState(departureId);

  formState[departureId].category =
    category;

  refreshDepartureForm(departureId);
}


/* =========================================================
   RAFRAÎCHIR LE FORMULAIRE
========================================================= */

function refreshDepartureForm(
  departureId
) {

  const container =
    document.querySelector(
      `.form-section:has(#name-${departureId})`
    );

  /*
    Si le navigateur ne trouve pas le conteneur
    avec :has(), on reconstruit simplement l'événement.
  */

  if (!container) {
    renderEvent();
    return;
  }
}


/* =========================================================
   INSCRIPTION
========================================================= */

function saveAvailability(
  departureId
) {

  const event =
    events.find(
      e => e.id === currentEventId
    );

  if (!event) return;

  const departure =
    event.departures.find(
      d => d.id === departureId
    );

  if (!departure) return;

  /*
    Sécurité départ terminé
  */

  if (
    getDepartureTimestamp(departure) <= Date.now()
  ) {

    alert(
      "Ce départ est terminé. Les inscriptions sont verrouillées."
    );

    return;
  }


  const name =
    getPilotName().trim();

  if (!name) {

    alert(
      "Entre d'abord ton pseudo pilote."
    );

    document
      .getElementById("globalPilotName")
      ?.focus();

    return;
  }


  ensureFormState(departureId);

  const state =
    formState[departureId];

  let status = "";

  if (state.unavailable) {

    status = "unavailable";

  } else if (state.whole) {

    status = "whole";

  } else {

    const parts = [];

    if (state.beginning)
      parts.push("beginning");

    if (state.middle)
      parts.push("middle");

    if (state.end)
      parts.push("end");

    status = parts.join(",");
  }


  if (!status) {

    alert(
      "Choisis ta disponibilité."
    );

    return;
  }


  if (
    status !== "unavailable" &&
    !state.category
  ) {

    alert(
      "Choisis ta catégorie."
    );

    return;
  }


  const existingIndex =
    departure.availability.findIndex(
      pilot =>
        pilot.name.toLowerCase() ===
        name.toLowerCase()
    );


  const pilotData = {

    id:
      existingIndex >= 0
        ? departure.availability[existingIndex].id
        : generateId(),

    name,

    category:
      status === "unavailable"
        ? ""
        : state.category,

    status
  };


  if (existingIndex >= 0) {

    departure.availability[
      existingIndex
    ] = pilotData;

  } else {

    departure.availability.push(
      pilotData
    );
  }


  setPilotName(name);

  saveEvents();

  delete formState[departureId];

  editingPilot = null;

  renderEvent();

  setTimeout(() => {

    const element =
      document.querySelector(
        `[data-departure-id="${departureId}"]`
      );

    if (element) {
      element.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });
    }

  }, 50);
}


/* =========================================================
   MODIFIER UN PILOTE
========================================================= */

function editPilot(name) {

  const event =
    events.find(
      e => e.id === currentEventId
    );

  if (!event) return;


  /*
    Vérification :
    si le pilote n'a aucun départ modifiable,
    on ne fait rien.
  */

  const editableDeparture =
    event.departures.some(
      departure =>
        getDepartureTimestamp(departure) >
        Date.now()
    );

  if (!editableDeparture) {
    return;
  }


  editingPilot = name;

  setPilotName(name);


  /*
    Charger les données du pilote
    pour tous les départs encore modifiables.
  */

  event.departures.forEach(
    departure => {

      if (
        getDepartureTimestamp(departure) <=
        Date.now()
      ) {
        return;
      }

      const pilot =
        departure.availability.find(
          p =>
            p.name.toLowerCase() ===
            name.toLowerCase()
        );

      ensureFormState(
        departure.id
      );

      const state =
        formState[departure.id];

      state.beginning = false;
      state.middle = false;
      state.end = false;
      state.whole = false;
      state.unavailable = false;
      state.category = "";


      if (!pilot) return;


      if (
        pilot.status === "whole"
      ) {

        state.whole = true;

      } else if (
        pilot.status === "unavailable"
      ) {

        state.unavailable = true;

      } else {

        const parts =
          pilot.status.split(",");

        state.beginning =
          parts.includes("beginning");

        state.middle =
          parts.includes("middle");

        state.end =
          parts.includes("end");
      }


      state.category =
        pilot.category || "";
    }
  );


  renderEvent();


  setTimeout(() => {

    const form =
      document.querySelector(
        ".form-section.editing"
      );

    if (form) {

      form.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });

    }

  }, 50);
}


/* =========================================================
   DÉPART TERMINÉ : AFFICHER / MASQUER
========================================================= */

function toggleDeparture(
  departureId
) {

  const event =
    events.find(
      e => e.id === currentEventId
    );

  if (!event) return;

  const departure =
    event.departures.find(
      d => d.id === departureId
    );

  if (!departure) return;


  /*
    On ne permet le toggle
    que pour un départ terminé.
  */

  if (
    getDepartureTimestamp(departure) >
    Date.now()
  ) {
    return;
  }


  collapsedDepartures[departureId] =
    !collapsedDepartures[departureId];

  renderEvent();
}

   CRÉATION ÉVÉNEMENT
========================================================= */

/* =========================================================
   AJOUT D'UN DÉPART
========================================================= */

function addDepartureField(
  date = "",
  time = ""
) {

  departureFieldCount++;

  const id =
    "departureField" +
    departureFieldCount;

  const container =
    document.getElementById(
      "departureFields"
    );

  const div =
    document.createElement("div");

  div.className =
    "departure-field";

  div.id = id;

  div.innerHTML = `

    <input
      type="date"
      class="new-departure-date"
      value="${date}"
    >

    <input
      type="time"
      class="new-departure-time"
      value="${time}"
    >

    <button
      class="remove-departure"
      onclick="document.getElementById('${id}').remove()"
    >
      ×
    </button>
  `;

  container.appendChild(div);
}


/* =========================================================
   CRÉER ÉVÉNEMENT
========================================================= */

function createEvent() {

  const name =
    document
      .getElementById("eventName")
      .value
      .trim();

  if (!name) {

    alert(
      "Donne un nom à l'événement."
    );

    return;
  }


  const fields =
    document.querySelectorAll(
      ".departure-field"
    );

  const departures = [];


  fields.forEach(field => {

    const date =
      field.querySelector(
        ".new-departure-date"
      ).value;

    const time =
      field.querySelector(
        ".new-departure-time"
      ).value;

    if (date && time) {

      departures.push({

        id: generateId(),

        date,

        time,

        availability: []
      });
    }

  });


  if (!departures.length) {

    alert(
      "Ajoute au moins un départ avec une date et une heure."
    );

    return;
  }


  departures.sort(
    (a, b) =>
      getDepartureTimestamp(a) -
      getDepartureTimestamp(b)
  );


  const newEvent = {

    id: generateId(),

    name,

    departures
  };


  events.push(newEvent);

  saveEvents();

  openEvent(newEvent.id);
}
