<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FMT Endurance</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #0b0d10;
    color: #f2f4f7;
    min-height: 100vh;
}

.container {
    width: min(950px, 92%);
    margin: auto;
    padding: 40px 0;
}

header {
    text-align: center;
    margin-bottom: 45px;
}

.logo {
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 2px;
}

.logo span {
    color: #9cff00;
}

header p {
    color: #8f99a5;
    margin-top: 10px;
}

.card {
    background: #12161b;
    border: 1px solid #272e36;
    border-radius: 16px;
    padding: 25px;
    margin-bottom: 20px;
}

h1 {
    font-size: 28px;
    margin-bottom: 10px;
}

h2 {
    margin-bottom: 20px;
}

h3 {
    margin-bottom: 8px;
}

.button {
    display: inline-block;
    border: none;
    border-radius: 10px;
    padding: 13px 20px;
    background: #9cff00;
    color: #101400;
    font-weight: bold;
    cursor: pointer;
    font-size: 15px;
}

.button:hover {
    background: #b4ff40;
}

.button.secondary {
    background: #272e36;
    color: white;
}

.button.danger {
    background: #ff4d5a;
    color: white;
}

.events {
    margin-top: 25px;
}

.event {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    padding: 20px;
    background: #181d23;
    border: 1px solid #272e36;
    border-radius: 12px;
    margin-bottom: 12px;
}

.event-info {
    color: #8f99a5;
    font-size: 14px;
}

.countdown {
    min-width: 220px;
    text-align: center;
    padding: 12px;
    background: #0b0d10;
    border-radius: 10px;
    border: 1px solid #272e36;
}

.countdown-title {
    color: #8f99a5;
    font-size: 12px;
    text-transform: uppercase;
    margin-bottom: 5px;
}

.countdown-time {
    color: #9cff00;
    font-size: 19px;
    font-weight: bold;
}

.countdown.running {
    border-color: #9cff00;
}

.countdown.finished {
    border-color: #ff4d5a;
}

.countdown.finished .countdown-time {
    color: #ff6b75;
}

.form-group {
    margin-bottom: 18px;
}

label {
    display: block;
    margin-bottom: 7px;
    color: #cbd1d8;
    font-size: 14px;
}

input,
select {
    width: 100%;
    padding: 13px;
    border-radius: 9px;
    border: 1px solid #303841;
    background: #0b0d10;
    color: white;
    font-size: 15px;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 25px;
}

.hidden {
    display: none;
}

.back {
    margin-bottom: 20px;
}

.event-header {
    text-align: center;
    margin-bottom: 30px;
}

.event-header .date {
    color: #9cff00;
    margin-top: 10px;
}

.departures {
    margin-top: 25px;
}

.departure {
    background: #181d23;
    border: 1px solid #272e36;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 12px;
}

.departure.next {
    border-color: #9cff00;
}

.departure-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.departure-date {
    font-size: 18px;
    font-weight: bold;
}

.departure-time {
    color: #9cff00;
    font-weight: bold;
    margin-top: 5px;
}

.next-label {
    background: #9cff00;
    color: #101400;
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
}

.departure-form {
    background: #0b0d10;
    border-radius: 10px;
    padding: 15px;
    margin-top: 15px;
}

.person {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 13px;
    border-bottom: 1px solid #272e36;
}

.person:last-child {
    border-bottom: none;
}

.status {
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
}

.available {
    background: #203500;
    color: #9cff00;
}

.maybe {
    background: #443700;
    color: #ffc857;
}

.unavailable {
    background: #421c20;
    color: #ff6b75;
}

.empty {
    text-align: center;
    color: #8f99a5;
    padding: 25px 10px;
}

.departure-list {
    margin-top: 15px;
}

.small-button {
    padding: 8px 12px;
    font-size: 13px;
}

.departure-builder {
    background: #181d23;
    border: 1px solid #272e36;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 12px;
}

.departure-builder-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

@media (max-width: 750px) {

    .event {
        flex-direction: column;
        align-items: stretch;
    }

    .countdown {
        width: 100%;
    }

    .event .button {
        width: 100%;
    }

    .departure-header {
        flex-direction: column;
        align-items: flex-start;
    }

    .buttons {
        flex-direction: column;
    }

    .buttons .button {
        width: 100%;
    }
}

</style>
</head>

<body>

<div class="container">

<!-- ================================= -->
<!-- ACCUEIL -->
<!-- ================================= -->

<section id="home">

<header>

    <div class="logo">
        FMT <span>■</span> ENDURANCE
    </div>

    <p>
        Organisation simple de vos événements endurance
    </p>

</header>


<div class="card" style="text-align:center;">

    <h1>Organiser un événement</h1>

    <p style="color:#8f99a5; margin-bottom:20px;">
        Crée un événement et propose plusieurs départs
        aux pilotes.
    </p>

    <button
        class="button"
        onclick="showCreateEvent()"
    >
        + CRÉER UN ÉVÉNEMENT
    </button>

</div>


<div class="card">

    <h2>🏁 Événements</h2>

    <div id="eventsList"></div>

</div>

</section>


<!-- ================================= -->
<!-- CREATION EVENEMENT -->
<!-- ================================= -->

<section id="createEvent" class="hidden">

<div class="back">

    <button
        class="button secondary"
        onclick="showHome()"
    >
        ← Retour
    </button>

</div>


<div class="card">

<h1>Créer un événement</h1>

<div class="form-group">

    <label>Nom de l'événement</label>

    <input
        id="eventName"
        type="text"
        placeholder="Ex : Spa-Francorchamps"
    >

</div>


<h2 style="margin-top:30px;">
    🏁 Départs
</h2>

<p style="color:#8f99a5; margin-bottom:20px;">
    Ajoute les différents jours et horaires proposés.
</p>


<div id="departureBuilder"></div>


<button
    class="button secondary"
    onclick="addDepartureField()"
>
    + AJOUTER UN DÉPART
</button>


<div class="buttons">

    <button
        class="button"
        onclick="createEvent()"
    >
        CRÉER L'ÉVÉNEMENT
    </button>

    <button
        class="button secondary"
        onclick="showHome()"
    >
        ANNULER
    </button>

</div>

</div>

</section>


<!-- ================================= -->
<!-- PAGE EVENEMENT -->
<!-- ================================= -->

<section id="eventPage" class="hidden">

<div class="back">

    <button
        class="button secondary"
        onclick="showHome()"
    >
        ← Retour aux événements
    </button>

</div>


<div class="card">

    <div class="event-header">

        <h1 id="eventTitle"></h1>

        <div
            id="nextCountdown"
            class="countdown"
            style="margin:20px auto 0;"
        >

            <div class="countdown-title">
                ⏳ Prochain départ
            </div>

            <div class="countdown-time">
                Calcul...
            </div>

        </div>

    </div>

</div>


<div class="card">

    <h2>🏁 Départs</h2>

    <div id="departuresList"></div>

</div>

</section>

</div>


<script>

// ==========================================
// DONNEES
// ==========================================

let events = [

    {
        id: 1,

        name: "Spa-Francorchamps",

        departures: [

            {
                id: 101,
                date: "2026-09-14",
                time: "20:00",
                availability: []
            },

            {
                id: 102,
                date: "2026-09-15",
                time: "20:00",
                availability: []
            }

        ]

    }

];


let currentEvent = null;


// ==========================================
// NAVIGATION
// ==========================================

function hideAll() {

    document.getElementById("home")
        .classList.add("hidden");

    document.getElementById("createEvent")
        .classList.add("hidden");

    document.getElementById("eventPage")
        .classList.add("hidden");

}


function showHome() {

    hideAll();

    document.getElementById("home")
        .classList.remove("hidden");

    displayEvents();

}


function showCreateEvent() {

    hideAll();

    document.getElementById("createEvent")
        .classList.remove("hidden");

    document.getElementById("departureBuilder")
        .innerHTML = "";

    addDepartureField();

}


// ==========================================
// AJOUTER UN DEPART DANS LE FORMULAIRE
// ==========================================

function addDepartureField() {

    const container =
        document.getElementById("departureBuilder");

    const id = Date.now() + Math.random();


    const div =
        document.createElement("div");

    div.className = "departure-builder";

    div.dataset.id = id;


    div.innerHTML = `

        <div class="departure-builder-header">

            <strong>
                🏁 Départ
            </strong>

            <button
                class="button danger small-button"
                onclick="this.parentElement.parentElement.remove()"
            >
                Supprimer
            </button>

        </div>


        <div class="form-group">

            <label>Date</label>

            <input
                type="date"
                class="departure-date-input"
            >

        </div>


        <div class="form-group">

            <label>Heure</label>

            <input
                type="time"
                class="departure-time-input"
            >

        </div>

    `;


    container.appendChild(div);

}


// ==========================================
// CREER EVENEMENT
// ==========================================

function createEvent() {

    const name =
        document.getElementById("eventName").value.trim();


    if (!name) {

        alert(
            "Merci d'indiquer le nom de l'événement."
        );

        return;

    }


    const builders =
        document.querySelectorAll(
            ".departure-builder"
        );


    const departures = [];


    builders.forEach(builder => {

        const date =
            builder.querySelector(
                ".departure-date-input"
            ).value;


        const time =
            builder.querySelector(
                ".departure-time-input"
            ).value;


        if (date && time) {

            departures.push({

                id: Date.now() + Math.random(),

                date: date,

                time: time,

                availability: []

            });

        }

    });


    if (departures.length === 0) {

        alert(
            "Ajoute au moins un départ."
        );

        return;

    }


    const newEvent = {

        id: Date.now(),

        name: name,

        departures: departures

    };


    events.push(newEvent);


    openEvent(newEvent.id);

}


// ==========================================
// AFFICHER EVENEMENTS
// ==========================================

function displayEvents() {

    const list =
        document.getElementById("eventsList");


    if (events.length === 0) {

        list.innerHTML = `

            <div class="empty">
                Aucun événement pour le moment.
            </div>

        `;

        return;

    }


    list.innerHTML = "";


    events.forEach(event => {

        const next =
            getNextDeparture(event);


        let countdownHTML = "";


        if (next) {

            countdownHTML = `

                <div
                    class="countdown"
                    id="countdown-${event.id}"
                >

                    <div class="countdown-title">
                        ⏳ Prochain départ
                    </div>

                    <div class="countdown-time">
                        Calcul...
                    </div>

                </div>

            `;

        } else {

            countdownHTML = `

                <div class="countdown finished">

                    <div class="countdown-title">
                        🏁 Événement terminé
                    </div>

                    <div class="countdown-time">
                        Terminé
                    </div>

                </div>

            `;

        }


        list.innerHTML += `

            <div class="event">

                <div style="flex:1">

                    <h3>
                        🏁 ${escapeHTML(event.name)}
                    </h3>

                    <div class="event-info">

                        ${event.departures.length}
                        départ${event.departures.length > 1 ? "s" : ""}

                    </div>

                </div>


                ${countdownHTML}


                <button
                    class="button"
                    onclick="openEvent(${event.id})"
                >
                    VOIR
                </button>

            </div>

        `;

    });


    updateCountdowns();

}


// ==========================================
// PROCHAIN DEPART
// ==========================================

function getNextDeparture(event) {

    const now = new Date();


    const future =
        event.departures

        .map(departure => {

            return {

                departure: departure,

                date: getDepartureDate(departure)

            };

        })

        .filter(item => item.date > now)

        .sort(
            (a, b) => a.date - b.date
        );


    if (future.length === 0) {

        return null;

    }


    return future[0].departure;

}


// ==========================================
// DATE DE DEPART
// ==========================================

function getDepartureDate(departure) {

    return new Date(
        `${departure.date}T${departure.time}:00`
    );

}


// ==========================================
// COMPTE A REBOURS
// ==========================================

function updateCountdowns() {

    events.forEach(event => {

        const element =
            document.getElementById(
                `countdown-${event.id}`
            );


        if (!element) return;


        const next =
            getNextDeparture(event);


        if (!next) {

            element.classList.add(
                "finished"
            );

            element.querySelector(
                ".countdown-title"
            ).textContent =
                "🏁 Événement terminé";


            element.querySelector(
                ".countdown-time"
            ).textContent =
                "Terminé";


            return;

        }


        const difference =
            getDepartureDate(next) - new Date();


        if (difference <= 0) {

            displayEvents();

            return;

        }


        const totalSeconds =
            Math.floor(
                difference / 1000
            );


        const days =
            Math.floor(
                totalSeconds / 86400
            );


        const hours =
            Math.floor(
                (totalSeconds % 86400) / 3600
            );


        const minutes =
            Math.floor(
                (totalSeconds % 3600) / 60
            );


        const seconds =
            totalSeconds % 60;


        element.querySelector(
            ".countdown-time"
        ).textContent =

            `${days}j `
            +
            `${pad(hours)}h `
            +
            `${pad(minutes)}m `
            +
            `${pad(seconds)}s`;

    });


    updateEventPageCountdown();

}


// ==========================================
// COMPTEUR PAGE EVENEMENT
// ==========================================

function updateEventPageCountdown() {

    if (!currentEvent) return;


    const element =
        document.getElementById(
            "nextCountdown"
        );


    if (!element) return;


    const next =
        getNextDeparture(currentEvent);


    if (!next) {

        element.querySelector(
            ".countdown-title"
        ).textContent =
            "🏁 Événement terminé";


        element.querySelector(
            ".countdown-time"
        ).textContent =
            "Terminé";


        return;

    }


    const difference =
        getDepartureDate(next) - new Date();


    const totalSeconds =
        Math.floor(
            difference / 1000
        );


    const days =
        Math.floor(
            totalSeconds / 86400
        );


    const hours =
        Math.floor(
            (totalSeconds % 86400) / 3600
        );


    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );


    const seconds =
        totalSeconds % 60;


    element.querySelector(
        ".countdown-time"
    ).textContent =

        `${days}j `
        +
        `${pad(hours)}h `
        +
        `${pad(minutes)}m `
        +
        `${pad(seconds)}s`;

}


// ==========================================
// OUVRIR EVENEMENT
// ==========================================

function openEvent(id) {

    currentEvent =
        events.find(
            event => event.id === id
        );


    if (!currentEvent) return;


    hideAll();


    document.getElementById("eventPage")
        .classList.remove("hidden");


    document.getElementById("eventTitle")
        .textContent =
        currentEvent.name;


    displayDepartures();

    updateEventPageCountdown();

}


// ==========================================
// AFFICHER LES DEPARTS
// ==========================================

function displayDepartures() {

    const list =
        document.getElementById(
            "departuresList"
        );


    const sorted =
        [...currentEvent.departures]
        .sort(
            (a, b) =>
                getDepartureDate(a)
                -
                getDepartureDate(b)
        );


    const next =
        getNextDeparture(currentEvent);


    list.innerHTML = "";


    sorted.forEach(departure => {

        const isNext =
            next &&
            departure.id === next.id;


        const date =
            formatDate(
                departure.date
            );


        const availability =
            departure.availability;


        let peopleHTML = "";


        if (availability.length === 0) {

            peopleHTML = `

                <div class="empty">
                    Aucune disponibilité renseignée.
                </div>

            `;

        } else {

            availability.forEach(person => {

                let text;
                let className;


                if (
                    person.status === "available"
                ) {

                    text = "Disponible";
                    className = "available";

                }


                if (
                    person.status === "maybe"
                ) {

                    text = "Peut-être";
                    className = "maybe";

                }


                if (
                    person.status === "unavailable"
                ) {

                    text = "Indisponible";
                    className = "unavailable";

                }


                peopleHTML += `

                    <div class="person">

                        <strong>
                            ${escapeHTML(person.name)}
                        </strong>

                        <span
                            class="status ${className}"
                        >
                            ${text}
                        </span>

                    </div>

                `;

            });

        }


        list.innerHTML += `

            <div
                class="departure
                ${isNext ? "next" : ""}"
            >

                <div class="departure-header">

                    <div>

                        <div class="departure-date">

                            📅 ${date}

                        </div>

                        <div class="departure-time">

                            🕐 ${departure.time}

                        </div>

                    </div>


                    ${
                        isNext
                        ?
                        `
                        <span class="next-label">
                            PROCHAIN DÉPART
                        </span>
                        `
                        :
                        ""
                    }

                </div>


                <button
                    class="button"
                    style="margin-top:15px;"
                    onclick="showDepartureForm(${departure.id})"
                >
                    + MA DISPONIBILITÉ
                </button>


                <div
                    id="form-${departure.id}"
                    class="departure-form hidden"
                >

                    <div class="form-group">

                        <label>
                            Ton pseudo
                        </label>

                        <input
                            id="name-${departure.id}"
                            type="text"
                            placeholder="Ex : McFly"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Ta disponibilité
                        </label>

                        <select
                            id="status-${departure.id}"
                        >

                            <option value="available">
                                🟢 Disponible
                            </option>

                            <option value="maybe">
                                🟠 Peut-être
                            </option>

                            <option value="unavailable">
                                🔴 Indisponible
                            </option>

                        </select>

                    </div>


                    <div class="buttons">

                        <button
                            class="button"
                            onclick="addAvailability(${departure.id})"
                        >
                            ENREGISTRER
                        </button>

                        <button
                            class="button secondary"
                            onclick="hideDepartureForm(${departure.id})"
                        >
                            ANNULER
                        </button>

                    </div>

                </div>


                <div class="departure-list">

                    ${peopleHTML}

                </div>

            </div>

        `;

    });

}


// ==========================================
// FORMULAIRE DISPONIBILITE
// ==========================================

function showDepartureForm(id) {

    document
        .getElementById(`form-${id}`)
        .classList.remove("hidden");

}


function hideDepartureForm(id) {

    document
        .getElementById(`form-${id}`)
        .classList.add("hidden");

}


// ==========================================
// AJOUTER DISPONIBILITE
// ==========================================

function addAvailability(departureId) {

    const departure =
        currentEvent.departures.find(
            departure =>
                departure.id === departureId
        );


    if (!departure) return;


    const name =
        document.getElementById(
            `name-${departureId}`
        ).value.trim();


    const status =
        document.getElementById(
            `status-${departureId}`
        ).value;


    if (!name) {

        alert(
            "Merci d'indiquer ton pseudo."
        );

        return;

    }


    // Si le pilote existe déjà,
    // on modifie sa disponibilité.

    const existing =
        departure.availability.find(
            person =>
                person.name.toLowerCase()
                ===
                name.toLowerCase()
        );


    if (existing) {

        existing.status = status;

    } else {

        departure.availability.push({

            name: name,

            status: status

        });

    }


    displayDepartures();

}


// ==========================================
// UTILITAIRES
// ==========================================

function pad(number) {

    return String(number)
        .padStart(2, "0");

}


function formatDate(dateString) {

    const date =
        new Date(
            dateString + "T00:00:00"
        );


    return date.toLocaleDateString(
        "fr-FR",
        {
            weekday: "long",
            day: "2-digit",
            month: "long",
            year: "numeric"
        }
    );

}


function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


// ==========================================
// COMPTEUR
// ==========================================

setInterval(
    updateCountdowns,
    1000
);


// ==========================================
// DEMARRAGE
// ==========================================

showHome();

</script>

</body>
</html>
