<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FMT Endurance</title>

<style>

/* =========================================================
   FMT ENDURANCE
   Design FMT inspiré des lignes graphiques ARC Raiders
========================================================= */

:root {
    --bg: #080a0d;
    --panel: #101419;
    --panel2: #151a20;
    --panel3: #1b2128;

    --border: #293039;

    --text: #f1f3f5;
    --muted: #89939e;

    --green: #9cff00;

    --blue: #36a9ff;
    --yellow: #ffd447;
    --red: #ff4b55;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(
            circle at top,
            #151a20 0%,
            #080a0d 55%
        );

    color: var(--text);

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================================================
   BARRE COULEURS
========================================================= */

body::before {
    content: "";

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 4px;

    background:
        linear-gradient(
            90deg,
            var(--blue) 0%,
            var(--blue) 25%,
            var(--green) 25%,
            var(--green) 50%,
            var(--yellow) 50%,
            var(--yellow) 75%,
            var(--red) 75%,
            var(--red) 100%
        );

    z-index: 100;
}


/* =========================================================
   CONTENEUR
========================================================= */

.container {
    width: 100%;
    max-width: 950px;

    margin: auto;

    padding: 35px 18px 60px;
}


/* =========================================================
   HEADER
========================================================= */

header {
    text-align: center;
    margin-bottom: 35px;
}

.logo {
    font-size: 42px;
    font-weight: 900;

    letter-spacing: 4px;
    text-transform: uppercase;
}

.logo span {
    color: var(--green);
}

.logo-lines {
    display: flex;
    justify-content: center;

    gap: 5px;

    margin-top: 12px;

    transform: skewX(-25deg);
}

.logo-lines div {
    width: 38px;
    height: 4px;
}

.line-blue {
    background: var(--blue);
}

.line-green {
    background: var(--green);
}

.line-yellow {
    background: var(--yellow);
}

.line-red {
    background: var(--red);
}

.subtitle {
    color: var(--muted);

    margin-top: 12px;

    font-size: 13px;

    letter-spacing: 2px;

    text-transform: uppercase;
}


/* =========================================================
   PANELS
========================================================= */

.panel {
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.025),
            transparent
        ),
        var(--panel);

    border: 1px solid var(--border);

    padding: 22px;

    margin-bottom: 20px;

    position: relative;

    overflow: hidden;
}

.panel::before {
    content: "";

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 2px;

    background:
        linear-gradient(
            90deg,
            var(--blue),
            var(--green),
            var(--yellow),
            var(--red)
        );
}


/* =========================================================
   TITRES
========================================================= */

h1,
h2,
h3 {
    margin-top: 0;
}

h1 {
    font-size: 30px;

    text-transform: uppercase;

    letter-spacing: 2px;
}

h2 {
    font-size: 22px;

    letter-spacing: 1px;
}


/* =========================================================
   BOUTONS
========================================================= */

button {
    border: none;

    padding: 12px 18px;

    font-size: 14px;

    font-weight: 800;

    letter-spacing: 0.5px;

    cursor: pointer;

    transition: 0.2s;

    border-radius: 3px;
}

button:hover {
    transform: translateY(-1px);

    filter: brightness(1.08);
}

.btn-primary {
    background: var(--green);

    color: #050505;
}

.btn-secondary {
    background: var(--panel3);

    color: var(--text);

    border: 1px solid var(--border);
}

.actions {
    display: flex;

    gap: 10px;

    flex-wrap: wrap;
}


/* =========================================================
   FORMULAIRES
========================================================= */

.form-group {
    margin-bottom: 18px;
}

label {
    display: block;

    color: var(--muted);

    font-size: 12px;

    margin-bottom: 7px;

    text-transform: uppercase;

    letter-spacing: 0.6px;
}

input {
    width: 100%;

    padding: 12px;

    background: var(--panel2);

    border: 1px solid var(--border);

    color: var(--text);

    border-radius: 3px;

    font-size: 15px;

    outline: none;
}

input:focus {
    border-color: var(--green);
}


/* =========================================================
   EVENEMENTS
========================================================= */

.event-card {
    background: var(--panel);

    border: 1px solid var(--border);

    padding: 20px;

    margin-bottom: 14px;

    cursor: pointer;

    position: relative;

    overflow: hidden;

    transition: 0.2s;
}

.event-card:hover {
    border-color: var(--green);

    transform: translateX(3px);
}

.event-card::before {
    content: "";

    position: absolute;

    left: 0;
    top: 0;

    width: 4px;
    height: 100%;

    background:
        linear-gradient(
            to bottom,
            var(--blue),
            var(--green),
            var(--yellow),
            var(--red)
        );
}

.event-card h3 {
    margin-bottom: 8px;

    padding-left: 8px;
}

.event-info {
    color: var(--muted);

    padding-left: 8px;

    font-size: 14px;
}

.next-race {
    color: var(--green);

    font-weight: bold;

    margin-top: 12px;

    padding-left: 8px;
}


/* =========================================================
   DEPART
========================================================= */

.departure {
    background: var(--panel2);

    border: 1px solid var(--border);

    padding: 18px;

    margin-bottom: 15px;

    position: relative;
}

.departure::before {
    content: "";

    position: absolute;

    left: 0;
    top: 0;

    width: 3px;
    height: 100%;

    background: var(--green);
}

.departure-header {
    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;

    flex-wrap: wrap;

    margin-bottom: 15px;
}

.departure-number {
    font-size: 18px;

    font-weight: bold;
}

.departure-date {
    color: var(--muted);

    margin-top: 5px;
}

.countdown {
    color: var(--green);

    font-weight: bold;

    font-size: 14px;
}


/* =========================================================
   PILOTES
========================================================= */

.pilot {
    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;

    padding: 11px 13px;

    background: #0d1115;

    margin-top: 7px;

    flex-wrap: wrap;
}

.pilot-name {
    font-weight: bold;
}

.pilot-info {
    display: flex;

    gap: 6px;

    flex-wrap: wrap;
}

.badge {
    padding: 5px 8px;

    background: #242b32;

    font-size: 11px;

    font-weight: bold;

    border-radius: 3px;
}


/* =========================================================
   FORMULAIRE DISPONIBILITES
========================================================= */

.availability-form-departure {
    background: var(--panel2);

    border: 1px solid var(--border);

    padding: 16px;

    margin-bottom: 12px;

    position: relative;
}


/* ---------------------------------------------------------
   EN-TETE DEPART
--------------------------------------------------------- */

.availability-departure-header {
    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;

    margin-bottom: 15px;
}

.availability-departure-title {
    font-size: 16px;

    font-weight: bold;
}

.availability-departure-date {
    color: var(--muted);

    font-size: 13px;

    margin-top: 4px;
}


/* ---------------------------------------------------------
   LIGNE DU FORMULAIRE
--------------------------------------------------------- */

.availability-row {
    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        auto;

    gap: 20px;

    align-items: start;
}


/* ---------------------------------------------------------
   DISPONIBILITES
--------------------------------------------------------- */

.availability-section {
    min-width: 0;
}

.availability-buttons {
    display: flex;

    flex-wrap: wrap;

    gap: 6px;
}

.availability-btn {
    padding: 9px 12px;

    background: var(--panel3);

    color: var(--muted);

    border: 1px solid var(--border);

    font-size: 11px;

    border-radius: 3px;
}

.availability-btn:hover {
    color: var(--text);

    border-color: #4a545e;
}

.availability-btn.selected {
    background: var(--green);

    color: #000;

    border-color: var(--green);
}


/* ---------------------------------------------------------
   CATEGORIE A DROITE
--------------------------------------------------------- */

.category-section {
    width: 250px;

    flex-shrink: 0;
}

.category-section label {
    text-align: right;
}

.category-grid {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 5px;
}

.category-card {
    height: 48px;

    background: var(--panel3);

    border: 1px solid var(--border);

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    transition: 0.2s;

    text-align: center;

    border-radius: 3px;
}

.category-card:hover {
    border-color: var(--green);
}

.category-card.selected {
    border: 2px solid var(--green);

    background: #1d2617;

    box-shadow:
        0 0 12px
        rgba(156,255,0,0.10);
}

.category-icon {
    font-size: 13px;

    font-weight: 900;

    margin-bottom: 2px;
}

.category-name {
    font-size: 8px;

    font-weight: bold;

    letter-spacing: 0.3px;
}

.hypercar .category-icon {
    color: var(--blue);
}

.lmp2 .category-icon {
    color: var(--green);
}

.lmp3 .category-icon {
    color: var(--yellow);
}

.gt3 .category-icon {
    color: var(--red);
}


/* =========================================================
   INFO
========================================================= */

.info {
    background: #151b20;

    border-left: 3px solid var(--green);

    padding: 12px;

    margin-bottom: 20px;

    color: var(--muted);

    font-size: 13px;

    line-height: 1.5;
}


/* =========================================================
   CREATION DEPART
========================================================= */

.departure-form {
    background: var(--panel2);

    border: 1px solid var(--border);

    padding: 15px;

    margin-bottom: 12px;
}

.departure-form-title {
    font-weight: bold;

    margin-bottom: 15px;
}

.form-grid {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 12px;
}

.remove-departure {
    margin-top: 10px;

    background: transparent;

    color: var(--red);

    padding: 5px 0;
}


/* =========================================================
   EMPTY
========================================================= */

.empty {
    color: var(--muted);

    text-align: center;

    padding: 30px 10px;
}


/* =========================================================
   UTILITAIRES
========================================================= */

.hidden {
    display: none;
}

.back {
    margin-bottom: 20px;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .container {
        padding:
            25px 12px 50px;
    }

    .logo {
        font-size: 30px;

        letter-spacing: 2px;
    }

    .availability-row {
        grid-template-columns: 1fr;

        gap: 15px;
    }

    .category-section {
        width: 100%;
    }

    .category-section label {
        text-align: left;
    }

    .category-grid {
        grid-template-columns:
            repeat(4, 1fr);
    }

    .availability-buttons {
        display: grid;

        grid-template-columns:
            repeat(2, 1fr);
    }

    .availability-btn {
        width: 100%;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .availability-departure-header {
        align-items: flex-start;
    }
}

</style>
</head>


<body>

<div class="container">


<!-- =====================================================
     HEADER
====================================================== -->

<header>

    <div class="logo">
        FMT <span>ENDURANCE</span>
    </div>

    <div class="logo-lines">

        <div class="line-blue"></div>
        <div class="line-green"></div>
        <div class="line-yellow"></div>
        <div class="line-red"></div>

    </div>

    <div class="subtitle">
        French McFly Team
    </div>

</header>


<!-- =====================================================
     ACCUEIL
====================================================== -->

<div id="homePage">

    <div
        class="actions"
        style="margin-bottom:20px;">

        <button
            class="btn-primary"
            onclick="showCreateEvent()">

            + CRÉER UN ÉVÉNEMENT

        </button>

    </div>


    <div id="eventsList"></div>

</div>


<!-- =====================================================
     CREATION EVENEMENT
====================================================== -->

<div
    id="createPage"
    class="hidden">


    <button
        class="btn-secondary back"
        onclick="showHome()">

        ← Retour

    </button>


    <div class="panel">

        <h2>
            Créer un événement
        </h2>


        <div class="form-group">

            <label>
                Nom de l'événement
            </label>

            <input
                type="text"
                id="eventName"
                placeholder="Ex : Spa-Francorchamps">

        </div>


        <h3>
            Départs
        </h3>


        <div id="departuresForm"></div>


        <button
            class="btn-secondary"
            onclick="addDepartureForm()">

            + Ajouter un départ

        </button>


        <div
            class="actions"
            style="margin-top:20px;">

            <button
                class="btn-primary"
                onclick="createEvent()">

                CRÉER L'ÉVÉNEMENT

            </button>


            <button
                class="btn-secondary"
                onclick="showHome()">

                Annuler

            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     EVENEMENT
====================================================== -->

<div
    id="eventPage"
    class="hidden">


    <button
        class="btn-secondary back"
        onclick="showHome()">

        ← Retour aux événements

    </button>


    <div id="eventContent"></div>

</div>


<!-- =====================================================
     DISPONIBILITES
====================================================== -->

<div
    id="availabilityPage"
    class="hidden">


    <button
        class="btn-secondary back"
        onclick="showEvent(currentEventId)">

        ← Retour à l'événement

    </button>


    <div class="panel">

        <h2>
            Mes disponibilités
        </h2>


        <div class="info">

            Sélectionne une ou plusieurs périodes
            pour chaque départ.

            <br>

            Exemple :
            <strong>Début + Milieu</strong>
            ou
            <strong>Milieu + Fin</strong>.

        </div>


        <div class="form-group">

            <label>
                Ton pseudo
            </label>

            <input
                type="text"
                id="pilotName"
                placeholder="Ex : McFly">

        </div>


        <div id="availabilityForm"></div>


        <div class="actions">

            <button
                class="btn-primary"
                onclick="saveAvailability()">

                ENREGISTRER MES DISPONIBILITÉS

            </button>


            <button
                class="btn-secondary"
                onclick="showEvent(currentEventId)">

                Annuler

            </button>

        </div>

    </div>

</div>


</div>


<script>


/* =========================================================
   DONNEES
========================================================= */

let events =
    JSON.parse(
        localStorage.getItem("fmtEvents")
    ) || [];


let currentEventId = null;

let departureFormCount = 0;


/* =========================================================
   SAUVEGARDE
========================================================= */

function saveEvents() {

    localStorage.setItem(
        "fmtEvents",
        JSON.stringify(events)
    );
}


/* =========================================================
   ID
========================================================= */

function generateId() {

    return Date.now().toString(36)
        +
        Math.random()
        .toString(36)
        .substring(2,7);
}


/* =========================================================
   SECURITE HTML
========================================================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text || "";

    return div.innerHTML;
}


/* =========================================================
   DATES
========================================================= */

function getDepartureDate(departure) {

    return new Date(
        `${departure.date}T${departure.time}`
    );
}


function formatDate(date,time) {

    const d =
        new Date(`${date}T${time}`);

    return d.toLocaleDateString(
        "fr-FR",
        {
            weekday:"long",
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    )
    +
    " à "
    +
    time;
}


/* =========================================================
   PROCHAIN DEPART
========================================================= */

function getNextDeparture(event) {

    const now =
        new Date();

    const upcoming =
        event.departures
        .filter(
            d =>
            getDepartureDate(d)
            >
            now
        )
        .sort(
            (a,b) =>
            getDepartureDate(a)
            -
            getDepartureDate(b)
        );

    return upcoming.length
        ? upcoming[0]
        : null;
}


/* =========================================================
   COUNTDOWN
========================================================= */

function countdownText(departure) {

    const target =
        getDepartureDate(departure);

    const now =
        new Date();

    let diff =
        target - now;


    if(diff <= 0) {

        return "🏁 Départ passé";
    }


    const days =
        Math.floor(
            diff / 86400000
        );

    diff %= 86400000;


    const hours =
        Math.floor(
            diff / 3600000
        );

    diff %= 3600000;


    const minutes =
        Math.floor(
            diff / 60000
        );

    diff %= 60000;


    const seconds =
        Math.floor(
            diff / 1000
        );


    let result = "";


    if(days > 0)
        result += days + "j ";


    if(hours > 0 || days > 0)
        result += hours + "h ";


    if(minutes > 0 || hours > 0 || days > 0)
        result += minutes + "m ";


    result += seconds + "s";


    return result;
}


/* =========================================================
   NAVIGATION
========================================================= */

function hideAllPages() {

    document
        .getElementById("homePage")
        .classList.add("hidden");

    document
        .getElementById("createPage")
        .classList.add("hidden");

    document
        .getElementById("eventPage")
        .classList.add("hidden");

    document
        .getElementById("availabilityPage")
        .classList.add("hidden");
}


function showHome() {

    hideAllPages();

    document
        .getElementById("homePage")
        .classList
        .remove("hidden");

    renderEvents();
}


function showCreateEvent() {

    hideAllPages();

    document
        .getElementById("createPage")
        .classList
        .remove("hidden");


    document
        .getElementById("eventName")
        .value = "";


    document
        .getElementById("departuresForm")
        .innerHTML = "";


    departureFormCount = 0;

    addDepartureForm();
}


function showEvent(id) {

    currentEventId = id;

    hideAllPages();

    document
        .getElementById("eventPage")
        .classList
        .remove("hidden");

    renderEvent(id);
}


/* =========================================================
   ACCUEIL
========================================================= */

function renderEvents() {

    const container =
        document.getElementById(
            "eventsList"
        );


    if(events.length === 0) {

        container.innerHTML = `

            <div class="panel empty">

                Aucun événement pour le moment.

                <br><br>

                Crée ton premier événement !

            </div>

        `;

        return;
    }


    container.innerHTML =
        events.map(event => {

            const next =
                getNextDeparture(event);


            return `

                <div
                    class="event-card"
                    onclick="showEvent('${event.id}')">

                    <h3>
                        ${escapeHTML(event.name)}
                    </h3>

                    <div class="event-info">

                        ${event.departures.length}
                        départ${event.departures.length > 1 ? "s" : ""}

                    </div>


                    ${
                        next
                        ?
                        `

                        <div class="next-race">

                            ⏳ Prochain départ

                            <br>

                            ${formatDate(
                                next.date,
                                next.time
                            )}

                            <br>

                            <span class="countdown">

                                ${countdownText(next)}

                            </span>

                        </div>

                        `
                        :
                        `

                        <div class="next-race">

                            🏁 Événement terminé

                        </div>

                        `
                    }

                </div>

            `;

        }).join("");
}


/* =========================================================
   AJOUT DEPART
========================================================= */

function addDepartureForm() {

    departureFormCount++;


    const id =
        departureFormCount;


    const container =
        document.getElementById(
            "departuresForm"
        );


    const div =
        document.createElement("div");


    div.className =
        "departure-form";


    div.id =
        "departureForm_" + id;


    div.innerHTML = `

        <div class="departure-form-title">

            Départ ${id}

        </div>


        <div class="form-grid">

            <div>

                <label>
                    Date
                </label>

                <input
                    type="date"
                    class="departure-date-input">

            </div>


            <div>

                <label>
                    Heure
                </label>

                <input
                    type="time"
                    class="departure-time-input">

            </div>

        </div>


        ${
            id > 1
            ?
            `

            <button
                type="button"
                class="remove-departure"
                onclick="removeDeparture(${id})">

                ✕ Supprimer ce départ

            </button>

            `
            :
            ""
        }

    `;


    container.appendChild(div);
}


function removeDeparture(id) {

    const element =
        document.getElementById(
            "departureForm_" + id
        );


    if(element) {

        element.remove();
    }
}


/* =========================================================
   CREATION EVENEMENT
========================================================= */

function createEvent() {

    const name =
        document
        .getElementById("eventName")
        .value
        .trim();


    if(!name) {

        alert(
            "Merci de donner un nom à l'événement."
        );

        return;
    }


    const dateInputs =
        document.querySelectorAll(
            ".departure-date-input"
        );


    const timeInputs =
        document.querySelectorAll(
            ".departure-time-input"
        );


    const departures = [];


    for(
        let i = 0;
        i < dateInputs.length;
        i++
    ) {

        if(
            !dateInputs[i].value
            ||
            !timeInputs[i].value
        ) {

            alert(
                "Merci de compléter chaque départ."
            );

            return;
        }


        departures.push({

            id:
                generateId(),

            date:
                dateInputs[i].value,

            time:
                timeInputs[i].value,

            availability:
                []

        });

    }


    departures.sort(
        (a,b) =>
        getDepartureDate(a)
        -
        getDepartureDate(b)
    );


    const event = {

        id:
            generateId(),

        name:
            name,

        departures:
            departures

    };


    events.push(event);

    saveEvents();

    showEvent(event.id);
}


/* =========================================================
   AFFICHAGE EVENEMENT
========================================================= */

function renderEvent(id) {

    const event =
        events.find(
            e => e.id === id
        );


    if(!event) {

        showHome();

        return;
    }


    const next =
        getNextDeparture(event);


    const container =
        document.getElementById(
            "eventContent"
        );


    let html = `

        <div class="panel">

            <h1>
                ${escapeHTML(event.name)}
            </h1>


            ${
                next
                ?
                `

                <div class="next-race">

                    ⏳ PROCHAIN DÉPART

                    <br>

                    ${formatDate(
                        next.date,
                        next.time
                    )}

                    <br>

                    <span class="countdown">

                        ${countdownText(next)}

                    </span>

                </div>

                `
                :
                `

                <div class="next-race">

                    🏁 TOUS LES DÉPARTS SONT TERMINÉS

                </div>

                `
            }


            <div style="margin-top:20px;">

                <button
                    class="btn-primary"
                    onclick="showAvailabilityForm('${event.id}')">

                    + AJOUTER / MODIFIER MES DISPONIBILITÉS

                </button>

            </div>

        </div>

    `;


    html += event.departures
        .map(
            (departure,index) => {


                const pilots =
                    departure.availability
                    ||
                    [];


                return `

                    <div class="departure">


                        <div class="departure-header">

                            <div>

                                <div class="departure-number">

                                    DÉPART ${index + 1}

                                </div>

                                <div class="departure-date">

                                    ${formatDate(
                                        departure.date,
                                        departure.time
                                    )}

                                </div>

                            </div>


                            <div class="countdown">

                                ${
                                    getDepartureDate(departure)
                                    >
                                    new Date()
                                    ?
                                    countdownText(departure)
                                    :
                                    "🏁 Départ passé"
                                }

                            </div>

                        </div>


                        ${
                            pilots.length === 0
                            ?

                            `

                            <div class="empty">

                                Aucun pilote inscrit pour ce départ.

                            </div>

                            `

                            :

                            pilots
                            .map(
                                pilot => `

                                    <div class="pilot">

                                        <div class="pilot-name">

                                            👤
                                            ${escapeHTML(pilot.name)}

                                        </div>


                                        <div class="pilot-info">

                                            ${
                                                pilot.category
                                                ?
                                                `

                                                <span class="badge">

                                                    ${escapeHTML(
                                                        pilot.category
                                                    )}

                                                </span>

                                                `
                                                :
                                                ""
                                            }


                                            <span class="badge">

                                                ${formatStatus(
                                                    pilot.status
                                                )}

                                            </span>

                                        </div>

                                    </div>

                                `
                            )
                            .join("")
                        }


                    </div>

                `;

            }
        )
        .join("");


    container.innerHTML =
        html;
}


/* =========================================================
   FORMULAIRE DISPONIBILITES
========================================================= */

/* =========================================================
   CATEGORIE
========================================================= */

function selectCategory(card) {

    const parent =
        card.closest(
            ".availability-form-departure"
        );


    parent
        .querySelectorAll(
            ".category-card"
        )
        .forEach(
            c =>
            c.classList.remove(
                "selected"
            )
        );


    card.classList.add(
        "selected"
    );


    parent
        .querySelector(
            ".selected-category"
        )
        .value =
        card.dataset.category;
}


/* =========================================================
   DISPONIBILITE MULTIPLE
========================================================= */

function selectAvailability(button) {

    const parent =
        button.closest(
            ".availability-form-departure"
        );


    const status =
        button.dataset.status;


    const buttons =
        parent.querySelectorAll(
            ".availability-btn"
        );


    /*
       Toute la course
       ou Indisponible
       = choix exclusif
    */

    if(
        status === "whole"
        ||
        status === "unavailable"
    ) {

        buttons.forEach(
            b =>
            b.classList.remove(
                "selected"
            )
        );

        button.classList.add(
            "selected"
        );

    }

    /*
       Début / Milieu / Fin
       = multi sélection
    */

    else {

        const unavailable =
            parent.querySelector(
                '[data-status="unavailable"]'
            );

        const whole =
            parent.querySelector(
                '[data-status="whole"]'
            );


        unavailable.classList.remove(
            "selected"
        );

        whole.classList.remove(
            "selected"
        );


        button.classList.toggle(
            "selected"
        );


        /*
           Si aucun choix n'est sélectionné,
           on remet Indisponible.
        */

        const selectedPeriods =
            parent.querySelectorAll(
                '.availability-btn.selected'
            );


        if(
            selectedPeriods.length === 0
        ) {

            unavailable.classList.add(
                "selected"
            );

        }

    }


    updateSelectedStatus(parent);
}


/* =========================================================
   RECUPERE LES DISPONIBILITES
========================================================= */

function updateSelectedStatus(parent) {

    const selected =
        Array.from(
            parent.querySelectorAll(
                ".availability-btn.selected"
            )
        )
        .map(
            button =>
            button.dataset.status
        );


    parent.querySelector(
        ".selected-status"
    ).value =
        selected.join(",");
}


/* =========================================================
   TEXTE DISPONIBILITE
========================================================= */

function formatStatus(status) {

    if(!status)
        return "Indisponible";


    if(status === "unavailable")
        return "Indisponible";


    if(status === "whole")
        return "Toute la course";


    const values =
        status.split(",");


    const labels = [];


    if(values.includes("beginning"))
        labels.push("Début");


    if(values.includes("middle"))
        labels.push("Milieu");


    if(values.includes("end"))
        labels.push("Fin");


    return labels.join(" + ");
}


/* =========================================================
   SAUVEGARDE DISPONIBILITES
========================================================= */

function saveAvailability() {

    const event =
        events.find(
            e => e.id === currentEventId
        );


    if(!event)
        return;


    const name =
        document
        .getElementById(
            "pilotName"
        )
        .value
        .trim();


    if(!name) {

        alert(
            "Merci d'indiquer ton pseudo."
        );

        return;
    }


    const forms =
        document.querySelectorAll(
            "[data-departure-form]"
        );


    forms.forEach(form => {


        const departureId =
            form.dataset.departureForm;


        const departure =
            event.departures.find(
                d =>
                d.id === departureId
            );


        if(!departure)
            return;


        const category =
            form.querySelector(
                ".selected-category"
            ).value;


        const status =
            form.querySelector(
                ".selected-status"
            ).value
            ||
            "unavailable";


        if(!departure.availability) {

            departure.availability =
                [];
        }


        const existing =
            departure.availability.find(
                p =>
                p.name.toLowerCase()
                ===
                name.toLowerCase()
            );


        if(existing) {

            existing.status =
                status;

            existing.category =
                status === "unavailable"
                ?
                ""
                :
                category;

        }
        else {

            departure.availability.push({

                name:
                    name,

                category:
                    status === "unavailable"
                    ?
                    ""
                    :
                    category,

                status:
                    status

            });

        }

    });


    saveEvents();


    alert(
        "Tes disponibilités ont été enregistrées !"
    );


    showEvent(
        currentEventId
    );
}
