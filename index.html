<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FMT Endurance</title>

  <style>

    :root {
      --bg: #090a0b;
      --panel: #111315;
      --panel2: #17191c;
      --panel3: #1d2023;
      --border: #292d31;

      --text: #f2f2f2;
      --muted: #92979c;

      --blue: #2589d8;
      --green: #31b86b;
      --yellow: #e4c341;
      --red: #e34c4c;

      --accent: #7ee38f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        radial-gradient(
          circle at top right,
          rgba(49,184,107,.07),
          transparent 30%
        ),
        var(--bg);

      color: var(--text);

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }


    /* =====================================================
       TOP STRIPES
    ===================================================== */

    .top-stripes {
      display: flex;
      height: 5px;
      width: 100%;
    }

    .top-stripes span {
      flex: 1;
    }

    .stripe-blue {
      background: var(--blue);
    }

    .stripe-green {
      background: var(--green);
    }

    .stripe-yellow {
      background: var(--yellow);
    }

    .stripe-red {
      background: var(--red);
    }


    /* =====================================================
       HEADER
    ===================================================== */

    header {
      position: sticky;
      top: 0;
      z-index: 20;

      background: rgba(9,10,11,.95);

      border-bottom:
        1px solid var(--border);

      backdrop-filter: blur(8px);
    }

    .header-inner {
      max-width: 1050px;
      margin: auto;

      padding:
        17px 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
    }

    .logo {
      font-size: 21px;
      font-weight: 950;

      letter-spacing: 2px;

      line-height: 1;
    }

    .logo span {
      color: var(--green);
    }

    .subtitle {
      margin-top: 5px;

      color: var(--muted);

      font-size: 10px;
      font-weight: 700;

      letter-spacing: 2px;
    }

    button {
      border: 0;
      cursor: pointer;
      font-family: inherit;
    }

    .header-button {
      padding:
        10px 15px;

      background:
        var(--green);

      color:
        #07100a;

      border-radius: 4px;

      font-size: 11px;
      font-weight: 900;
    }

    .header-button:hover {
      filter: brightness(1.1);
    }


    /* =====================================================
       MAIN
    ===================================================== */

    main {
      max-width: 1050px;
      margin: auto;

      padding:
        28px 20px 60px;
    }

    .page-title {
      margin-bottom: 22px;
    }

    .page-title h1 {
      margin: 0;

      font-size: 28px;
      letter-spacing: -1px;
    }

    .page-title p {
      margin:
        7px 0 0;

      color: var(--muted);

      font-size: 13px;
    }


    /* =====================================================
       EVENTS
    ===================================================== */

    .events {
      display: grid;
      gap: 12px;
    }

    .event-card {
      position: relative;
      overflow: hidden;

      padding:
        17px 18px;

      background: var(--panel);

      border:
        1px solid var(--border);

      border-left:
        4px solid var(--green);

      border-radius: 6px;

      cursor: pointer;

      transition: .15s;
    }

    .event-card:hover {
      background: var(--panel2);
      transform: translateX(2px);
    }

    .event-top {
      display: flex;

      justify-content:
        space-between;

      gap: 15px;
    }

    .event-name {
      font-size: 18px;
      font-weight: 900;
    }

    .event-location {
      margin-top: 4px;

      color: var(--muted);

      font-size: 12px;
    }

    .event-date {
      text-align: right;

      color: var(--muted);

      font-size: 11px;
    }

    .event-date strong {
      display: block;

      color: var(--text);

      font-size: 13px;
    }

    .event-countdown {
      margin-top: 14px;

      padding-top: 11px;

      border-top:
        1px solid var(--border);

      color: var(--green);

      font-size: 11px;
      font-weight: 800;
    }


    /* =====================================================
       BACK BUTTON
    ===================================================== */

    .back-button {
      padding: 0;
      margin-bottom: 20px;

      background: transparent;

      color: var(--muted);

      font-size: 12px;
      font-weight: 700;
    }

    .back-button:hover {
      color: white;
    }


    /* =====================================================
       EVENT HEADER
    ===================================================== */

    .event-header {
      position: relative;
      overflow: hidden;

      margin-bottom: 18px;
      padding: 20px;

      background: var(--panel);

      border:
        1px solid var(--border);

      border-radius: 7px;
    }

    .event-header::before {
      content: "";

      position: absolute;

      left: 0;
      top: 0;
      bottom: 0;

      width: 4px;

      background:
        linear-gradient(
          to bottom,
          var(--blue) 0 25%,
          var(--green) 25% 50%,
          var(--yellow) 50% 75%,
          var(--red) 75% 100%
        );
    }

    .event-header h1 {
      margin:
        0 0 6px;

      font-size: 27px;
    }

    .event-header p {
      margin: 0;

      color: var(--muted);

      font-size: 13px;
    }


    /* =====================================================
       PILOT NAME GLOBAL
    ===================================================== */

    .pilot-name-panel {
      margin-bottom: 18px;

      padding: 15px 16px;

      background:
        var(--panel);

      border:
        1px solid var(--border);

      border-left:
        4px solid var(--green);

      border-radius: 6px;
    }

    .pilot-name-header {
      display: flex;

      justify-content:
        space-between;

      align-items: center;

      gap: 10px;

      margin-bottom: 8px;
    }

    .pilot-name-header strong {
      font-size: 11px;

      letter-spacing: 1px;

      text-transform:
        uppercase;
    }

    .pilot-name-info {
      color: var(--muted);

      font-size: 10px;
    }

    .pilot-name-row {
      display: flex;

      gap: 8px;
    }

    .pilot-name-row input {
      flex: 1;
    }

    .pilot-name-save {
      height: 34px;

      padding:
        0 14px;

      background:
        var(--green);

      color:
        #07100a;

      border-radius: 4px;

      font-size: 10px;
      font-weight: 950;
    }


    /* =====================================================
       RECAP SECTION
    ===================================================== */

    .recap-section {
      margin: 10px 0 18px;
      padding: 10px 14px;
      background: var(--panel2);
      border-radius: 4px;
      border-left: 3px solid var(--blue);
      font-size: 11px;
    }

    .recap-section strong {
      color: var(--muted);
    }

    .recap-section span {
      color: var(--text);
      margin-left: 8px;
    }


    /* =====================================================
       DEPARTURES
    ===================================================== */

    .departures {
      display: flex;

      flex-direction:
        column;

      gap: 14px;
    }

    .departure {
      overflow: hidden;

      background:
        var(--panel);

      border:
        1px solid var(--border);

      border-radius: 7px;

      transition: opacity 0.3s, filter 0.3s;
    }

    .departure.past {
      opacity: 0.7;
      filter: grayscale(0.3);
    }

    .departure-header {
      display: flex;

      justify-content:
        space-between;

      align-items: center;

      gap: 15px;

      padding:
        14px 16px;

      background:
        var(--panel2);

      border-bottom:
        1px solid var(--border);
    }

    .departure-date {
      font-size: 13px;

      font-weight: 900;

      text-transform:
        uppercase;
    }

    .departure-time {
      margin-left: 7px;

      color:
        var(--green);
    }

    .departure-countdown {
      color:
        var(--muted);

      font-size: 11px;

      text-align: right;

      white-space:
        nowrap;
    }

    .departure-countdown.upcoming {
      color:
        var(--green);

      font-weight: 800;
    }

    .departure-countdown.finished {
      color:
        var(--muted);
    }


    /* =====================================================
       PILOT LIST
    ===================================================== */

    .pilot-section {
      padding:
        12px 14px 4px;
    }

    .section-label {
      margin-bottom: 8px;

      color:
        var(--muted);

      font-size: 9px;

      font-weight: 900;

      letter-spacing: 1.5px;

      text-transform:
        uppercase;
    }

    .section-label .count {
      color: var(--green);
      font-size: 10px;
      margin-left: 5px;
    }

    .pilot-list {
      display: flex;

      flex-direction:
        column;

      gap: 4px;
    }

    .pilot-row {
      display: grid;

      grid-template-columns:
        minmax(100px, 1fr)
        48px
        78px
        30px;

      align-items:
        center;

      gap: 8px;

      min-height:
        34px;

      padding:
        5px 7px;

      background:
        var(--panel2);

      border:
        1px solid rgba(255,255,255,.035);

      border-radius: 4px;
    }

    .pilot-left {
      min-width: 0;

      display: flex;

      align-items:
        center;

      gap: 7px;
    }

    .pilot-name {
      overflow: hidden;

      text-overflow:
        ellipsis;

      white-space:
        nowrap;

      font-size: 12px;

      font-weight: 800;
    }


    /* =====================================================
       CATEGORY BADGES
    ===================================================== */

    .category-badge {
      display: inline-flex;

      align-items:
        center;

      justify-content:
        center;

      min-width:
        48px;

      padding:
        3px 6px;

      border-radius:
        3px;

      color:
        #101010;

      font-size:
        8px;

      font-weight:
        950;
    }

    .cat-Hypercar {
      background:
        var(--blue);
    }

    .cat-LMP2 {
      background:
        var(--green);
    }

    .cat-LMP3 {
      background:
        var(--yellow);
    }

    .cat-GT3 {
      background:
        var(--red);

      color:
        white;
    }


    /* =====================================================
       AVAILABILITY BAR
    ===================================================== */

    .availability-bar {
      display: flex;

      width:
        76px;

      height:
        9px;

      gap:
        2px;

      overflow:
        hidden;

      border-radius:
        2px;
    }

    .availability-segment {
      flex: 1;

      background:
        #292d31;
    }

    .availability-segment.beginning.active {
      background:
        var(--green);
    }

    .availability-segment.middle.active {
      background:
        var(--yellow);
    }

    .availability-segment.end.active {
      background:
        var(--red);
    }

    .edit-button {
      width:
        28px;

      height:
        25px;

      border-radius:
        3px;

      background:
        #25282b;

      color:
        var(--muted);

      font-size:
        11px;
    }

    .edit-button:hover {
      background:
        #303438;

      color:
        white;
    }

    .empty {
      padding:
        9px 5px 11px;

      color:
        #676d72;

      font-size:
        11px;

      font-style:
        italic;
    }


    /* =====================================================
       FORM
    ===================================================== */

    .form-section {
      margin-top:
        9px;

      padding:
        13px 14px 15px;

      border-top:
        1px solid var(--border);
    }

    .form-title {
      display: flex;

      align-items:
        center;

      justify-content:
        space-between;

      margin-bottom:
        11px;
    }

    .form-title strong {
      font-size:
        11px;

      letter-spacing:
        1px;

      text-transform:
        uppercase;
    }

    .editing-label {
      display: none;

      color:
        var(--green);

      font-size:
        9px;

      font-weight:
        900;
    }

    .form-section.editing
    .editing-label {
      display:
        block;
    }

    .form-grid {
      display: grid;

      grid-template-columns:
        1.5fr
        1fr
        1.2fr
        auto;

      gap:
        8px;

      align-items:
        end;
    }

    .field {
      display: flex;

      flex-direction:
        column;

      gap:
        5px;
    }

    .field label {
      color:
        var(--muted);

      font-size:
        9px;

      font-weight:
        800;

      letter-spacing:
        .6px;

      text-transform:
        uppercase;
    }

    input {
      width:
        100%;

      height:
        34px;

      padding:
        0 10px;

      background:
        #0d0f10;

      border:
        1px solid var(--border);

      border-radius:
        4px;

      outline:
        none;

      color:
        white;

      font-family:
        inherit;

      font-size:
        12px;
    }

    input:focus {
      border-color:
        var(--green);
    }


    /* =====================================================
       AVAILABILITY BUTTONS
    ===================================================== */

    .availability-buttons {
      display: flex;

      gap:
        3px;

      height:
        34px;
    }

    .availability-button {
      flex:
        1;

      border:
        1px solid var(--border);

      background:
        #0d0f10;

      color:
        #777d82;

      border-radius:
        3px;

      font-size:
        8px;

      font-weight:
        900;

      transition:
        .12s;
    }

    .availability-button:hover {
      background:
        #202428;

      color:
        white;
    }

    .availability-button.active.beginning {
      background:
        var(--green);

      border-color:
        var(--green);

      color:
        #07100a;
    }

    .availability-button.active.middle {
      background:
        var(--yellow);

      border-color:
        var(--yellow);

      color:
        #171200;
    }

    .availability-button.active.end {
      background:
        var(--red);

      border-color:
        var(--red);

      color:
        white;
    }

    .availability-button.active.whole {
      background:
        linear-gradient(
          90deg,
          var(--green) 0 33%,
          var(--yellow) 33% 66%,
          var(--red) 66% 100%
        );

      border-color:
        transparent;

      color:
        #111;
    }

    .availability-button.active.unavailable {
      background:
        #3a3d41;

      border-color:
        #555a5f;

      color:
        white;
    }


    /* =====================================================
       CATEGORY BUTTONS
    ===================================================== */

    .category-buttons {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap:
        3px;

      height:
        34px;
    }

    .category-button {
      background:
        #0d0f10;

      border:
        1px solid var(--border);

      border-radius:
        3px;

      color:
        #777d82;

      font-size:
        8px;

      font-weight:
        950;
    }

    .category-button:hover {
      color:
        white;
    }

    .category-button.active.hyper {
      background:
        var(--blue);

      border-color:
        var(--blue);

      color:
        #071017;
    }

    .category-button.active.lmp2 {
      background:
        var(--green);

      border-color:
        var(--green);

      color:
        #07100a;
    }

    .category-button.active.lmp3 {
      background:
        var(--yellow);

      border-color:
        var(--yellow);

      color:
        #151200;
    }

    .category-button.active.gt3 {
      background:
        var(--red);

      border-color:
        var(--red);

      color:
        white;
    }


    /* =====================================================
       SAVE BUTTON
    ===================================================== */

    .save-button {
      height:
        34px;

      padding:
        0 14px;

      background:
        var(--green);

      color:
        #07100a;

      border-radius:
        3px;

      font-size:
        9px;

      font-weight:
        950;

      white-space:
        nowrap;

      transition: background 0.3s, color 0.3s;
    }

    .save-button:hover {
      filter:
        brightness(1.1);
    }

    .save-button.saved {
      background: var(--blue);
    }


    /* =====================================================
       LEGEND
    ===================================================== */

    .legend {
      display: flex;

      align-items:
        center;

      justify-content:
        flex-end;

      gap:
        10px;

      padding:
        0 14px 12px;

      color:
        var(--muted);

      font-size:
        9px;
    }

    .legend-item {
      display: flex;

      align-items:
        center;

      gap:
        4px;
    }

    .legend-color {
      width:
        12px;

      height:
        6px;

      border-radius:
        1px;
    }

    .legend-green {
      background:
        var(--green);
    }

    .legend-yellow {
      background:
        var(--yellow);
    }

    .legend-red {
      background:
        var(--red);
    }

    .legend-whole {
      width:
        18px;

      height:
        6px;

      background:
        linear-gradient(
          90deg,
          var(--green) 0 33%,
          var(--yellow) 33% 66%,
          var(--red) 66% 100%
        );
    }


    /* =====================================================
       CREATE EVENT
    ===================================================== */

    .create-panel {
      max-width:
        700px;

      margin:
        auto;

      padding:
        22px;

      background:
        var(--panel);

      border:
        1px solid var(--border);

      border-radius:
        7px;
    }

    .create-panel h2 {
      margin:
        0 0 18px;

      font-size:
        20px;
    }

    .create-grid {
      display:
        grid;

      gap:
        12px;
    }

    .create-departure {
      display:
        grid;

      grid-template-columns:
        1fr 150px auto;

      gap:
        7px;

      align-items:
        end;

      padding:
        10px;

      background:
        var(--panel2);

      border:
        1px solid var(--border);

      border-radius:
        5px;
    }

    .small-button {
      height:
        34px;

      padding:
        0 10px;

      border-radius:
        3px;

      background:
        #292d31;

      color:
        white;

      font-size:
        10px;

      font-weight:
        800;
    }

    .small-button:hover {
      background:
        #353a3e;
    }

    .create-submit {
      width:
        100%;

      height:
        40px;

      margin-top:
        10px;

      background:
        var(--green);

      color:
        #07100a;

      font-weight:
        950;

      border-radius:
        4px;
    }


    /* =====================================================
       NO EVENTS
    ===================================================== */

    .no-events {
      padding:
        35px;

      background:
        var(--panel);

      border:
        1px dashed var(--border);

      border-radius:
        6px;

      color:
        var(--muted);

      font-size:
        13px;

      text-align:
        center;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 760px) {

      .header-inner {
        padding:
          14px;
      }

      main {
        padding:
          20px 12px 40px;
      }

      .page-title h1 {
        font-size:
          24px;
      }

      .departure-header {
        align-items:
          flex-start;
      }

      .departure-countdown {
        font-size:
          9px;
      }

      .pilot-row {
        grid-template-columns:
          minmax(70px, 1fr)
          40px
          55px
          28px;

        gap:
          4px;

        padding:
          4px 5px;
      }

      .pilot-name {
        font-size:
          11px;
      }

      .availability-bar {
        width:
          55px;
      }

      .category-badge {
        min-width:
          40px;
        font-size:
          7px;
        padding:
          2px 4px;
      }

      .form-grid {
        grid-template-columns:
          1fr;
      }

      .availability-buttons {
        flex-wrap: wrap;
        height: auto;
        gap: 4px;
      }

      .availability-button {
        flex: 0 0 calc(33.33% - 3px);
        height: 30px;
        font-size: 7px;
      }

      .category-buttons {
        height: 30px;
      }

      .category-button {
        font-size: 7px;
      }

      .save-button {
        width:
          100%;
      }

      .create-departure {
        grid-template-columns:
          1fr;
      }

      .legend {
        justify-content:
          flex-start;

        flex-wrap:
          wrap;
      }

      .pilot-name-row {
        flex-direction:
          column;
      }

      .pilot-name-save {
        width:
          100%;
      }

      .event-card {
        padding: 14px 12px;
      }

      .event-name {
        font-size: 16px;
      }

      .recap-section {
        font-size: 10px;
        padding: 8px 10px;
      }

      .recap-section span {
        display: block;
        margin-left: 0;
        margin-top: 4px;
      }
    }

  </style>
</head>


<body>


  <!-- =====================================================
       TOP STRIPES
  ====================================================== -->

  <div class="top-stripes">

    <span class="stripe-blue"></span>

    <span class="stripe-green"></span>

    <span class="stripe-yellow"></span>

    <span class="stripe-red"></span>

  </div>


  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header>

    <div class="header-inner">

      <div>

        <div class="logo">
          FMT <span>ENDURANCE</span>
        </div>

        <div class="subtitle">
          FRENCH MCFLY TEAM
        </div>

      </div>


      <button
        class="header-button"
        onclick="showCreateEvent()"
      >
        + NOUVEL ÉVÉNEMENT
      </button>

    </div>

  </header>


  <main id="app"></main>


  <script>


    /* =====================================================
       DATA
    ===================================================== */

    let events =
      JSON.parse(
        localStorage.getItem(
          "fmt_endurance_events"
        ) || "[]"
      );


    let currentEventId = null;

    let editingPilot = null;

    let departureFieldCount = 0;


    /*
     * Form state for every departure.
     */

    const formState = {};


    /* =====================================================
       SAVE
    ===================================================== */

    function saveEvents() {

      localStorage.setItem(
        "fmt_endurance_events",
        JSON.stringify(events)
      );

    }


    /* =====================================================
       GLOBAL PILOT NAME
    ===================================================== */

    function getPilotName() {

      return localStorage.getItem(
        "fmt_pilot_name"
      ) || "";

    }


    function setPilotName() {

      const input =
        document.getElementById(
          "global-pilot-name"
        );

      if (!input) return;


      const name =
        input.value.trim();


      if (!name) {

        alert(
          "Entre ton pseudo."
        );

        return;
      }


      localStorage.setItem(
        "fmt_pilot_name",
        name
      );


      /*
       * Refresh event so all forms
       * use the new name.
       */

      renderEvent();

    }


    /* =====================================================
       HELPERS
    ===================================================== */

    function escapeHtml(value) {

      return String(value)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    function escapeJs(value) {

      return String(value)
        .replace(
          /\\/g,
          "\\\\"
        )
        .replace(
          /'/g,
          "\\'"
        );

    }


    function generateId() {

      return Math.random()
        .toString(36)
        .substring(
          2,
          9
        );

    }


    function getCategoryClass(
      category
    ) {

      if (
        category ===
        "Hypercar"
      ) {
        return "cat-Hypercar";
      }

      if (
        category ===
        "LMP2"
      ) {
        return "cat-LMP2";
      }

      if (
        category ===
        "LMP3"
      ) {
        return "cat-LMP3";
      }

      if (
        category ===
        "GT3"
      ) {
        return "cat-GT3";
      }

      return "";

    }


    function getCategoryButtonClass(
      category
    ) {

      if (
        category ===
        "Hypercar"
      ) {
        return "hyper";
      }

      if (
        category ===
        "LMP2"
      ) {
        return "lmp2";
      }

      if (
        category ===
        "LMP3"
      ) {
        return "lmp3";
      }

      if (
        category ===
        "GT3"
      ) {
        return "gt3";
      }

      return "";

    }


    function formatDate(
      date,
      time
    ) {

      const d =
        new Date(
          `${date}T${time}`
        );


      return d.toLocaleDateString(
        "fr-FR",
        {
          weekday: "short",
          day: "2-digit",
          month: "short"
        }
      );

    }


    function formatLongDate(
      date
    ) {

      const d =
        new Date(
          `${date}T00:00`
        );


      return d.toLocaleDateString(
        "fr-FR",
        {
          weekday: "long",
          day: "2-digit",
          month: "long",
          year: "numeric"
        }
      );

    }


    function getDepartureTimestamp(
      departure
    ) {

      return new Date(
        `${departure.date}T${departure.time}`
      ).getTime();

    }


    /* =====================================================
       COUNTDOWN
    ===================================================== */

    function formatCountdown(
      target
    ) {

      const now =
        Date.now();


      const diff =
        target - now;


      if (
        diff <= 0
      ) {
        return null;
      }


      const totalSeconds =
        Math.floor(
          diff / 1000
        );


      const days =
        Math.floor(
          totalSeconds / 86400
        );


      const hours =
        Math.floor(
          (totalSeconds % 86400) /
          3600
        );


      const minutes =
        Math.floor(
          (totalSeconds % 3600) /
          60
        );


      const seconds =
        totalSeconds % 60;


      if (
        days > 0
      ) {

        return `${days}j ${hours}h ${minutes}m`;

      }


      if (
        hours > 0
      ) {

        return `${hours}h ${minutes}m ${seconds}s`;

      }


      return `${minutes}m ${seconds}s`;

    }


    function updateCountdowns() {


      document
        .querySelectorAll(
          "[data-countdown]"
        )
        .forEach(
          element => {

            const target =
              Number(
                element.dataset.countdown
              );


            const countdown =
              formatCountdown(
                target
              );


            if (!countdown) {

              element.textContent =
                "🏁 Départ passé";

              element.classList.remove(
                "upcoming"
              );

              element.classList.add(
                "finished"
              );

            } else {

              element.textContent =
                `⏱ ${countdown}`;

              element.classList.add(
                "upcoming"
              );

              element.classList.remove(
                "finished"
              );

            }

          }
        );


      document
        .querySelectorAll(
          "[data-event-countdown]"
        )
        .forEach(
          element => {

            const target =
              Number(
                element.dataset.eventCountdown
              );


            const countdown =
              formatCountdown(
                target
              );


            if (!countdown) {

              element.textContent =
                "🏁 Événement terminé";

            } else {

              element.textContent =
                `⏱ Prochain départ dans ${countdown}`;

            }

          }
        );

    }


    /* =====================================================
       HOME
    ===================================================== */

    function renderHome() {

      currentEventId =
        null;

      editingPilot =
        null;


      // Supprimer automatiquement les événements terminés
      const now = Date.now();
      events = events.filter(event => {
        // Garder l'événement s'il a au moins un départ futur
        return event.departures.some(departure => {
          return getDepartureTimestamp(departure) > now;
        });
      });
      saveEvents();


      let html = `

        <div class="page-title">

          <h1>
            ÉVÉNEMENTS
          </h1>

          <p>
            Gestion des courses d'endurance FMT
          </p>

        </div>

      `;


      if (
        events.length === 0
      ) {

        html += `

          <div class="no-events">

            Aucun événement créé.

            <br><br>

            Clique sur
            <strong>
              + NOUVEL ÉVÉNEMENT
            </strong>
            pour commencer.

          </div>

        `;

      } else {


        html += `
          <div class="events">
        `;


        events.forEach(
          event => {


            const upcoming =
              event.departures
                .map(
                  departure => ({

                    departure,

                    timestamp:
                      getDepartureTimestamp(
                        departure
                      )

                  })
                )
                .filter(
                  item =>
                    item.timestamp >
                    Date.now()
                )
                .sort(
                  (a,b) =>
                    a.timestamp -
                    b.timestamp
                )[0];


            html += `

              <div
                class="event-card"
                onclick="
                  openEvent(
                    '${event.id}'
                  )
                "
              >

                <div class="event-top">

                  <div>

                    <div class="event-name">

                      ${escapeHtml(
                        event.name
                      )}

                    </div>


                    ${
                      event.location
                      ?
                      `
                        <div class="event-location">

                          📍
                          ${escapeHtml(
                            event.location
                          )}

                        </div>
                      `
                      :
                      ""
                    }

                  </div>


                  ${
                    upcoming
                    ?
                    `
                      <div class="event-date">

                        <strong>

                          ${formatDate(
                            upcoming.departure.date,
                            upcoming.departure.time
                          )}

                        </strong>

                        ${
                          upcoming.departure.time
                        }

                      </div>
                    `
                    :
                    ""
                  }

                </div>


                <div
                  class="event-countdown"
                  data-event-countdown="${
                    upcoming
                    ?
                    upcoming.timestamp
                    :
                    0
                  }"
                >

                  ${
                    upcoming
                    ?
                    `⏱ Prochain départ dans ${formatCountdown(
                      upcoming.timestamp
                    )}`
                    :
                    "🏁 Événement terminé"
                  }

                </div>

              </div>

            `;

          }
        );


        html += `
          </div>
        `;

      }


      document.getElementById(
        "app"
      ).innerHTML =
        html;


      updateCountdowns();

    }


    /* =====================================================
       OPEN EVENT
    ===================================================== */

    function openEvent(
      id
    ) {

      currentEventId =
        id;

      editingPilot =
        null;


      Object.keys(
        formState
      ).forEach(
        key =>
          delete formState[key]
      );


      renderEvent();

    }


    /* =====================================================
       RENDER EVENT
    ===================================================== */

    function renderEvent() {


      const event =
        events.find(
          e =>
            e.id ===
            currentEventId
        );


      if (!event) {

        renderHome();

        return;
      }


      const pilotName =
        getPilotName();


      let html = `

        <button
          class="back-button"
          onclick="renderHome()"
        >
          ← RETOUR AUX ÉVÉNEMENTS
        </button>


        <div class="event-header">

          <h1>

            ${escapeHtml(
              event.name
            )}

          </h1>


          ${
            event.location
            ?
            `
              <p>

                📍
                ${escapeHtml(
                  event.location
                )}

              </p>
            `
            :
            ""
          }

        </div>


        <!-- GLOBAL PILOT NAME -->

        <div class="pilot-name-panel">

          <div class="pilot-name-header">

            <strong>
              👤 MON PSEUDO
            </strong>

            <span class="pilot-name-info">
              Saisi une seule fois pour tout l'événement
            </span>

          </div>


          <div class="pilot-name-row">

            <input
              id="global-pilot-name"
              type="text"
              value="${escapeHtml(
                pilotName
              )}"
              placeholder="Ex : McFly"
            >


            <button
              class="pilot-name-save"
              onclick="setPilotName()"
            >
              ENREGISTRER
            </button>

          </div>

        </div>

      `;


      // Récapitulatif des disponibilités du pilote
      if (pilotName) {
        const summary = getPilotSummary(pilotName, event);
        if (summary) {
          html += `
            <div class="recap-section">
              <strong>📋 RÉCAPITULATIF :</strong>
              <span>${summary}</span>
            </div>
          `;
        }
      }


      html += `
        <div class="departures">
      `;


      event.departures.forEach(
        (
          departure,
          index
        ) => {

          html +=
            renderDeparture(
              event,
              departure,
              index
            );

        }
      );


      html += `
        </div>
      `;


      document.getElementById(
        "app"
      ).innerHTML =
        html;


      updateCountdowns();

    }


    /* =====================================================
       GET PILOT SUMMARY
    ===================================================== */

    function getPilotSummary(pilotName, event) {
      if (!event || !pilotName) return null;

      const summary = [];
      event.departures.forEach(dep => {
        const pilot = dep.availability.find(p =>
          p.name.toLowerCase() === pilotName.toLowerCase()
        );
        if (pilot) {
          const label = getStatusLabel(pilot.status);
          const dateStr = formatDate(dep.date, dep.time);
          summary.push(`${dateStr} ${dep.time}: ${label}`);
        }
      });

      return summary.length ? summary.join(" | ") : null;
    }


    /* =====================================================
       DEPARTURE
    ===================================================== */

    function renderDeparture(
      event,
      departure,
      departureIndex
    ) {


      const timestamp =
        getDepartureTimestamp(
          departure
        );

      const isPast = timestamp < Date.now();


      const availablePilots =
        departure.availability
          .filter(
            pilot =>
              pilot.status !==
              "unavailable"
          );


      let html = `

        <div class="departure ${isPast ? 'past' : ''}">


          <div class="departure-header">

            <div class="departure-date">

              ${escapeHtml(
                formatLongDate(
                  departure.date
                )
              )}

              <span class="departure-time">

                ${escapeHtml(
                  departure.time
                )}

              </span>

            </div>


            <div
              class="departure-countdown"
              data-countdown="${timestamp}"
            >

              ${
                formatCountdown(
                  timestamp
                )
                ?
                `⏱ ${formatCountdown(
                  timestamp
                )}`
                :
                "🏁 Départ passé"
              }

            </div>

          </div>


          <div class="pilot-section">

            <div class="section-label">

              PILOTES DISPONIBLES
              <span class="count">(${availablePilots.length})</span>

            </div>

      `;


      if (
        availablePilots.length === 0
      ) {

        html += `

          <div class="empty">

            Aucun pilote disponible pour ce départ.

          </div>

        `;

      } else {


        html += `
          <div class="pilot-list">
        `;


        availablePilots.forEach(
          pilot => {

            html +=
              renderPilotRow(
                pilot
              );

          }
        );


        html += `
          </div>
        `;

      }


      html += `

          </div>


          ${renderForm(
            event,
            departure,
            departureIndex
          )}


          <div class="legend">

            <div class="legend-item">

              <span
                class="legend-color legend-green"
              ></span>

              Début

            </div>


            <div class="legend-item">

              <span
                class="legend-color legend-yellow"
              ></span>

              Milieu

            </div>


            <div class="legend-item">

              <span
                class="legend-color legend-red"
              ></span>

              Fin

            </div>


            <div class="legend-item">

              <span
                class="legend-whole"
              ></span>

              Toute la course

            </div>

          </div>


        </div>

      `;


      return html;

    }


    /* =====================================================
       PILOT ROW
    ===================================================== */

    function renderPilotRow(
      pilot
    ) {


      const status =
        pilot.status ||
        "";


      const beginning =
        status.includes(
          "beginning"
        ) ||
        status ===
          "whole";


      const middle =
        status.includes(
          "middle"
        ) ||
        status ===
          "whole";


      const end =
        status.includes(
          "end"
        ) ||
        status ===
          "whole";


      return `

        <div class="pilot-row">


          <div class="pilot-left">

            <div class="pilot-name">

              ${escapeHtml(
                pilot.name
              )}

            </div>

          </div>


          <span
            class="category-badge ${
              getCategoryClass(
                pilot.category
              )
            }"
          >

            ${
              pilot.category ===
              "Hypercar"
              ?
              "HYPER"
              :
              escapeHtml(
                pilot.category ||
                "—"
              )
            }

          </span>


          <div
            class="availability-bar"
            title="${escapeHtml(
              getStatusLabel(
                status
              )
            )}"
          >

            <span
              class="
                availability-segment
                beginning
                ${
                  beginning
                  ?
                  "active"
                  :
                  ""
                }
              "
            ></span>


            <span
              class="
                availability-segment
                middle
                ${
                  middle
                  ?
                  "active"
                  :
                  ""
                }
              "
            ></span>


            <span
              class="
                availability-segment
                end
                ${
                  end
                  ?
                  "active"
                  :
                  ""
                }
              "
            ></span>

          </div>


          <button
            class="edit-button"
            onclick="
              editPilot(
                '${escapeHtml(
                  pilot.name
                )}'
              )
            "
            title="Modifier"
          >
            ✎
          </button>

        </div>

      `;

    }


    /* =====================================================
       STATUS LABEL
    ===================================================== */

    function getStatusLabel(
      status
    ) {


      if (
        status ===
        "whole"
      ) {

        return "Toute la course";

      }


      if (
        status ===
        "unavailable"
      ) {

        return "Indisponible";

      }


      const parts = [];


      if (
        status.includes(
          "beginning"
        )
      ) {

        parts.push(
          "Début"
        );

      }


      if (
        status.includes(
          "middle"
        )
      ) {

        parts.push(
          "Milieu"
        );

      }


      if (
        status.includes(
          "end"
        )
      ) {

        parts.push(
          "Fin"
        );

      }


      return parts.join(
        " + "
      );

    }


    /* =====================================================
       FORM
    ===================================================== */

    function renderForm(
      event,
      departure,
      departureIndex
    ) {


      const globalName =
        getPilotName();


      let existing = null;


      if (
        editingPilot
      ) {

        existing =
          departure.availability.find(
            pilot =>
              pilot.name.toLowerCase() ===
              editingPilot.toLowerCase()
          );

      }


      const state =
        formState[
          departure.id
        ] || {};


      const status =
        state.status ??
        existing?.status ??
        "";


      const category =
        state.category ??
        existing?.category ??
        "";


      const beginning =
        status.includes(
          "beginning"
        );


      const middle =
        status.includes(
          "middle"
        );


      const end =
        status.includes(
          "end"
        );


      const whole =
        status ===
        "whole";


      const unavailable =
        status ===
        "unavailable";


      return `

        <div
          class="form-section ${
            existing
            ?
            "editing"
            :
            ""
          }"
        >


          <div class="form-title">

            <strong>

              ${
                existing
                ?
                "✎ MODIFIER MA DISPONIBILITÉ"
                :
                "+ ENREGISTRER MA DISPONIBILITÉ"
              }

            </strong>


            <span
              class="editing-label"
            >
              MODIFICATION
            </span>

          </div>


          <div class="form-grid">


            <!-- PSEUDO -->

            <div class="field">

              <label>
                Pilote
              </label>

              <input
                id="name-${departure.id}"
                type="text"
                value="${escapeHtml(
                  existing
                  ?
                  existing.name
                  :
                  globalName
                )}"
                readonly
              >

            </div>


            <!-- AVAILABILITY -->

            <div class="field">

              <label>
                Disponibilité
              </label>


              <div
                class="availability-buttons"
                id="availability-${departure.id}"
              >


                <button
                  type="button"
                  class="
                    availability-button
                    beginning
                    ${
                      beginning
                      ?
                      "active"
                      :
                      ""
                    }
                  "
                  onclick="
                    toggleAvailability(
                      '${departure.id}',
                      'beginning'
                    )
                  "
                >
                  DÉBUT
                </button>


                <button
                  type="button"
                  class="
                    availability-button
                    middle
                    ${
                      middle
                      ?
                      "active"
                      :
                      ""
                    }
                  "
                  onclick="
                    toggleAvailability(
                      '${departure.id}',
                      'middle'
                    )
                  "
                >
                  MILIEU
                </button>


                <button
                  type="button"
                  class="
                    availability-button
                    end
                    ${
                      end
                      ?
                      "active"
                      :
                      ""
                    }
                  "
                  onclick="
                    toggleAvailability(
                      '${departure.id}',
                      'end'
                    )
                  "
                >
                  FIN
                </button>


                <button
                  type="button"
                  class="
                    availability-button
                    whole
                    ${
                      whole
                      ?
                      "active"
                      :
                      ""
                    }
                  "
                  onclick="
                    setAvailability(
                      '${departure.id}',
                      'whole'
                    )
                  "
                >
                  TOUT
                </button>


                <button
                  type="button"
                  class="
                    availability-button
                    unavailable
                    ${
                      unavailable
                      ?
                      "active"
                      :
                      ""
                    }
                  "
                  onclick="
                    setAvailability(
                      '${departure.id}',
                      'unavailable'
                    )
                  "
                >
                  ABSENT
                </button>


              </div>

            </div>


            <!-- CATEGORY -->

            <div class="field">

              <label>
                Catégorie
              </label>


              <div
                class="category-buttons"
              >


                ${renderCategoryButton(
                  departure.id,
                  "Hypercar",
                  category
                )}


                ${renderCategoryButton(
                  departure.id,
                  "LMP2",
                  category
                )}


                ${renderCategoryButton(
                  departure.id,
                  "LMP3",
                  category
                )}


                ${renderCategoryButton(
                  departure.id,
                  "GT3",
                  category
                )}

              </div>

            </div>


            <!-- SAVE -->

            <button
              class="save-button"
              id="save-btn-${departure.id}"
              onclick="
                saveAvailability(
                  '${departure.id}'
                )
              "
            >

              ${
                existing
                ?
                "MODIFIER"
                :
                "ENREGISTRER"
              }

          </div>


        </div>

      `;

    }


    /* =====================================================
       CATEGORY BUTTON
    ===================================================== */

    function renderCategoryButton(
      departureId,
      category,
      selected
    ) {


      return `

        <button
          type="button"
          class="
            category-button
            ${
              getCategoryButtonClass(
                category
              )
            }
            ${
              selected ===
              category
              ?
              "active"
              :
              ""
            }
          "
          onclick="
            setCategory(
              '${departureId}',
              '${category}'
            )
          "
        >

          ${
            category ===
            "Hypercar"
            ?
            "HYPER"
            :
            category
          }

        </button>

      `;

    }


    /* =====================================================
       FORM STATE
    ===================================================== */

    function ensureFormState(
      departureId
    ) {

      if (
        !formState[
          departureId
        ]
      ) {

        formState[
          departureId
        ] = {

          status:
            "",

          category:
            ""

        };

      }


      return formState[
        departureId
      ];

    }


    /* =====================================================
       TOGGLE AVAILABILITY
    ===================================================== */

    function toggleAvailability(
      departureId,
      type
    ) {


      const state =
        ensureFormState(
          departureId
        );


      /*
       * Clicking a segment while
       * Whole / Absent is selected
       * starts a fresh selection.
       */

      if (
        state.status ===
          "whole" ||
        state.status ===
          "unavailable"
      ) {

        state.status =
          "";

      }


      let parts =
        state.status
          ?
          state.status.split(",")
          :
          [];


      if (
        parts.includes(
          type
        )
      ) {

        parts =
          parts.filter(
            part =>
              part !==
              type
          );

      } else {

        parts.push(
          type
        );

      }


      const order = [

        "beginning",

        "middle",

        "end"

      ];


      parts.sort(
        (a,b) =>
          order.indexOf(a) -
          order.indexOf(b)
      );


      /*
       * All 3 = Whole race
       */

      if (
        parts.length === 3
      ) {

        state.status =
          "whole";

      } else {

        state.status =
          parts.join(",");

      }


      /*
       * Immediately refresh
       * ONLY this departure.
       */

      refreshDepartureForm(
        departureId
      );

    }


    /* =====================================================
       SET AVAILABILITY
    ===================================================== */

    function setAvailability(
      departureId,
      status
    ) {


      const state =
        ensureFormState(
          departureId
        );


      state.status =
        status;


      refreshDepartureForm(
        departureId
      );

    }


    /* =====================================================
       SET CATEGORY
    ===================================================== */

    function setCategory(
      departureId,
      category
    ) {


      const state =
        ensureFormState(
          departureId
        );


      state.category =
        category;


      refreshDepartureForm(
        departureId
      );

    }


    /* =====================================================
       REFRESH ONE FORM
    ===================================================== */

    function refreshDepartureForm(
      departureId
    ) {


      const event =
        events.find(
          e =>
            e.id ===
            currentEventId
        );


      if (!event) {
        return;
      }


      const departureIndex =
        event.departures.findIndex(
          departure =>
            departure.id ===
            departureId
        );


      if (
        departureIndex === -1
      ) {

        return;

      }


      const departure =
        event.departures[
          departureIndex
        ];


      const form =
        document.querySelector(
          `.form-section:has(#name-${departureId})`
        );


      if (!form) {

        renderEvent();

        return;

      }


      /*
       * Keep current input value.
       */

      const input =
        document.getElementById(
          `name-${departureId}`
        );


      const name =
        input
        ?
        input.value
        :
        getPilotName();


      form.outerHTML =
        renderForm(
          event,
          departure,
          departureIndex
        );


      const newInput =
        document.getElementById(
          `name-${departureId}`
        );


      if (newInput) {

        newInput.value =
          name;

      }

    }


    /* =====================================================
       SAVE AVAILABILITY
    ===================================================== */

    function saveAvailability(
      departureId
    ) {


      const event =
        events.find(
          e =>
            e.id ===
            currentEventId
        );


      if (!event) {
        return;
      }


      const departure =
        event.departures.find(
          d =>
            d.id ===
            departureId
        );


      if (!departure) {
        return;
      }


      const globalName =
        getPilotName();


      if (!globalName) {

        alert(
          "Entre ton pseudo en haut de la page avant de renseigner tes disponibilités."
        );

        return;

      }


      const state =
        ensureFormState(
          departureId
        );


      let status =
        state.status ||
        "";


      let category =
        state.category ||
        "";


      /*
       * When editing, use the existing
       * values if nothing was changed.
       */

      if (
        editingPilot
      ) {


        const existing =
          departure.availability.find(
            pilot =>
              pilot.name.toLowerCase() ===
              editingPilot.toLowerCase()
          );


        if (existing) {

          if (!status) {

            status =
              existing.status;

          }


          if (!category) {

            category =
              existing.category;

          }

        }

      }


      if (!status) {

        alert(
          "Choisis ta disponibilité."
        );

        return;

      }


      if (
        status !==
          "unavailable" &&
        !category
      ) {

        alert(
          "Choisis ta catégorie."
        );

        return;

      }


      /*
       * Find the pilot.
       */

      const existingIndex =
        departure.availability.findIndex(
          pilot =>
            pilot.name.toLowerCase() ===
            globalName.toLowerCase()
        );


      /*
       * UPDATE
       */

      if (
        existingIndex !== -1
      ) {


        departure.availability[
          existingIndex
        ] = {

          ...departure.availability[
            existingIndex
          ],

          name:
            globalName,

          category:
            category,

          status:
            status

        };

      }


      /*
       * NEW
       */

      else {


        departure.availability.push({

          id:
            generateId(),

          name:
            globalName,

          category:
            category,

          status:
            status

        });

      }


      saveEvents();


      /*
       * Feedback visuel
       */

      const btn = document.getElementById(`save-btn-${departureId}`);
      if (btn) {
        const originalText = btn.textContent;
        btn.textContent = "✓ ENREGISTRÉ";
        btn.classList.add("saved");
        setTimeout(() => {
          btn.textContent = originalText;
          btn.classList.remove("saved");
        }, 1500);
      }


      /*
       * Clear this form state.
       */

      delete formState[
        departureId
      ];


      editingPilot =
        null;


      renderEvent();


      /*
       * Scroll back close to
       * the saved departure.
       */

      setTimeout(
        () => {

          const element =
            document.querySelector(
              `[data-departure-id="${departureId}"]`
            );


          if (element) {

            element.scrollIntoView({
              behavior:
                "smooth",
              block:
                "center"
            });

          }

        },
        50
      );

    }


    /* =====================================================
       EDIT PILOT
    ===================================================== */

    function editPilot(
      name
    ) {


      editingPilot =
        name;


      const event =
        events.find(
          e =>
            e.id ===
            currentEventId
        );


      if (!event) {
        return;
      }


      /*
       * Load this pilot's choices
       * for every departure.
       */

      event.departures.forEach(
        departure => {


          const pilot =
            departure.availability.find(
              p =>
                p.name.toLowerCase() ===
                name.toLowerCase()
            );


          if (pilot) {


            formState[
              departure.id
            ] = {

              status:
                pilot.status,

              category:
                pilot.category

            };

          }

        }
      );


      /*
       * Save the pseudo as global
       * pseudo too.
       */

      localStorage.setItem(
        "fmt_pilot_name",
        name
      );


      renderEvent();


      setTimeout(
        () => {


          const form =
            document.querySelector(
              ".form-section.editing"
            );


          if (form) {

            form.scrollIntoView({
              behavior:
                "smooth",

              block:
                "center"
            });

          }

        },
        50
      );

    }


    /* =====================================================
       CREATE EVENT
    ===================================================== */

    function showCreateEvent() {


      currentEventId =
        null;

      editingPilot =
        null;


      document.getElementById(
        "app"
      ).innerHTML = `

        <button
          class="back-button"
          onclick="renderHome()"
        >
          ← RETOUR
        </button>


        <div class="create-panel">

          <h2>
            NOUVEL ÉVÉNEMENT
          </h2>


          <div class="create-grid">


            <div class="field">

              <label>
                Nom de l'événement
              </label>

              <input
                id="event-name"
                type="text"
                placeholder="Ex : Spa 6H"
              >

            </div>


            <div class="field">

              <label>
                Circuit / lieu
              </label>

              <input
                id="event-location"
                type="text"
                placeholder="Ex : Spa-Francorchamps"
              >

            </div>


            <div class="field">

              <label>
                Départs
              </label>

              <div
                id="departure-fields"
              ></div>

            </div>


            <button
              class="small-button"
              onclick="
                addDepartureField()
              "
            >
              + AJOUTER UN DÉPART
            </button>


            <button
              class="create-submit"
              onclick="
                createEvent()
              "
            >
              CRÉER L'ÉVÉNEMENT
            </button>


          </div>

        </div>

      `;


      departureFieldCount =
        0;


      addDepartureField();

    }


    /* =====================================================
       ADD DEPARTURE FIELD
    ===================================================== */

    function addDepartureField(
      date = "",
      time = ""
    ) {


      const container =
        document.getElementById(
          "departure-fields"
        );


      if (!container) {
        return;
      }


      const id =
        `new-departure-${departureFieldCount++}`;


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "create-departure";


      div.innerHTML = `

        <div class="field">

          <label>
            Date
          </label>

          <input
            type="date"
            class="new-departure-date"
            value="${date}"
          >

        </div>


        <div class="field">

          <label>
            Heure
          </label>

          <input
            type="time"
            class="new-departure-time"
            value="${time}"
          >

        </div>


        <button
          class="small-button"
          type="button"
          onclick="
            this.parentElement.remove()
          "
        >
          ✕
        </button>

      `;


      container.appendChild(
        div
      );

    }


    /* =====================================================
       CREATE EVENT
    ===================================================== */

    function createEvent() {


      const name =
        document.getElementById(
          "event-name"
        ).value.trim();


      const location =
        document.getElementById(
          "event-location"
        ).value.trim();


      if (!name) {

        alert(
          "Entre un nom pour l'événement."
        );

        return;

      }


      const rows =
        document.querySelectorAll(
          ".create-departure"
        );


      const departures = [];


      rows.forEach(
        row => {


          const date =
            row.querySelector(
              ".new-departure-date"
            ).value;


          const time =
            row.querySelector(
              ".new-departure-time"
            ).value;


          if (
            date &&
            time
          ) {


            departures.push({

              id:
                generateId(),

              date:
                date,

              time:
                time,

              availability:
                []

            });

          }

        }
      );


      if (
        departures.length === 0
      ) {

        alert(
          "Ajoute au moins un départ."
        );

        return;

      }


      departures.sort(
        (a,b) =>
          getDepartureTimestamp(
            a
          ) -
          getDepartureTimestamp(
            b
          )
      );


      const event = {

        id:
          generateId(),

        name:
          name,

        location:
          location,

        departures:
          departures

      };


      events.push(
        event
      );


      saveEvents();


      openEvent(
        event.id
      );

    }


    /* =====================================================
       INITIAL DATA
    ===================================================== */

    if (
      events.length === 0
    ) {


      events.push({

        id:
          generateId(),

        name:
          "Spa 6H",

        location:
          "Spa-Francorchamps",

        departures: [

          {

            id:
              generateId(),

            date:
              "2026-09-04",

            time:
              "20:00",

            availability:
              []

          },


          {

            id:
              generateId(),

            date:
              "2026-09-05",

            time:
              "14:00",

            availability:
              []

          },


          {

            id:
              generateId(),

            date:
              "2026-09-05",

            time:
              "20:00",

            availability:
              []

          },


          {

            id:
              generateId(),

            date:
              "2026-09-06",

            time:
              "15:00",

            availability:
              []

          }

        ]

      });


      saveEvents();

    }


    /* =====================================================
       START
    ===================================================== */

    renderHome();


    /*
     * Countdown updates only.
     * The page itself is NOT rerendered every second.
     */

    setInterval(
      updateCountdowns,
      1000
    );


  </script>

</body>
</html>
