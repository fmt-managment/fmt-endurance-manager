<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FMT ENDURANCE</title>

<style>

/* =========================================================
   VARIABLES
========================================================= */

:root {
  --bg: #090a0b;
  --panel: #111315;
  --panel2: #17191c;
  --panel3: #1d2023;
  --border: #292d31;

  --text: #f2f2f2;
  --muted: #92979c;

  --blue: #2589d8;
  --green: #31b86b;
  --yellow: #e4c341;
  --red: #e34c4c;

  --accent: #7ee38f;
}


/* =========================================================
   BASE
========================================================= */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

button,
input {
  font-family: inherit;
}

button {
  cursor: pointer;
}


/* =========================================================
   BARRE ARC / FMT
========================================================= */

.top-stripes {
  height: 5px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
}

.top-stripes div:nth-child(1) {
  background: var(--blue);
}

.top-stripes div:nth-child(2) {
  background: var(--green);
}

.top-stripes div:nth-child(3) {
  background: var(--yellow);
}

.top-stripes div:nth-child(4) {
  background: var(--red);
}


/* =========================================================
   HEADER
========================================================= */

header {
  background: #0d0f10;
  border-bottom: 1px solid var(--border);
  padding: 18px 20px;
}

.header-inner {
  max-width: 1100px;
  margin: auto;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 15px;
}

.logo {
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 2px;
}

.logo span {
  color: var(--green);
}


/* =========================================================
   MAIN
========================================================= */

main {
  max-width: 1100px;
  margin: auto;
  padding: 25px 18px 50px;
}

.page-title {
  font-size: 28px;
  font-weight: 900;
  margin-bottom: 5px;
}

.page-subtitle {
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 25px;
}


/* =========================================================
   BOUTONS GENERAUX
========================================================= */

.primary-button {
  border: 0;
  background: var(--green);
  color: #07100a;

  font-weight: 900;

  padding: 11px 16px;

  border-radius: 4px;
}

.primary-button:hover {
  filter: brightness(1.08);
}

.secondary-button {
  border: 1px solid var(--border);
  background: var(--panel2);
  color: var(--text);

  font-weight: 800;

  padding: 10px 15px;

  border-radius: 4px;
}

.secondary-button:hover {
  background: var(--panel3);
}

.back-button {
  margin-bottom: 20px;
}


/* =========================================================
   CARTES EVENEMENTS
========================================================= */

.event-list {
  display: grid;
  gap: 12px;
}

.event-card {
  position: relative;

  overflow: hidden;

  background: var(--panel);

  border: 1px solid var(--border);

  border-radius: 7px;

  padding: 17px 18px 17px 23px;

  cursor: pointer;

  transition: .15s;
}

.event-card:hover {
  background: var(--panel2);

  border-color: #3a4045;

  transform: translateX(2px);
}

.event-card::before {
  content: "";

  position: absolute;

  left: 0;
  top: 0;
  bottom: 0;

  width: 5px;

  background: var(--green);
}

.event-name {
  font-size: 17px;
  font-weight: 900;

  margin-bottom: 7px;
}

.event-info {
  color: var(--muted);
  font-size: 12px;
}

.event-countdown {
  margin-top: 10px;

  color: var(--green);

  font-size: 12px;
  font-weight: 800;
}

.event-countdown.finished {
  color: var(--muted);
}


/* =========================================================
   FORMULAIRE CREATION
========================================================= */

.empty {
  background: var(--panel);

  border: 1px dashed var(--border);

  padding: 30px;

  text-align: center;

  color: var(--muted);

  border-radius: 6px;
}

.form-panel {
  background: var(--panel);

  border: 1px solid var(--border);

  border-radius: 7px;

  padding: 20px;
}

.form-group {
  margin-bottom: 18px;
}

.form-label {
  display: block;

  color: var(--muted);

  font-size: 11px;
  font-weight: 900;

  text-transform: uppercase;

  margin-bottom: 8px;

  letter-spacing: .5px;
}

input {
  width: 100%;

  background: var(--panel2);

  border: 1px solid var(--border);

  color: var(--text);

  border-radius: 4px;

  padding: 11px;

  outline: none;
}

input:focus {
  border-color: var(--green);
}

.departure-fields {
  display: grid;
  gap: 10px;
}

.departure-field {
  display: grid;

  grid-template-columns: 1fr 140px 40px;

  gap: 8px;

  align-items: center;
}

.remove-departure {
  height: 38px;

  border: 1px solid var(--border);

  background: #211719;

  color: var(--red);

  border-radius: 4px;

  font-weight: 900;
}


/* =========================================================
   HEADER EVENEMENT
========================================================= */

.event-header {
  margin-bottom: 22px;
}

.event-title {
  font-size: 27px;
  font-weight: 900;

  margin-bottom: 5px;
}

.event-subtitle {
  color: var(--muted);
  font-size: 12px;
}


/* =========================================================
   NOM PILOTE
========================================================= */

.pilot-name-panel {
  background: var(--panel);

  border: 1px solid var(--border);

  border-radius: 7px;

  padding: 15px;

  margin-bottom: 18px;
}

.pilot-name-panel input {
  max-width: 450px;
}


/* =========================================================
   DEPART
========================================================= */

.departures {
  display: grid;
  gap: 14px;
}

.departure {
  overflow: hidden;

  background: var(--panel);

  border: 1px solid var(--border);

  border-radius: 7px;

  transition: .2s;
}

.departure.finished {
  opacity: .62;

  border-color: #222528;
}

.departure.finished:hover {
  opacity: .82;
}

.departure-header {
  display: flex;

  justify-content: space-between;
  align-items: center;

  gap: 15px;

  padding: 14px 16px;

  background: var(--panel2);

  border-bottom: 1px solid var(--border);
}

.departure.finished .departure-header {
  background: #101214;

  border-bottom: 0;
}

.departure-date {
  font-size: 13px;

  font-weight: 900;

  text-transform: uppercase;
}

.departure-time {
  margin-left: 7px;

  color: var(--green);
}

.departure.finished .departure-time {
  color: var(--muted);
}

.departure-countdown {
  color: var(--muted);

  font-size: 11px;

  text-align: right;

  white-space: nowrap;
}

.departure-countdown.upcoming {
  color: var(--green);

  font-weight: 800;
}

.departure-countdown.finished {
  color: var(--muted);
}

.finished-label {
  margin-left: auto;

  margin-right: 10px;

  color: var(--muted);

  font-size: 10px;

  font-weight: 900;

  letter-spacing: 1px;
}

.departure-toggle {
  border: 1px solid var(--border);

  background: #1c1f22;

  color: var(--muted);

  padding: 6px 9px;

  border-radius: 3px;

  font-size: 10px;

  font-weight: 900;
}

.departure-toggle:hover {
  background: #25292c;

  color: var(--text);
}


/* =========================================================
   LISTE PILOTES
========================================================= */

.pilot-section {
  padding: 12px;
}

.pilot-section-title {
  color: var(--muted);

  font-size: 10px;

  font-weight: 900;

  letter-spacing: 1px;

  margin-bottom: 7px;
}

.pilot-list {
  display: grid;

  gap: 4px;
}


/* =========================================================
   GROUPES CATEGORIES
========================================================= */

.category-group {
  margin-bottom: 10px;
}

.category-group:last-child {
  margin-bottom: 0;
}

.category-group-header {
  display: flex;

  align-items: center;

  gap: 7px;

  padding: 6px 7px;

  margin-bottom: 4px;

  background: #0e1011;

  border-left: 3px solid var(--border);

  font-size: 9px;

  font-weight: 900;

  letter-spacing: 1px;

  color: var(--muted);
}

.category-group-header img {
  width: 25px;
  height: 17px;

  object-fit: contain;
}

.category-group-header.hyper {
  border-left-color: var(--blue);
}

.category-group-header.lmp2 {
  border-left-color: var(--green);
}

.category-group-header.lmp3 {
  border-left-color: var(--yellow);
}

.category-group-header.gt3 {
  border-left-color: var(--red);
}

.category-count {
  margin-left: auto;

  color: #656a6f;

  font-size: 8px;
}


/* =========================================================
   LIGNE PILOTE
========================================================= */

.pilot-row {
  display: grid;

  grid-template-columns:
    minmax(100px, 1fr)
    30px
    78px
    30px;

  align-items: center;

  gap: 8px;

  min-height: 34px;

  padding: 5px 7px;

  background: var(--panel2);

  border: 1px solid rgba(255,255,255,.035);

  border-radius: 4px;
}

.pilot-name {
  font-size: 12px;

  font-weight: 800;

  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;
}


/* Petit logo catégorie */

.pilot-category-logo {
  width: 30px;
  height: 25px;

  display: flex;

  align-items: center;
  justify-content: center;
}

.pilot-category-logo img {
  max-width: 30px;
  max-height: 22px;

  object-fit: contain;
}


/* =========================================================
   BARRE DISPONIBILITE PILOTE
========================================================= */

.availability-bar {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 2px;

  height: 17px;
}

.availability-segment {
  background: #292d31;

  border-radius: 2px;
}

.availability-segment.beginning.active {
  background: var(--green);
}

.availability-segment.middle.active {
  background: var(--yellow);
}

.availability-segment.end.active {
  background: var(--red);
}

.availability-whole {
  grid-column: 1 / 4;

  background: var(--green);

  border-radius: 2px;
}

.availability-unavailable {
  grid-column: 1 / 4;

  background: #35383b;

  border-radius: 2px;
}


/* =========================================================
   EDIT
========================================================= */

.edit-button {
  width: 28px;
  height: 25px;

  border: 1px solid var(--border);

  border-radius: 3px;

  background: #25282b;

  color: var(--muted);

  font-size: 11px;
}

.edit-button:hover {
  color: var(--text);

  background: #303438;
}


/* =========================================================
   FORMULAIRE INSCRIPTION
========================================================= */

.form-section {
  padding: 13px;

  border-top: 1px solid var(--border);

  background: #0f1112;
}

.form-section.editing {
  border-top-color: var(--green);
}

.form-title {
  font-size: 10px;

  font-weight: 900;

  margin-bottom: 8px;

  text-transform: uppercase;

  color: var(--muted);

  letter-spacing: .7px;
}


/* =========================================================
   NOUVELLE BARRE DE DISPONIBILITE
========================================================= */

.relay-container {
  margin-bottom: 10px;
}

.relay-bar {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 3px;

  background: #0a0c0d;

  padding: 3px;

  border: 1px solid var(--border);

  border-radius: 6px;

  height: 48px;
}

.relay-button {
  border: 0;

  background: #202427;

  color: #777d82;

  font-size: 9px;

  font-weight: 900;

  letter-spacing: .5px;

  position: relative;

  transition: .12s;
}

.relay-button:first-child {
  border-radius: 4px 2px 2px 4px;
}

.relay-button:last-child {
  border-radius: 2px 4px 4px 2px;
}

.relay-button:hover {
  background: #292d31;

  color: white;
}

.relay-button.active.beginning {
  background: var(--green);

  color: #07100a;
}

.relay-button.active.middle {
  background: var(--yellow);

  color: #151200;
}

.relay-button.active.end {
  background: var(--red);

  color: white;
}


/* =========================================================
   OPTIONS SPECIALES
========================================================= */

.special-availability {
  display: flex;

  gap: 5px;

  margin-bottom: 12px;
}

.special-button {
  border: 1px solid var(--border);

  background: var(--panel2);

  color: var(--muted);

  border-radius: 4px;

  padding: 7px 11px;

  font-size: 9px;

  font-weight: 900;

  flex: 1;
}

.special-button:hover {
  background: var(--panel3);

  color: var(--text);
}

.special-button.active.whole {
  background: var(--green);

  border-color: var(--green);

  color: #07100a;
}

.special-button.active.unavailable {
  background: #3b3e41;

  border-color: #555a5e;

  color: white;
}


/* =========================================================
   CATEGORIES
========================================================= */

.category-area {
  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 12px;

  padding-top: 4px;
}

.category-label {
  color: var(--muted);

  font-size: 9px;

  font-weight: 900;

  letter-spacing: .7px;

  white-space: nowrap;
}

.categories {
  display: flex;

  justify-content: flex-end;

  gap: 5px;

  flex-wrap: wrap;
}

.category-button {
  width: 82px;
  height: 40px;

  border: 1px solid var(--border);

  background: var(--panel2);

  color: var(--muted);

  border-radius: 4px;

  font-weight: 900;

  font-size: 8px;

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 4px;

  transition: .12s;
}

.category-button img {
  max-width: 42px;
  max-height: 23px;

  object-fit: contain;
}

.category-button:hover {
  background: var(--panel3);

  color: var(--text);
}

.category-button.active.hyper {
  background: var(--blue);

  border-color: var(--blue);

  color: #071017;
}

.category-button.active.lmp2 {
  background: var(--green);

  border-color: var(--green);

  color: #07100a;
}

.category-button.active.lmp3 {
  background: var(--yellow);

  border-color: var(--yellow);

  color: #151200;
}

.category-button.active.gt3 {
  background: var(--red);

  border-color: var(--red);

  color: white;
}


/* =========================================================
   SAUVEGARDE
========================================================= */

.save-row {
  margin-top: 12px;

  display: flex;

  justify-content: flex-end;
}

.save-button {
  border: 0;

  background: var(--accent);

  color: #07100a;

  font-size: 10px;

  font-weight: 900;

  padding: 9px 15px;

  border-radius: 4px;
}

.save-button:hover {
  filter: brightness(1.08);
}


/* =========================================================
   HISTORIQUE
========================================================= */

.finished-history {
  padding: 10px 12px;

  border-top: 1px solid var(--border);

  color: var(--muted);

  font-size: 9px;

  text-transform: uppercase;

  letter-spacing: .6px;
}


/* =========================================================
   LEGENDE
========================================================= */

.legend {
  padding: 10px 12px;

  border-top: 1px solid var(--border);

  color: var(--muted);

  font-size: 9px;
}

.legend span {
  margin-right: 10px;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

  main {
    padding: 18px 10px 40px;
  }

  .departure-header {
    align-items: flex-start;
  }

  .departure-countdown {
    font-size: 9px;
  }

  .departure-field {
    grid-template-columns:
      1fr
      105px
      38px;
  }

  .pilot-row {
    grid-template-columns:
      minmax(80px, 1fr)
      30px
      70px
      28px;
  }

  .category-area {
    align-items: flex-start;

    flex-direction: column;

    gap: 7px;
  }

  .categories {
    width: 100%;

    justify-content: flex-start;
  }

  .category-button {
    width: 75px;
  }

  .finished-label {
    display: none;
  }
}

</style>
</head>


<body>


<!-- =====================================================
     BARRE COULEURS
====================================================== -->

<div class="top-stripes">
  <div></div>
  <div></div>
  <div></div>
  <div></div>
</div>


<!-- =====================================================
     HEADER
====================================================== -->

<header>

  <div class="header-inner">

    <div class="logo">
      FMT <span>ENDURANCE</span>
    </div>

    <button
      class="primary-button"
      onclick="showCreateEvent()"
    >
      + ÉVÉNEMENT
    </button>

  </div>

</header>


<main id="app"></main>


<script>


/* =========================================================
   DONNEES
========================================================= */

let events = JSON.parse(
  localStorage.getItem("fmt_endurance_events") || "[]"
);

let currentEventId = null;

let editingPilot = null;

let departureFieldCount = 0;

const formState = {};

const collapsedDepartures = {};


/* =========================================================
   IMAGES CATEGORIES
========================================================= */

const categoryImages = {

  Hypercar: "images/HC.png",

  LMP2: "images/LMP2.png",

  LMP3: "images/P3.png",

  GT3: "images/GT3.png"

};


/* =========================================================
   SAUVEGARDE
========================================================= */

function saveEvents() {

  localStorage.setItem(
    "fmt_endurance_events",
    JSON.stringify(events)
  );

}


/* =========================================================
   NOM PILOTE
========================================================= */

function getPilotName() {

  return localStorage.getItem(
    "fmt_pilot_name"
  ) || "";

}


function setPilotName(name) {

  localStorage.setItem(
    "fmt_pilot_name",
    name.trim()
  );

}


/* =========================================================
   UTILITAIRES
========================================================= */

function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function escapeJs(value) {

  return String(value || "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'");

}


function generateId() {

  return Math.random()
    .toString(36)
    .substring(2, 8);

}


function formatLongDate(date) {

  return new Date(date)
    .toLocaleDateString(
      "fr-FR",
      {
        weekday: "long",
        day: "2-digit",
        month: "long",
        year: "numeric"
      }
    );

}


function getDepartureTimestamp(departure) {

  return new Date(
    departure.date +
    "T" +
    departure.time
  ).getTime();

}


function formatCountdown(target) {

  const diff =
    target - Date.now();

  if (diff <= 0) {
    return null;
  }

  const totalSeconds =
    Math.floor(diff / 1000);

  const days =
    Math.floor(
      totalSeconds / 86400
    );

  const hours =
    Math.floor(
      (totalSeconds % 86400) / 3600
    );

  const minutes =
    Math.floor(
      (totalSeconds % 3600) / 60
    );

  const seconds =
    totalSeconds % 60;


  if (days > 0) {

    return `${days}j ${hours}h ${minutes}m`;

  }


  if (hours > 0) {

    return `${hours}h ${minutes}m ${seconds}s`;

  }


  if (minutes > 0) {

    return `${minutes}m ${seconds}s`;

  }


  return `${seconds}s`;

}


/* =========================================================
   COMPTEURS
========================================================= */

function updateCountdowns() {

  let refreshEvent = false;


  document
    .querySelectorAll("[data-countdown]")
    .forEach(element => {

      const target =
        Number(
          element.dataset.countdown
        );

      const countdown =
        formatCountdown(target);

      const wasFinished =
        element.classList.contains(
          "finished"
        );


      if (!countdown) {

        element.textContent =
          "🏁 Départ passé";

        element.classList.remove(
          "upcoming"
        );

        element.classList.add(
          "finished"
        );


        if (
          !wasFinished &&
          currentEventId
        ) {

          refreshEvent = true;

        }

      } else {

        element.textContent =
          "⏱ " + countdown;

        element.classList.remove(
          "finished"
        );

        element.classList.add(
          "upcoming"
        );

      }

    });


  document
    .querySelectorAll(
      "[data-event-countdown]"
    )
    .forEach(element => {

      const target =
        Number(
          element.dataset.eventCountdown
        );

      const countdown =
        formatCountdown(target);


      if (!countdown) {

        element.textContent =
          "🏁 Événement terminé";

        element.classList.add(
          "finished"
        );

      } else {

        element.textContent =
          "⏱ Prochain départ dans " +
          countdown;

        element.classList.remove(
          "finished"
        );

      }

    });


  if (
    refreshEvent &&
    currentEventId
  ) {

    renderEvent();

  }

}


/* =========================================================
   ACCUEIL
========================================================= */

function renderHome() {

  currentEventId = null;

  editingPilot = null;


  let html = `

    <div class="page-title">
      ÉVÉNEMENTS
    </div>

    <div class="page-subtitle">
      Gestion des courses d'endurance FMT
    </div>

  `;


  if (!events.length) {

    html += `

      <div class="empty">
        Aucun événement créé.
      </div>

    `;

  } else {

    html += `
      <div class="event-list">
    `;


    events.forEach(event => {

      const futureDepartures =
        event.departures
          .filter(
            d =>
              getDepartureTimestamp(d) >
              Date.now()
          )
          .sort(
            (a, b) =>
              getDepartureTimestamp(a) -
              getDepartureTimestamp(b)
          );


      const nextDeparture =
        futureDepartures[0];


      html += `

        <div
          class="event-card"
          onclick="openEvent('${escapeJs(

function openEvent(id) {

  Object.keys(formState)

/* =========================================================

========================================================= */

function renderEvent() {

    return;

  }

        Ton pseudo pilote
      </label>

        value="${escapeHtml(
          getPilotName()
        )}"

/* =========================================================
   DEPART
========================================================= */

function renderDeparture(
  event,
  departure,
  departureIndex
) {

  const timestamp =
    getDepartureTimestamp(
      departure
    );


  const finished =
    timestamp <= Date.now();


  if (
    finished &&
    collapsedDepartures[
      departure.id
    ] === undefined
  ) {

    collapsedDepartures[
      departure.id
    ] = true;

  }


  const collapsed =
    finished &&
    collapsedDepartures[
      departure.id
    ];


  const availablePilots =
    departure.availability
      .filter(
        pilot =>
          pilot.status !==
          "unavailable"
      );


  let html = `

    <div
      class="departure ${
        finished ? "finished" : ""
      }"
      data-departure-id="${escapeHtml(
        departure.id
      )}"
    >

      <div class="departure-header">

        <div class="departure-date">

          ${escapeHtml(
            formatLongDate(
              departure.date
            )
          )}

          <span class="departure-time">

            ${escapeHtml(
              departure.time
            )}

          </span>

        </div>

  `;


  if (finished) {

    html += `

        <div class="finished-label">
          TERMINÉ
        </div>

        <button
          class="departure-toggle"
          onclick="toggleDeparture('${escapeJs(
            departure.id
          )}')"
        >

          ${
            collapsed
              ? "AFFICHER"
              : "MASQUER"
          }

        </button>

    `;

  } else {

    html += `

        <div
          class="departure-countdown upcoming"
          data-countdown="${timestamp}"
        >

          ⏱ ${
            formatCountdown(
              timestamp
            ) || "Départ passé"
          }

        </div>

    `;

  }


  html += `
      </div>
  `;


  /*
    Départ terminé fermé
  */

  if (
    finished &&
    collapsed
  ) {

    html += `
      </div>
    `;

    return html;

  }


  /*
    Liste pilotes
  */

  html += `

    <div class="pilot-section">

      <div class="pilot-section-title">

        ${
          finished
            ? "HISTORIQUE DES PILOTES"
            : "PILOTES INSCRITS"
        }

      </div>

      <div class="pilot-list">

  `;


  if (!availablePilots.length) {

    html += `

      <div class="no-pilots">
        Aucun pilote inscrit.
      </div>

    `;

  } else {

    html += renderPilotGroups(
      availablePilots,
      finished
    );

  }


  html += `

      </div>

    </div>

  `;


  if (finished) {

    html += `

      <div class="finished-history">

        🏁 Départ terminé —
        inscriptions verrouillées

      </div>

    `;

  } else {

    html += renderForm(
      event,
      departure,
      departureIndex
    );


    html += `

      <div class="legend">

        <span>🟢 Début</span>
        <span>🟡 Milieu</span>
        <span>🔴 Fin</span>
        <span>🟢 Toute la course</span>

      </div>

    `;

  }


  html += `
    </div>
  `;


  return html;

}


/* =========================================================
   GROUPES PILOTES PAR CATEGORIE
========================================================= */

function renderPilotGroups(
  pilots,
  finished
) {

  const categories = [
    "Hypercar",
    "LMP2",
    "LMP3",
    "GT3"
  ];


  let html = "";


  categories.forEach(
    category => {

      const group =
        pilots
          .filter(
            pilot =>
              pilot.category ===
              category
          )
          .sort(
            (a, b) =>
              a.name.localeCompare(
                b.name,
                "fr"
              )
          );


      if (!group.length) {
        return;
      }


      const groupClass =
        getCategoryButtonClass(
          category
        );


      html += `

        <div class="category-group">

          <div
            class="
              category-group-header
              ${groupClass}
            "
          >

            <img
              src="${
                categoryImages[
                  category
                ]
              }"
              alt=""
              onerror="this.style.display='none'"
            >

            <span>
              ${category.toUpperCase()}
            </span>

            <span class="category-count">

              ${group.length}
              pilote${
                group.length > 1
                  ? "s"
                  : ""
              }

            </span>

          </div>

      `;


      group.forEach(
        pilot => {

          html += renderPilotRow(
            pilot,
            finished
          );

        }
      );


      html += `
        </div>
      `;

    }
  );


  return html;

}

  }

}

  */

}


/* =========================================================
   TOGGLE DISPONIBILITE
========================================================= */

function toggleAvailability(
  departureId,
  type
) {

  const event =
    events.find(
      e =>
        e.id ===
        currentEventId
    );


  const departure =
    event?.departures.find(
      d =>
        d.id ===
        departureId
    );


  if (
    !departure ||
    getDepartureTimestamp(
      departure
    ) <= Date.now()
  ) {

    return;

  }


  ensureFormState(
    departureId
  );


  const state =
    formState[
      departureId
    ];


  /*
    Une sélection de relais
    désactive les options spéciales.
  */

  state.whole = false;

  state.unavailable = false;


  state[type] =
    !state[type];


  /*
    Les trois relais =
    toute la course.
  */

  if (
    state.beginning &&
    state.middle &&
    state.end
  ) {

    state.beginning = false;

    state.middle = false;

    state.end = false;

    state.whole = true;

  }


  refreshDepartureForm(
    departureId
  );

}

   DISPONIBILITE SPECIALE

/* =========================================================
   ENREGISTRER INSCRIPTION
========================================================= */

function saveAvailability(
  departureId
) {

  const event =
    events.find(
      e =>
        e.id ===
        currentEventId
    );


  if (!event) return;


  const departure =
    event.departures.find(
      d =>
        d.id ===
        departureId
    );


  if (!departure) return;


  if (
    getDepartureTimestamp(
      departure
    ) <= Date.now()
  ) {

    alert(
      "Ce départ est terminé. Les inscriptions sont verrouillées."
    );

    return;

  }


  const name =
    getPilotName().trim();


  if (!name) {

    alert(
      "Entre d'abord ton pseudo pilote."
    );

    document
      .getElementById(
        "globalPilotName"
      )
      ?.focus();

    return;

  }


  ensureFormState(
    departureId
  );


  const state =
    formState[
      departureId
    ];


  let status = "";


  if (
    state.unavailable
  ) {

    status =
      "unavailable";

  } else if (
    state.whole
  ) {

    status =
      "whole";

  } else {

    const parts = [];


    if (
      state.beginning
    ) {

      parts.push(
        "beginning"
      );

    }


    if (
      state.middle
    ) {

      parts.push(
        "middle"
      );

    }


    if (
      state.end
    ) {

      parts.push(
        "end"
      );

    }


    status =
      parts.join(",");

  }


  if (!status) {

    alert(
      "Choisis ta disponibilité."
    );

    return;

  }


  if (
    status !==
      "unavailable" &&
    !state.category
  ) {

    alert(
      "Choisis ta catégorie."
    );

    return;

  }


  const existingIndex =
    departure.availability
      .findIndex(
        pilot =>
          pilot.name
            .toLowerCase() ===
          name.toLowerCase()
      );


  const pilotData = {

    id:
      existingIndex >= 0
        ? departure
            .availability[
              existingIndex
            ].id
        : generateId(),

    name,

    category:
      status ===
        "unavailable"
        ? ""
        : state.category,

    status

  };


  if (
    existingIndex >= 0
  ) {

    departure.availability[
      existingIndex
    ] = pilotData;

  } else {

    departure.availability.push(
      pilotData
    );

  }


  setPilotName(name);

  saveEvents();


  delete formState[
    departureId
  ];


  editingPilot = null;


  renderEvent();


  setTimeout(() => {

    const element =
      document.querySelector(
        `[data-departure-id="${departureId}"]`
      );


    if (element) {

      element.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });

    }

  }, 50);

}


/* =========================================================
   MODIFIER PILOTE
========================================================= */

function editPilot(name) {

  const event =
    events.find(
      e =>
        e.id ===
        currentEventId
    );


  if (!event) return;


  const editableDeparture =
    event.departures.some(
      departure =>
        getDepartureTimestamp(
          departure
        ) > Date.now()
    );


  if (!editableDeparture) {
    return;
  }


  editingPilot = name;

  setPilotName(name);


  event.departures.forEach(
    departure => {

      if (
        getDepartureTimestamp(
          departure
        ) <= Date.now()
      ) {

        return;

      }


      const pilot =
        departure.availability
          .find(
            p =>
              p.name
                .toLowerCase() ===
              name.toLowerCase()
          );


      ensureFormState(
        departure.id
      );


      const state =
        formState[
          departure.id
        ];


      state.beginning =
        false;

      state.middle =
        false;

      state.end =
        false;

      state.whole =
        false;

      state.unavailable =
        false;

      state.category =
        "";


      if (!pilot) {
        return;
      }


      if (
        pilot.status ===
        "whole"
      ) {

        state.whole =
          true;

      } else if (
        pilot.status ===
        "unavailable"
      ) {

        state.unavailable =
          true;

      } else {

        const parts =
          pilot.status
            .split(",");


        state.beginning =
          parts.includes(
            "beginning"
          );

        state.middle =
          parts.includes(
            "middle"
          );

        state.end =
          parts.includes(
            "end"
          );

      }


      state.category =
        pilot.category || "";

    }
  );


  renderEvent();


  setTimeout(() => {

    const form =
      document.querySelector(
        ".form-section.editing"
      );


    if (form) {

      form.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });

    }

  }, 50);

}

  if (!departure) return;


  if (

}

      NOUVEL ÉVÉNEMENT
    </div>


    <div class="page-subtitle">
      Créer une nouvelle course d'endurance
    </div>


    <div class="form-panel">

      <div class="form-group">

        <label class="form-label">
          Nom de l'événement
        </label>

        <input
          id="eventName"
          type="text"
          placeholder="Ex : Spa 6H"
        >

      </div>


      <div class="form-group">

        <label class="form-label">
          Départs
        </label>

        <div
          id="departureFields"
          class="departure-fields"
        ></div>

      </div>


      <button
        class="secondary-button"
        onclick="addDepartureField()"
      >
        + Ajouter un départ
      </button>


      <div style="height:15px"></div>


      <button
        class="primary-button"
        onclick="createEvent()"
      >
        CRÉER L'ÉVÉNEMENT
      </button>

    </div>

  `;


  addDepartureField();

}


/* =========================================================
   AJOUT DEPART
========================================================= */

function addDepartureField(
  date = "",
  time = ""
) {

  departureFieldCount++;


  const id =
    "departureField" +
    departureFieldCount;


  const container =
    document.getElementById(
      "departureFields"
    );


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "departure-field";


  div.id = id;


  div.innerHTML = `

    <input
      type="date"
      class="new-departure-date"
      value="${date}"
    >


    <input
      type="time"
      class="new-departure-time"
      value="${time}"
    >


    <button
      class="remove-departure"
      onclick="document.getElementById('${id}').remove()"
    >
      ×
    </button>

  `;


  container.appendChild(
    div
  );

}


/* =========================================================
   CREER EVENEMENT
========================================================= */

function createEvent() {

  const name =
    document
      .getElementById(
        "eventName"
      )
      .value
      .trim();


  if (!name) {

    alert(
      "Donne un nom à l'événement."
    );

    return;

  }


  const fields =
    document.querySelectorAll(
      ".departure-field"
    );


  const departures = [];


  fields.forEach(
    field => {

      const date =
        field
          .querySelector(
            ".new-departure-date"
          )
          .value;


      const time =
        field
          .querySelector(
            ".new-departure-time"
          )
          .value;


      if (
        date &&
        time
      ) {

        departures.push({

          id:
            generateId(),

          date,

          time,

          availability: []

        });

      }

    }
  );


  if (!departures.length) {

    alert(
      "Ajoute au moins un départ avec une date et une heure."
    );

    return;

  }


  departures.sort(
    (a, b) =>
      getDepartureTimestamp(a) -
      getDepartureTimestamp(b)
  );


  const newEvent = {

    id:
      generateId(),

    name,

    departures

  };


  events.push(
    newEvent
  );


  saveEvents();


  openEvent(
    newEvent.id
  );

}
